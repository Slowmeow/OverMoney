   * дозаполнять пустые ячейки. А вот план без норм или без подсчитанного
   * КБЖУ восстановить нечем: эти цифры считает планировщик, которого здесь
   * нет. Такой план лучше забыть — неделя пересобирается одной кнопкой,
   * а вот выковырять окирпиченное приложение из браузера человеку нечем. */
  function sanePlan(plan) {
    if (!asObject(plan, null)) return null;
    if (!Array.isArray(plan.days) || !plan.days.length) return null;
    if (!asObject(plan.targets, null) || !asObject(plan.nutrition, null)) return null;

    plan.days = plan.days.filter(d => asObject(d, null) && Array.isArray(d.meals));
    if (!plan.days.length) return null;

    plan.days.forEach(function (day) {
      day.meals = day.meals.filter(m => asObject(m, null));
      day.meals.forEach(function (meal) {
        const r = asObject(meal.recipe, null);
        const ingOk = r && Array.isArray(r.ing) &&
          r.ing.every(i => asObject(i, null) && i.p !== undefined);
        if (!ingOk) { meal.recipe = null; meal.leftoverOf = null; return; }
        // Количество обязано быть числом: на него умножают в каждом расчёте,
        // и одна строка превращает всю неделю в NaN.
        r.ing.forEach(i => { const g = Number(i.g); i.g = isFinite(g) && g >= 0 ? g : 0; });
        const mult = Number(meal.mult);
        meal.mult = isFinite(mult) && mult > 0 ? mult : 1;
      });
    });

    plan.notes = asArray(plan.notes, []);
    plan.swaps = asRecords(plan.swaps, ['from', 'to']);
    plan.replacements = asRecords(plan.replacements, ['to']);
    return plan;
  }

  /* Дозаполняем поля, появившиеся в новых версиях, чтобы старые сохранения не ломались. */
  function migrate(saved) {
    saved = asObject(saved, {});

    /* Два отдельных набора значений по умолчанию, и это не расточительность.
     *
     * Object.assign(base, saved) возвращает тот самый base, а не копию: он его
     * же и портит. Значит запасное значение вида base.regulars, взятое после
     * этой строки, — уже не значение по умолчанию, а то самое мусорное поле
     * из файла, от которого мы и защищаемся. Проверка при этом выглядит
     * совершенно правильной и молча пропускает всё. Поэтому pristine
     * заводится заранее и до конца остаётся нетронутым. */
    const pristine = defaultState();
    const base = defaultState();
    const merged = Object.assign(base, saved);

    merged.settings = Object.assign(pristine.settings, asObject(saved.settings, {}));
    merged.regulars = saved.regulars === undefined
      ? pristine.regulars
      : asRecords(saved.regulars, ['p']);
    merged.pantry = asNumberMap(saved.pantry);
    merged.excluded = asObject(saved.excluded, {});
    merged.prices = asObject(saved.prices, {});
    merged.priceLog = asRecords(saved.priceLog, ['p', 'pr']);
    merged.brandChoice = asObject(saved.brandChoice, {});
    merged.dismissedSwaps = asObject(saved.dismissedSwaps, {});
    // Названия магазинов идут в подписи и в выпадающие списки — там ждут строку.
    merged.stores = asArray(saved.stores, pristine.stores).filter(x => typeof x === 'string');
    if (!merged.stores.length) merged.stores = pristine.stores;
    // Свой продукт без кода или названия не продукт: по коду его ищут рецепты,
    // по названию сортируют список цен.
    merged.customProducts = asRecords(saved.customProducts, ['id', 'n']);
    merged.customRecipes = asRecords(saved.customRecipes, ['id', 'n', 'ing'])
      .filter(r => Array.isArray(r.ing) && Array.isArray(r.m));
    merged.disabledRecipes = asObject(saved.disabledRecipes, {});
    merged.listState = asObject(saved.listState, {});
    merged.pantryDates = asObject(saved.pantryDates, {});
    // Каждая неделя проверяется тем же разбором, что и текущий план:
    // битая неделя из месяца не должна валить календарь целиком.
    merged.weeks = {};
    const savedWeeks = asObject(saved.weeks, {});
    Object.keys(savedWeeks).forEach(function (k) {
      const p = sanePlan(asObject(savedWeeks[k], null));
      if (p) merged.weeks[k] = p;
    });
    merged.history = asRecords(saved.history, []);
    merged.plan = sanePlan(asObject(saved.plan, null));

    // Профили — самое чувствительное место: по ним считаются нормы питания.
    // Строка вместо списка профилей раньше валила расчёт насмерть, потому что
    // у неё есть length, но нет map.
    const savedPeople = asArray(saved.people, []).filter(p => asObject(p, null));
    merged.people = savedPeople.length
      ? savedPeople.map(p => Object.assign(defaultPerson(p.id, p.name, p.sex), p))
      : pristine.people;

    // Раньше приёмы пищи были общими на всех. Переносим их в каждый профиль,
    // чтобы дальше настраивать по человеку.
    const commonMeals = asArray(asObject(saved.settings, {}).mealsActive, pristine.settings.mealsActive);
    merged.settings.mealsActive = asArray(merged.settings.mealsActive, pristine.settings.mealsActive);
    merged.people.forEach(function (p) {
      if (!Array.isArray(p.meals) || !p.meals.length) p.meals = commonMeals.slice();
      if (!Array.isArray(p.diets)) p.diets = [];
      // Числа, по которым считается норма. Строка «семьдесят» вместо веса
      // превратила бы всю арифметику в NaN и тихо испортила бы весь план.
      ['age', 'height', 'weight', 'activity'].forEach(function (k) {
        const n = Number(p[k]);
        if (!isFinite(n) || n <= 0) p[k] = defaultPerson(p.id, p.name, p.sex)[k];
        else p[k] = n;
      });
    });

    // Цены, правленные до появления журнала, переносим в него — иначе
    // вся уже собранная пользователем точность потерялась бы.
    merged.priceLog = merged.priceLog || [];
    if (saved.prices && !merged.priceLog.length) {
      Object.keys(saved.prices).forEach(function (id) {
        const old = saved.prices[id];
        if (!old || !(old.pr > 0)) return;
        merged.priceLog.push({ d: old.pd || today(), p: id, brand: '', store: '', pr: old.pr, pack: null });
      });
    }

    // Планы, сохранённые до исправления, могли накопить повторяющиеся
    // предупреждения и строки замен. Чистим при загрузке, чтобы не заставлять
    // пересобирать неделю ради этого.
    if (merged.plan) {
      if (Array.isArray(merged.plan.notes)) {
        merged.plan.notes = merged.plan.notes.filter((n, i, all) => all.indexOf(n) === i);
      }
      if (Array.isArray(merged.plan.swaps)) {
        const seen = {};
        merged.plan.swaps = merged.plan.swaps.filter(function (s) {
          const key = s.from + '>' + s.to;
          if (seen[key]) { seen[key].saved += s.saved || 0; return false; }
          seen[key] = s;
          return true;
        });
      }
    }
    return merged;
  }

  /* Запись только в браузер — без обращения к общей базе. */
  let warnedAboutStorage = false;

  function persist() {
    invalidate();
    revision++;
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      storageOk = false;
      // Ровно один раз за сеанс. Раньше здесь был alert на каждую запись,
      // а записи идут на каждое действие: не сумев сохранить, приложение
      // заваливало человека одинаковыми окнами, и работать становилось
      // невозможно ровно тогда, когда и так всё плохо.
      if (!warnedAboutStorage) {
        warnedAboutStorage = true;
        console.warn('Не удалось сохранить данные:', e);
        alert('Браузер не даёт сохранить данные: ' + e.message +
          '\n\nРаботать можно, но после закрытия вкладки всё пропадёт. ' +
          'Выгрузите копию через «Настройки → Данные».');
      }
    }
  }

  function save() {
    persist();
    // Локальная запись уже прошла, поэтому отправка наружу ничего не задерживает
    // и её неудача ничего не теряет: данные остались в браузере и уедут
    // при следующей попытке.
    if (window.App.account) window.App.account.schedulePush();
    if (window.App.sync) window.App.sync.push(() => state);
  }

  /* Принять состояние, пришедшее с другого устройства. Обратно не отправляем —
     иначе два устройства будут бесконечно пересылать друг другу одно и то же. */
  /* Принять состояние, пришедшее снаружи.
     silent — «это уже и есть версия из облака, отправлять её обратно незачем»:
     без него два устройства пересылали бы друг другу одно и то же по кругу. */
  function adopt(remote, opts) {
    state = migrate(remote);
    if (opts && opts.silent) persist();
    else save();
    return state;
  }

  function get() {
    if (!state) load();
    return state;
  }

  /* Текущий план — всегда живой объект из состояния.
   *
   * Брать его надо здесь и в момент действия, а не запоминать при отрисовке:
   * синхронизация с другого устройства заменяет state.plan новым объектом,
   * и обработчик кнопки, державший прежнюю ссылку, начинает править сироту.
   * Внешне это выглядит так, будто кнопка не работает. */
  function plan() {
    return get().plan;
  }

  // ---------- НЕСКОЛЬКО НЕДЕЛЬ ----------

  /* Месячный календарь показывает то, что движок считает недельными планами.
   *
   * Планировщик умеет ровно семь дней, и это не ограничение, а свойство задачи:
   * закупка, кладовая и подгонка под бюджет живут неделей. Поэтому месяц
   * не пересчитывается заново, а склеивается из недель — каждая собрана тем же
   * проверенным кодом.
   *
   * Текущая неделя по-прежнему лежит в state.plan и ничем не отличается
   * от прежней: весь старый код работает с ней, не подозревая об остальных.
   * Прочие недели живут в state.weeks. Хранить текущую ещё и там значило бы
   * держать две её копии, которые после сохранения и загрузки перестанут быть
   * одним объектом и разойдутся при первой же правке. */
  /* Начало недели, которой принадлежит эта дата.
   *
   * Отсчёт идёт не от понедельника, а от дня, с которого начат текущий план.
   * Это не педантизм: человек начинает неделю тогда, когда ходит в магазин,
   * и если план собран со среды, то его недели — среда-вторник. Привяжись
   * расчёт к понедельнику, собранный план не совпал бы ни с одной клеткой
   * календаря, и месяц выглядел бы пустым при полностью готовой неделе.
   * Ровно так и получилось при первой сборке. */
  function planStart(p) {
    return p && p.days && p.days[0] ? p.days[0].date : null;
  }

  function weekAnchor() {
    const s = get();
    return planStart(s.plan) || s.settings.startDay || today();
  }

  function weekStart(dateStr) {
    const anchor = new Date(weekAnchor() + 'T00:00:00');
    const d = new Date((dateStr || today()) + 'T00:00:00');
    const days = Math.floor((d - anchor) / 86400000);
    // Math.floor, а не деление с усечением: до якоря разница отрицательная,
    // и усечение к нулю сдвинуло бы прошлые недели на одну вперёд.
    const shift = Math.floor(days / 7) * 7;
    anchor.setDate(anchor.getDate() + shift);
    return localDate(anchor);
  }

  /* План недели, начинающейся в этот день. Текущая неделя отдаётся из state.plan,
     чтобы календарь и вкладки правили один и тот же объект, а не две копии. */
  function weekAt(startDate) {
    const s = get();
    if (planStart(s.plan) === startDate) return s.plan;
    return (s.weeks && s.weeks[startDate]) || null;
  }

  function setWeek(startDate, p) {
    const s = get();
    if (planStart(s.plan) === startDate) { s.plan = p; save(); return p; }
    s.weeks = s.weeks || {};
    s.weeks[startDate] = p;
    save();
    return p;
  }

  /* Все известные недели разом — для месячной сетки. */
  function allWeeks() {
    const s = get();
    const out = {};
    Object.keys(s.weeks || {}).forEach(k => { out[k] = s.weeks[k]; });
    const cur = planStart(s.plan);
    if (cur) out[cur] = s.plan;
    return out;
  }

  /* День месяца → что в этот день едят. Возвращает и сам день, и неделю,
     которой он принадлежит: без недели нельзя посчитать ни стоимость,
     ни порции — они считаются по всему плану целиком. */
  function dayAt(dateStr) {
    const p = weekAt(weekStart(dateStr));
    if (!p) return null;
    const day = p.days.find(d => d.date === dateStr);
    return day ? { day: day, plan: p } : null;
  }

  /* Забыть недели, которые давно прошли: они не нужны ни в календаре,
     ни в отчётах, а место в хранилище занимают заметное. */
  function pruneWeeks(keepFromDate) {
    const s = get();
    if (!s.weeks) return 0;
    const edge = keepFromDate || weekStart(localDate(new Date(Date.now() - 60 * 86400000)));
    let dropped = 0;
    Object.keys(s.weeks).forEach(function (k) {
      if (k < edge) { delete s.weeks[k]; dropped++; }
    });
    return dropped;
  }

  /* Приём пищи по дню и типу. Ссылку на сам приём хранить нельзя
     по той же причине, что и ссылку на план. */
  function mealAt(dayIndex, slot) {
    const p = plan();
    if (!p || !p.days || !p.days[dayIndex]) return null;
    return p.days[dayIndex].meals.find(m => m.slot === slot) || null;
  }

  /* local — стереть только из этого браузера, не трогая облако.
     Так уходит выход из аккаунта: данные обязаны исчезнуть с устройства,
     чтобы их не увидел следующий человек, но остаться в хозяйстве. */
  function reset(opts) {
    state = defaultState();
    if (opts && opts.local) persist();
    else save();
    return state;
  }

  // ---------- ЖУРНАЛ ЦЕН И МАРКИ ----------

  function round2(v) { return Math.round(v * 100) / 100; }

  /* Записать цену. Повторная запись за тот же день по той же марке в том же
     магазине заменяет прежнюю — иначе исправление опечатки плодило бы точки
     на графике. */
  function recordPrice(productId, opts) {
    const s = get();
    const d = opts.date || today();
    const brand = (opts.brand || '').trim();
    const store = (opts.store || '').trim();

    s.priceLog = (s.priceLog || []).filter(
      e => !(e.p === productId && e.brand === brand && e.store === store && e.d === d)
    );
    s.priceLog.push({
      d: d, p: productId, brand: brand, store: store,
      pr: round2(opts.pr),
      pack: opts.pack || null
    });
    if (opts.prefer) s.brandChoice[productId] = brand;
    save();
  }

  function priceHistory(productId) {
    return (get().priceLog || [])
      .filter(e => e.p === productId)
      .sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
  }

  /* Последняя известная цена по каждой марке. */
  function brandsOf(productId) {
    const latest = {};
    priceHistory(productId).forEach(function (e) {
      const key = e.brand || '';
      if (!latest[key] || latest[key].d <= e.d) latest[key] = e;
    });
    return Object.keys(latest).map(k => latest[k]);
  }

  /* Какая цена идёт в расчёты: выбранная марка, иначе самая дешёвая
     за единицу веса — сравнивать по цене упаковки нельзя, упаковки разные. */
  function effectivePrice(product) {
    const brands = brandsOf(product.id);
    if (!brands.length) return null;

    const chosen = get().brandChoice[product.id];
    if (chosen !== undefined) {
      const hit = brands.find(b => (b.brand || '') === chosen);
      if (hit) return hit;
    }
    return brands.slice().sort(function (a, b) {
      return a.pr / (a.pack || product.pack) - b.pr / (b.pack || product.pack);
    })[0];
  }

  // ---------- КАТАЛОГ ПРОДУКТОВ ----------

  /* Каталог пересобирается редко, а читается на каждой итерации оптимизатора,
     поэтому результат кешируется и сбрасывается при любой записи. */
  let catalogCache = null;
  let catalogByIdCache = null;

  function invalidate() { catalogCache = null; catalogByIdCache = null; }

  /* Каталог = заготовка + свои продукты, поверх которых наложены известные цены. */
  function products() {
    if (catalogCache) return catalogCache;
    const s = get();
    const all = window.App.seedProducts.concat(s.customProducts || []);
    catalogCache = all.map(function (p) {
      const best = effectivePrice(p);
      if (!best) return p;
      return Object.assign({}, p, {
        pr: best.pr,
        pack: best.pack || p.pack,
        pd: best.d,
        brand: best.brand,
        store: best.store,
        seed: false
      });
    });
    return catalogCache;
  }

  function productsById() {
    if (catalogByIdCache) return catalogByIdCache;
    const map = {};
    products().forEach(p => { map[p.id] = p; });
    catalogByIdCache = map;
    return map;
  }

  /* Цена одной базовой единицы (грамма или миллилитра). */
  function pricePerBase(product) {
    return product.pr / product.pack;
  }

  function daysSince(dateStr) {
    if (!dateStr) return 9999;
    const diff = Date.now() - new Date(dateStr + 'T00:00:00').getTime();
    return Math.floor(diff / 86400000);
  }

  function isStale(product) {
    return product.seed || daysSince(product.pd) > get().settings.priceStaleDays;
  }

  /* Быстрая правка цены без указания марки — из списка покупок.
     Сохраняет марку и магазин, выбранные для этого продукта раньше,
     чтобы правка попадала в ту же линию графика, а не создавала новую. */
  function setPrice(productId, price) {
    const known = brandsOf(productId);
    const chosen = get().brandChoice[productId];
    const base = known.find(b => (b.brand || '') === chosen) || known[0] || {};
    recordPrice(productId, { pr: price, brand: base.brand || '', store: base.store || '', pack: base.pack || null });
  }

  // ---------- РЕЦЕПТЫ ----------

  /* Ограничения домохозяйства — объединение режимов всех едоков.
   *
   * Хранятся они у человека, но действуют на общее блюдо: готовим одну
   * кастрюлю, поэтому если гастрит у одного из двоих, щадящим становится
   * общий обед. Иначе пришлось бы готовить дважды. */
  function householdRestrictions() {
    const ids = [];
    get().people.forEach(function (p) {
      (p.diets || []).forEach(function (d) { if (ids.indexOf(d) === -1) ids.push(d); });
    });
    return window.App.restrictionsFor ? window.App.restrictionsFor(ids) : { avoid: {}, limit: {}, methods: {} };
  }

  function activeDiets() {
    const ids = [];
    get().people.forEach(function (p) {
      (p.diets || []).forEach(function (d) { if (ids.indexOf(d) === -1) ids.push(d); });
    });
    return ids;
  }

  /* Какой режим запрещает этот продукт. Возвращает название режима
     или null — так интерфейс может объяснить, почему продукт пропал. */
  function blockedBy(product) {
    const ids = activeDiets();
    const tags = product.tg || [];
    for (let i = 0; i < ids.length; i++) {
      const d = window.App.dietById ? window.App.dietById[ids[i]] : null;
      if (!d) continue;
      if (d.avoid.some(t => tags.indexOf(t) !== -1)) return d;
    }
    return null;
  }

  function isProductAllowed(product) {
    return !blockedBy(product);
  }

  /* Рецепт отсеивается, если содержит исключённый продукт, выключен вручную
     или не проходит по диетическому режиму — по продукту либо по способу готовки. */
  function recipes() {
    const s = get();
    const all = window.App.seedRecipes.concat(s.customRecipes || []);
    const limits = householdRestrictions();
    const byId = productsById();
    const rawTags = limits.avoidRaw || {};
    const hasLimits = Object.keys(limits.avoid).length ||
      Object.keys(limits.methods).length || Object.keys(rawTags).length;

    return all.filter(function (r) {
      if (s.disabledRecipes[r.id]) return false;
      if (r.ing.some(i => s.excluded[i.p])) return false;
      if (!hasLimits) return true;

      if ((r.mth || []).some(m => limits.methods[m])) return false;

      // Грубая клетчатка мешает только сырой: варёная капуста в щах
      // и та же капуста в салате — разная нагрузка на желудок.
      const noHeat = (r.mth || ['boil']).every(m => m === 'raw');

      return !r.ing.some(function (i) {
        const p = byId[i.p];
        if (!p) return false;
        const tags = p.tg || [];
        if (tags.some(t => limits.avoid[t])) return true;
        return noHeat && tags.some(t => rawTags[t]);
      });
    });
  }

  /* Сколько блюд осталось на каждый приём пищи. Если режимы срезали почти всё,
     об этом надо сказать прямо, а не выдавать неделю из трёх повторов. */
  function recipeAvailability() {
    const left = recipes();
    const out = {};
    Object.keys(window.App.MEALS).forEach(function (slot) {
      out[slot] = left.filter(r => r.m.indexOf(slot) !== -1).length;
    });
    return out;
  }

  function allRecipes() {
    const s = get();
    return window.App.seedRecipes.concat(s.customRecipes || []);
  }

  // ---------- КЛАДОВАЯ ----------

  function pantryAdd(productId, grams) {
    const s = get();
    s.pantry[productId] = Math.max(0, (s.pantry[productId] || 0) + grams);
    if (s.pantry[productId] === 0) delete s.pantry[productId];
    save();
  }

  function pantrySet(productId, grams) {
    const s = get();
    if (grams > 0) s.pantry[productId] = grams;
    else delete s.pantry[productId];
    save();
  }

  // ---------- БЮДЖЕТ ----------

  /* Приводим бюджет к неделе и вычитаем всё, что не относится к готовке дома:
     бытовую химию и еду вне дома. Остаток — это то, на что реально закупаем продукты. */
  function weeklyBudget() {
    const s = get();
    const weeks = s.settings.period === 'month' ? s.settings.weeksInMonth : 1;
    const gross = s.settings.budget / weeks;
    const outside = s.settings.outsideFood / weeks;
    const regulars = regularsWeeklyCost();
    return {
      gross: gross,
      outside: outside,
      regulars: regulars.total,
      regularsItems: regulars.items,
      food: Math.max(0, gross - outside - regulars.total)
    };
  }

  /* Периоды регулярных покупок в неделях. Шампунь берут раз в пару месяцев,
     а средство для стирки — раз в полгода; загонять это в «раз в месяц»
     значит завышать бюджет на пустом месте. */
  const PERIODS = {
    week:      { n: 'шт в неделю',    weeks: 1 },
    two_weeks: { n: 'шт в 2 недели',  weeks: 2 },
    month:     { n: 'шт в месяц',     weeks: 4.3 },
    two_months:{ n: 'шт в 2 месяца',  weeks: 8.7 },
    quarter:   { n: 'шт в 3 месяца',  weeks: 13 },
    halfyear:  { n: 'шт в полгода',   weeks: 26 },
    year:      { n: 'шт в год',       weeks: 52 }
  };

  function periodWeeks(per) {
    return (PERIODS[per] || PERIODS.month).weeks;
  }

  /* Регулярные покупки в пересчёте на неделю. Дробные упаковки здесь допустимы:
     пачка кофе в месяц — это 0,23 пачки в неделю, и в бюджете это честнее,
     чем прыжки «то 449 ₽, то ноль». */
  function regularsWeeklyCost() {
    const s = get();
    const byId = productsById();
    let total = 0;
    const items = [];
    (s.regulars || []).forEach(function (r) {
      const prod = byId[r.p];
      if (!prod) return;
      const perWeek = r.qty / periodWeeks(r.per);
      const cost = perWeek * prod.pr;
      total += cost;
      items.push({ product: prod, perWeek: perWeek, cost: cost, raw: r });
    });
    return { total: total, items: items };
  }

  /* Отклонённые предложения замен. */
  function dismissSwap(fromId, toId) {
    const s = get();
    s.dismissedSwaps = s.dismissedSwaps || {};
    s.dismissedSwaps[fromId + '>' + toId] = true;
    save();
  }

  function restoreSwaps() {
    get().dismissedSwaps = {};
    save();
  }

  // ---------- ЭКСПОРТ / ИМПОРТ ----------

  function exportJson() {
    return JSON.stringify(get(), null, 2);
  }

  function importJson(text) {
    const parsed = JSON.parse(text);
    if (!parsed || !parsed.settings) throw new Error('Файл не похож на выгрузку этого приложения');
    state = migrate(parsed);
    save();
  }

  window.App = window.App || {};
  window.App.store = {
    load, save, get, reset, today, localDate, adopt, persist, plan, mealAt, storageAvailable,
    weekStart, weekAt, setWeek, allWeeks, dayAt, pruneWeeks, planStart,
    revision: () => revision,
    products, productsById, pricePerBase, isStale, daysSince, setPrice,
    recordPrice, priceHistory, brandsOf, effectivePrice, invalidate,
    recipes, allRecipes, householdRestrictions, activeDiets, blockedBy, isProductAllowed, recipeAvailability,
    pantryAdd, pantrySet,
    weeklyBudget, regularsWeeklyCost, PERIODS, periodWeeks,
    dismissSwap, restoreSwaps,
    exportJson, importJson,
    defaultPerson
  };
})();

/* ===== js/core/merge.js ===== */
/* Слияние двух хозяйств в одно.
 *
 * Случается ровно в один момент: человек со своими данными присоединяется
 * к чужому хозяйству. Выбросить одну из сторон нельзя — с обеих сторон
 * это месяцы правок цен и заполненная кладовая.
 *
 * Правило, из которого выведено всё остальное: складывается то, что в жизни
 * складывается, и объединяется то, что в жизни объединяется. Двое съехались —
 * едоков стало двое, бюджеты сложились, крупа с двух полок оказалась на одной.
 * А вот план на неделю не складывается никак: он был рассчитан на одного,
 * и на двоих его не растянуть. Поэтому план отбрасывается и собирается заново.
 */
(function () {
  'use strict';

  /* Бюджеты заданы за разные периоды: у одного 15 000 в месяц, у другого
     4 000 в неделю. Складывать их как числа — бессмыслица, поэтому обе
     стороны приводятся к неделе, складываются и выражаются обратно
     в периоде принимающей стороны. */
  function weeksOf(settings) {
    return settings.period === 'month' ? (settings.weeksInMonth || 4.3) : 1;
  }

  function sumPerPeriod(hostValue, hostSettings, guestValue, guestSettings) {
    const perWeek = (hostValue || 0) / weeksOf(hostSettings) +
                    (guestValue || 0) / weeksOf(guestSettings);
    return Math.round(perWeek * weeksOf(hostSettings));
  }

  /* Профили обоих становятся едоками одного хозяйства.
     Совпавшие коды переименовываются: код — это ключ, по которому за человеком
     закреплены приёмы пищи и раскладка по тарелкам, и два разных человека
     под одним кодом слились бы в одного. */
  function mergePeople(host, guest) {
    const used = {};
    host.forEach(p => { used[p.id] = true; });
    const added = guest.map(function (p) {
      const copy = Object.assign({}, p);
      if (used[copy.id]) {
        let n = 2;
        while (used[copy.id + '_' + n]) n++;
        copy.id = copy.id + '_' + n;
      }
      used[copy.id] = true;
      return copy;
    });
    return host.concat(added);
  }

  /* Кладовая складывается буквально: две пачки гречки на одной кухне —
     это две пачки гречки. */
  function mergePantry(host, guest) {
    const out = Object.assign({}, host);
    Object.keys(guest || {}).forEach(function (id) {
      out[id] = (out[id] || 0) + guest[id];
    });
    return out;
  }

  /* Журнал цен — это накопленное знание о магазинах, и оно тем ценнее,
     чем длиннее. Объединяем целиком, отбрасывая лишь буквальные повторы:
     одна и та же марка в одном магазине в один день. */
  function mergePriceLog(host, guest) {
    const seen = {};
    const out = [];
    host.concat(guest || []).forEach(function (e) {
      if (!e || !e.p) return;
      const key = [e.p, e.brand || '', e.store || '', e.d || ''].join('|');
      if (seen[key]) return;
      seen[key] = true;
      out.push(e);
    });
    return out;
  }

  function mergeFlags(host, guest) {
    return Object.assign({}, guest || {}, host || {});
  }

  function mergeById(host, guest, key) {
    const seen = {};
    const out = [];
    (host || []).concat(guest || []).forEach(function (item) {
      if (!item) return;
      const id = item[key];
      if (id !== undefined && seen[id]) return;
      if (id !== undefined) seen[id] = true;
      out.push(item);
    });
    return out;
  }

  function mergeStrings(host, guest) {
    const out = (host || []).slice();
    (guest || []).forEach(s => { if (out.indexOf(s) === -1) out.push(s); });
    return out;
  }

  /* Регулярные покупки: шампунь у обоих, но кухня одна. Берём больший
     расход — он ближе к правде для двоих, чем меньший. */
  function mergeRegulars(host, guest) {
    const byId = {};
    (host || []).forEach(r => { if (r && r.p) byId[r.p] = Object.assign({}, r); });
    (guest || []).forEach(function (r) {
      if (!r || !r.p) return;
      const have = byId[r.p];
      if (!have) { byId[r.p] = Object.assign({}, r); return; }
      const weeksHave = window.App.store.periodWeeks(have.per);
      const weeksNew = window.App.store.periodWeeks(r.per);
      if ((r.qty || 0) / weeksNew > (have.qty || 0) / weeksHave) byId[r.p] = Object.assign({}, r);
    });
    return Object.keys(byId).map(k => byId[k]);
  }

  /* host — хозяйство, к которому присоединяются; guest — тот, кто приходит
     со своими данными. Настройки берутся у принимающей стороны: это её
     сложившийся уклад, а гость к нему присоединяется. Складываются только
     деньги — они и правда становятся общими. */
  function mergeStates(host, guest) {
    if (!guest) return host;
    if (!host) return guest;

    const out = JSON.parse(JSON.stringify(host));
    const hs = out.settings, gs = guest.settings || {};

    hs.budget = sumPerPeriod(hs.budget, hs, gs.budget, gs);
    hs.outsideFood = sumPerPeriod(hs.outsideFood, hs, gs.outsideFood, gs);

    out.people = mergePeople(out.people || [], guest.people || []);
    out.pantry = mergePantry(out.pantry || {}, guest.pantry || {});
    out.priceLog = mergePriceLog(out.priceLog || [], guest.priceLog || []);
    out.excluded = mergeFlags(out.excluded, guest.excluded);
    out.disabledRecipes = mergeFlags(out.disabledRecipes, guest.disabledRecipes);
    out.dismissedSwaps = mergeFlags(out.dismissedSwaps, guest.dismissedSwaps);
    out.brandChoice = mergeFlags(out.brandChoice, guest.brandChoice);
    out.customProducts = mergeById(out.customProducts, guest.customProducts, 'id');
    out.customRecipes = mergeById(out.customRecipes, guest.customRecipes, 'id');
    out.stores = mergeStrings(out.stores, guest.stores);
    out.regulars = mergeRegulars(out.regulars, guest.regulars);
    out.history = (out.history || []).concat(guest.history || []);

    // План считался на прежний состав едоков и прежние деньги. Оставить его —
    // значит показывать меню, которое никого уже не кормит по норме.
    out.plan = null;
    out.listState = {};

    return out;
  }

  /* Что именно изменится при слиянии — показывается человеку до того,
     как он согласится. Слияние необратимо, и соглашаться вслепую он не должен. */
  function describeMerge(host, guest) {
    if (!host || !guest) return [];
    const hs = host.settings || {}, gs = guest.settings || {};
    const lines = [];

    const budget = sumPerPeriod(hs.budget, hs, gs.budget, gs);
    if (budget !== hs.budget) {
      lines.push('Бюджет станет ' + budget + ' ₽ вместо ' + (hs.budget || 0) + ' ₽ — суммы сложатся');
    }
    const people = (guest.people || []).length;
    if (people) lines.push('Едоков станет ' + ((host.people || []).length + people) +
      ': ваши профили добавятся к тем, что уже есть');

    const pantry = Object.keys(guest.pantry || {}).length;
    if (pantry) lines.push('В кладовую добавится ' + pantry + ' поз. — количества сложатся');

    const prices = (guest.priceLog || []).length;
    if (prices) lines.push('В журнал цен добавится ваших записей: ' + prices);

    const own = (guest.customProducts || []).length + (guest.customRecipes || []).length;
    if (own) lines.push('Перенесутся ваши продукты и рецепты: ' + own);

    if (host.plan || guest.plan) lines.push('План на неделю придётся собрать заново — он считался на другой состав едоков');

    return lines;
  }

  window.App = window.App || {};
  window.App.merge = { mergeStates, describeMerge, sumPerPeriod };
})();

/* ===== js/core/account.js ===== */
/* Аккаунт, хозяйство и синхронизация состояния.
 *
 * Здесь сходятся три вещи, которые по отдельности просты, а вместе дают
 * почти все ошибки такого рода приложений: кто вошёл, чьи данные показывать
 * и что делать, когда два устройства правят их одновременно.
 *
 * Порядок намеренно «сначала локально». Приложение читает и пишет в браузер,
 * поэтому открывается мгновенно и работает в магазине, где связи нет. Облако
 * подтягивается следом и, если доступно, становится общей правдой.
 *
 * Три режима, и приложение обязано вести себя понятно в каждом:
 *   нет настроек облака — всё локально, аккаунтов нет вовсе, как раньше;
 *   облако есть, но не вошли — гостевой режим, данные только в этом браузере;
 *   вошли — данные принадлежат хозяйству и живут в облаке.
 */
(function () {
  'use strict';

  const CLOUD = () => window.App.cloud;
  const STORE = () => window.App.store;

  const HOUSEHOLD_KEY = 'spendings.household';
  const GUEST_KEY = 'spendings.guest';
  const PUSH_DELAY = 900;        // мс тишины перед отправкой

  let household = null;          // { id, name, invite_code, rev }
  // Хозяйство, из которого человек уходит, вступая в чужое. Держится отдельно,
  // потому что между «посмотреть, что изменится» и «согласен» он уже числится
  // в обоих, и без этой пометки некуда было бы возвращаться при отказе.
  let leavingBehind = null;
  let pushTimer = null;
  let pending = false;
  let busy = false;
  let conflict = false;
  let lastError = '';
  const listeners = [];

  // ---------------------------------------------------------------- состояние слоя

  function status() {
    return {
      configured: CLOUD().available(),
      signedIn: CLOUD().signedIn(),
      guest: isGuest(),
      email: (CLOUD().user() || {}).email || '',
      household: household,
      pending: pending,
      conflict: conflict,
      error: lastError
    };
  }

  function onChange(fn) { listeners.push(fn); }

  function notify() {
    const s = status();
    listeners.forEach(fn => { try { fn(s); } catch (e) { console.warn(e); } });
  }

  /* Гостевой режим — сознательный выбор «посмотреть без аккаунта».
     Он отличается от «ещё не вошёл» тем, что человек его выбрал, и приложение
     не имеет права снова показывать ему экран входа при каждом запуске. */
  function isGuest() {
    try { return localStorage.getItem(GUEST_KEY) === '1'; } catch (e) { return false; }
  }

  function setGuest(on) {
    try {
      if (on) localStorage.setItem(GUEST_KEY, '1');
      else localStorage.removeItem(GUEST_KEY);
    } catch (e) { /* без хранилища режим проживёт до перезагрузки */ }
    notify();
  }

  function rememberHousehold(row) {
    household = row ? {
      id: row.id, name: row.name, invite_code: row.invite_code, rev: row.rev
    } : null;
    try {
      if (household) localStorage.setItem(HOUSEHOLD_KEY, JSON.stringify(household));
      else localStorage.removeItem(HOUSEHOLD_KEY);
    } catch (e) { /* переживём */ }
    notify();
    return household;
  }

  function loadRememberedHousehold() {
    try {
      const raw = localStorage.getItem(HOUSEHOLD_KEY);
      household = raw ? JSON.parse(raw) : null;
    } catch (e) { household = null; }
    return household;
  }

  // ---------------------------------------------------------------- вход

  /* Нужно ли показать экран входа вместо приложения.
     Показываем ровно тогда, когда облако настроено, человек не вошёл
     и гостем быть не соглашался. */
  function needsAuth() {
    return CLOUD().available() && !CLOUD().signedIn() && !isGuest();
  }

  function signIn(email, password) {
    return CLOUD().signIn(email, password).then(function (user) {
      setGuest(false);
      return afterSignIn().then(() => user);
    });
  }

  function signUp(email, password) {
    return CLOUD().signUp(email, password).then(function (result) {
      if (result.needsConfirmation) return result;
      setGuest(false);
      return afterSignIn().then(() => result);
    });
  }

  /* Выход обязан стереть данные из этого браузера.
   *
   * Иначе следующий человек, открывший приложение на том же устройстве,
   * увидит чужие цены, кладовую и профили — ровно то, чего вход и должен
   * не допускать. Данные при этом не теряются: они остались в облаке
   * и вернутся при следующем входе. */
  function signOut() {
    return flushNow().catch(() => {}).then(function () {
      return CLOUD().signOut();
    }).then(function () {
      rememberHousehold(null);
      setGuest(false);
      conflict = false;
      STORE().reset({ local: true });
      notify();
    });
  }

  /* Что происходит сразу после успешного входа.
   *
   * Развилка здесь одна, и она важна: если человек до входа работал гостем
   * и что-то успел завести, эти данные надо забрать с собой, а не потерять.
   * Отличаем по признаку «в хозяйстве ещё нет состояния» — тогда местное
   * и становится первым состоянием хозяйства. */
  function afterSignIn() {
    return CLOUD().myHouseholds().then(function (rows) {
      if (rows.length) {
        // Последнее по времени вступления, а не первое: если человек когда-то
        // объединялся, свежее членство и есть его нынешнее хозяйство.
        rememberHousehold(rows[rows.length - 1]);
        return pull({ adoptRemote: true });
      }
      // Хозяйства нет — заводим, и семенем кладём то, что человек уже наработал.
      const local = STORE().get();
      return CLOUD().createHousehold(null, local).then(function (row) {
        rememberHousehold(row);
        setGuest(false);
        return household;
      });
    });
  }

  // ---------------------------------------------------------------- обмен

  /* Забрать состояние хозяйства.
   *
   * adoptRemote означает «мы только что вошли, местное состояние не наше» —
   * тогда облачное принимается без разговоров. В обычной же работе, когда
   * человек уже что-то правил, молча затирать его правки нельзя. */
  function pull(opts) {
    opts = opts || {};
    if (!household) return Promise.resolve(null);

    return CLOUD().fetchHousehold(household.id).then(function (row) {
      if (!row) return null;
      const known = household.rev;
      rememberHousehold(row);
      lastError = '';

      if (!row.state) {
        // Хозяйство пустое — наполняем его тем, что есть здесь.
        return push(true).then(() => null);
      }
      if (!opts.adoptRemote && row.rev === known) return null;   // ничего не менялось

      STORE().adopt(row.state, { silent: true });
      return row.state;
    }).catch(function (err) {
      lastError = err.message;
      notify();
      return null;
    });
  }

  /* Отправить состояние пачкой, после паузы. Пауза нужна, чтобы правка цены
     не превращалась в запрос на каждое нажатие клавиши. */
  function schedulePush() {
    if (!household || !CLOUD().signedIn()) return;
    pending = true;
    notify();
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => { push(false); }, PUSH_DELAY);
  }

  function push(force) {
    if (!household || !CLOUD().signedIn()) return Promise.resolve();
    if (busy) { schedulePush(); return Promise.resolve(); }

    busy = true;
    const state = STORE().get();
    return CLOUD().saveState(household.id, state, household.rev).then(function (res) {
      busy = false;
      if (res.ok) {
        rememberHousehold(res.row);
        pending = false;
        conflict = false;
        lastError = '';
        notify();
        return { ok: true };
      }
      // Кто-то записался раньше. Молча затирать чужую работу нельзя.
      if (force && res.row) {
        return forceOverwrite(res.row.rev);
      }
      conflict = true;
      pending = true;
      notify();
      return { conflict: true, remote: res.row };
    }).catch(function (err) {
      busy = false;
      pending = true;
      lastError = err.message;
      notify();
      return { offline: true };
    });
  }

  function forceOverwrite(rev) {
    if (!household) return Promise.resolve({ ok: false });
    return CLOUD().saveState(household.id, STORE().get(), rev).then(function (res) {
      if (res.ok) {
        rememberHousehold(res.row);
        pending = false; conflict = false;
        notify();
        return { ok: true };
      }
      return { conflict: true, remote: res.row };
    });
  }

  function flushNow() {
    clearTimeout(pushTimer);
    if (!pending || !household || !CLOUD().signedIn()) return Promise.resolve();
    return push(false);
  }

  /* Принять облачную версию, отказавшись от своей. */
  function acceptRemote(row) {
    if (!row) return Promise.resolve();
    rememberHousehold(row);
    if (row.state) STORE().adopt(row.state, { silent: true });
    conflict = false;
    pending = false;
    notify();
    return Promise.resolve();
  }

  // ---------------------------------------------------------------- хозяйство

  function people() {
    if (!household) return Promise.resolve([]);
    return CLOUD().householdPeople(household.id);
  }

  /* Присоединиться к чужому хозяйству, забрав свои данные с собой.
   *
   * Порядок здесь единственно верный и стоил бы дорого, ошибись мы в нём:
   * сначала вступаем, потом читаем чужое состояние, сливаем со своим
   * и записываем результат. Записать до вступления нельзя — правила доступа
   * не пустят; слить до чтения нечего.
   *
   * Если в чужом хозяйстве состояния ещё нет, слияние вырождается в перенос
   * своего — и это правильно, а не особый случай. */
  function joinByCode(code) {
    const mine = JSON.parse(JSON.stringify(STORE().get()));
    const previous = leavingBehind || household;

    return CLOUD().joinHousehold(code).then(function (row) {
      rememberHousehold(row);
      const merged = window.App.merge.mergeStates(row.state, mine);
      return CLOUD().saveState(row.id, merged, row.rev).then(function (res) {
        const saved = res.row || row;
        rememberHousehold(saved);
        STORE().adopt(merged, { silent: true });

        /* Выписаться из прежнего хозяйства обязательно, и это не уборка.
         *
         * Оставшись в обоих, человек при следующем входе попадает в то,
         * куда его определит порядок в списке, — то есть, скорее всего,
         * в старое и пустое, с бюджетом до объединения. Данные при этом
         * целы, но человек видит не свои и решает, что всё пропало.
         * Второй раз это же вылезает при выходе из общего хозяйства:
         * выходит он не оттуда, откуда думает.
         *
         * Неудача здесь не должна рушить уже состоявшееся объединение —
         * оно важнее, а лишнее членство поправимо. */
        leavingBehind = null;
        if (!previous || previous.id === saved.id) return { household: saved, merged: merged };
        return CLOUD().leaveHousehold(previous.id)
          .catch(() => {})
          .then(() => ({ household: saved, merged: merged }));
      });
    });
  }

  /* Что изменится при вступлении — до того, как человек согласится. */
  function previewJoin(code) {
    const mine = STORE().get();
    const previous = household;
    return CLOUD().joinHousehold(code).then(function (row) {
      // Вступление уже произошло: узнать состав чужого хозяйства иначе нельзя,
      // правила доступа не дают читать то, где ты не состоишь. Выйти обратно
      // можно одной кнопкой, поэтому цена ошибки здесь невелика.
      if (previous && previous.id !== row.id) leavingBehind = previous;
      rememberHousehold(row);
      return {
        household: row,
        changes: window.App.merge.describeMerge(row.state, mine),
        hasState: !!row.state
      };
    });
  }

  /* Передумал на полпути: выходим из чужого хозяйства и возвращаемся в своё. */
  function cancelJoin() {
    const back = leavingBehind;
    const joined = household;
    leavingBehind = null;
    if (!joined || (back && joined.id === back.id)) return Promise.resolve();
    return CLOUD().leaveHousehold(joined.id).catch(() => {}).then(function () {
      if (back) rememberHousehold(back);
      return pull({ adoptRemote: true });
    });
  }

  function leave() {
    if (!household) return Promise.resolve();
    const id = household.id;
    return CLOUD().leaveHousehold(id).then(function () {
      rememberHousehold(null);
      // Своё хозяйство заводится заново, с текущими данными: человек уходит
      // не в пустоту, а к тому, чем пользовался.
      return CLOUD().createHousehold(null, STORE().get()).then(rememberHousehold);
    });
  }

  function rotateInvite() {
    if (!household) return Promise.resolve('');
    return CLOUD().rotateInvite(household.id).then(function (code) {
      household.invite_code = code;
      rememberHousehold(household);
      return code;
    });
  }

  function rename(name) {
    if (!household) return Promise.resolve();
    return window.App.cloud.fetchHousehold(household.id).then(function () {
      return fetch(window.App.config.url + '/rest/v1/households?id=eq.' + household.id, {
        method: 'PATCH',
        headers: {
          'apikey': window.App.config.anonKey,
          'Authorization': 'Bearer ' + CLOUD().current().access_token,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({ name: name })
      }).then(r => r.json()).then(rows => rememberHousehold((rows && rows[0]) || household));
    });
  }

  // ---------------------------------------------------------------- запуск

  function init() {
    loadRememberedHousehold();
    if (!CLOUD().available() || !CLOUD().signedIn()) { notify(); return Promise.resolve(); }

    return CLOUD().myHouseholds().then(function (rows) {
      if (!rows.length) return afterSignIn();
      // Держимся того хозяйства, в котором работали, если человек всё ещё в нём.
      const keep = household && rows.find(r => r.id === household.id);
      rememberHousehold(keep || rows[rows.length - 1]);
      return pull({ adoptRemote: true });
    }).catch(function (err) {
      lastError = err.message;
      notify();
    });
  }

  window.App = window.App || {};
  window.App.account = {
    init, status, onChange, needsAuth,
    signIn, signUp, signOut, setGuest, isGuest,
    pull, push, schedulePush, flushNow, acceptRemote, forceOverwrite,
    joinByCode, previewJoin, cancelJoin, leave, rotateInvite, rename, people,
    get household() { return household; }
  };
})();

/* ===== js/core/receipt.js ===== */
/* Разбор кассового чека.
 *
 * Что здесь честно возможно, а что нет.
 *
 * QR-код на российском чеке содержит только дату, сумму и фискальные признаки:
 * t (дата и время), s (сумма), fn, i, fp (номера накопителя, документа
 * и признак). Списка товаров в нём нет — его отдаёт лишь сервис ФНС,
 * которому нужны интернет и авторизация. Приложение работает без сети
 * и без аккаунтов, поэтому позиции оттуда взяться не могут ни при каком
 * старании, и обещать этого нельзя.
 *
 * Зато из QR берётся то, что важнее всего для учёта: точная дата и сумма
 * по кассе. А позиции у нас уже есть — в списке покупок, — и сверить их
 * с чеком быстрее, чем набивать заново.
 */
(function () {
  'use strict';

  /* Разбор строки из QR. Возвращает null, если это не фискальный код. */
  function parseQr(text) {
    if (!text) return null;
    const raw = String(text).trim();
    const params = {};
    raw.split('&').forEach(function (pair) {
      const eq = pair.indexOf('=');
      if (eq === -1) return;
      params[pair.slice(0, eq).trim().toLowerCase()] = pair.slice(eq + 1).trim();
    });

    if (!params.s && !params.t) return null;

    return {
      date: parseDate(params.t),
      time: parseTime(params.t),
      sum: params.s ? Math.round(parseFloat(params.s.replace(',', '.')) * 100) / 100 : null,
      fn: params.fn || '',
      doc: params.i || '',
      sign: params.fp || '',
      raw: raw
    };
  }

  /* Дата в QR записана как 20260824T1830 — без разделителей. */
  function parseDate(t) {
    if (!t || t.length < 8) return null;
    const y = t.slice(0, 4), m = t.slice(4, 6), d = t.slice(6, 8);
    if (!/^\d{4}$/.test(y) || !/^\d{2}$/.test(m) || !/^\d{2}$/.test(d)) return null;
    return y + '-' + m + '-' + d;
  }

  function parseTime(t) {
    if (!t || t.length < 13) return '';
    const hh = t.slice(9, 11), mm = t.slice(11, 13);
    return /^\d{2}$/.test(hh) && /^\d{2}$/.test(mm) ? hh + ':' + mm : '';
  }

  /* Умеет ли браузер читать QR сам. Поддержка неровная: на телефонах с Chrome
     обычно есть, на части десктопов нет. Поэтому всегда остаётся ручной ввод. */
  function canScan() {
    return typeof window.BarcodeDetector === 'function';
  }

  function detector() {
    return new window.BarcodeDetector({ formats: ['qr_code'] });
  }

  /* Прочитать QR с фотографии чека. */
  function scanImage(file) {
    if (!canScan()) return Promise.reject(new Error('Браузер не умеет читать QR-коды'));
    return createImageBitmap(file)
      .then(bitmap => detector().detect(bitmap))
      .then(function (codes) {
        if (!codes || !codes.length) throw new Error('QR-код на фотографии не найден');
        return codes[0].rawValue;
      });
  }

  /* Прочитать QR с камеры. Возвращает объект с промисом результата
     и способом остановить камеру — её нельзя оставлять включённой. */
  function scanCamera(videoEl) {
    if (!canScan()) return Promise.reject(new Error('Браузер не умеет читать QR-коды'));
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return Promise.reject(new Error('Нет доступа к камере'));
    }

    let stream = null;
    let stopped = false;

    const result = navigator.mediaDevices
      .getUserMedia({ video: { facingMode: 'environment' } })
      .then(function (s) {
        stream = s;
        videoEl.srcObject = s;
        return videoEl.play();
      })
      .then(function () {
        const det = detector();
        return new Promise(function (resolve, reject) {
          const timer = setInterval(function () {
            if (stopped) { clearInterval(timer); return; }
            det.detect(videoEl).then(function (codes) {
              if (codes && codes.length) {
                clearInterval(timer);
                resolve(codes[0].rawValue);
              }
            }).catch(function () { /* кадр не распознался — пробуем следующий */ });
          }, 400);

          // Держать камеру включённой бесконечно нельзя.
          setTimeout(function () {
            clearInterval(timer);
            if (!stopped) reject(new Error('QR-код не найден за 30 секунд'));
          }, 30000);
        });
      });

    return {
      result: result,
      stop: function () {
        stopped = true;
        if (stream) stream.getTracks().forEach(t => t.stop());
      }
    };
  }

  window.App = window.App || {};
  window.App.receipt = { parseQr, canScan, scanImage, scanCamera };
})();

/* ===== js/core/shopping.js ===== */
/* Превращение плана питания в список покупок.
 *
 * Здесь живёт вся «магазинная» правда, из-за которой наивные калькуляторы врут:
 *  - рис продаётся пачкой 800 г, даже если по рецепту нужно 300 г;
 *  - то, что уже лежит дома, покупать не надо;
 *  - излишек от пачки не пропадает — он переходит в кладовую на следующую неделю.
 */
(function () {
  'use strict';

  const S = () => window.App.store;

  /* Сколько каждого продукта нужно на весь план, в базовых единицах.
     Считаем по `buy`, а не по `mult`: блюдо на два дня закупается один раз,
     в день готовки, и во второй день не добавляет к списку ничего. */
  function buyMult(meal) {
    if (meal.leftoverOf != null) return 0;
    return meal.buy != null ? meal.buy : meal.mult;
  }

  function aggregate(plan) {
    const need = {};
    plan.days.forEach(function (day) {
      day.meals.forEach(function (meal) {
        if (!meal || !meal.recipe) return;
        const mult = buyMult(meal);
        if (mult <= 0) return;
        meal.recipe.ing.forEach(function (i) {
          need[i.p] = (need[i.p] || 0) + i.g * mult;
        });
      });
    });
    return need;
  }

  /* Шаг, которым реально можно взять весовой товар на кассе. */
  function weighStep(product) {
    return product.pack >= 1000 ? 50 : 10;
  }

  function roundUp(value, step) {
    return Math.ceil(value / step) * step;
  }

  /* Основная функция: потребность → что и почём покупаем. */
  function buildList(plan, opts) {
    opts = opts || {};
    const usePantry = opts.usePantry !== false;
    const byId = S().productsById();
    const pantry = usePantry ? S().get().pantry : {};
    const need = aggregate(plan);

    const items = [];
    let total = 0;
    let savedByPantry = 0;

    Object.keys(need).forEach(function (id) {
      const product = byId[id];
      if (!product) return;

      const required = need[id];
      const inPantry = Math.min(required, pantry[id] || 0);
      const remaining = required - inPantry;
      const perBase = S().pricePerBase(product);

      savedByPantry += inPantry * perBase;

      let buyAmount = 0, packs = 0, cost = 0;
      if (remaining > 0.5) {
        if (product.w) {
          buyAmount = roundUp(remaining, weighStep(product));
          packs = buyAmount / product.pack;
          cost = buyAmount * perBase;
        } else {
          packs = Math.ceil(remaining / product.pack);
          buyAmount = packs * product.pack;
          cost = packs * product.pr;
        }
      }

      total += cost;

      items.push({
        product: product,
        required: required,
        fromPantry: inPantry,
        remaining: remaining,
        buyAmount: buyAmount,
        packs: packs,
        cost: cost,
        leftover: buyAmount > 0 ? buyAmount - remaining : 0,
        stale: S().isStale(product)
      });
    });

    return {
      items: items,
      total: Math.round(total),
      savedByPantry: Math.round(savedByPantry),
      byCategory: groupByCategory(items)
    };
  }

  function groupByCategory(items) {
    const groups = {};
    items.forEach(function (it) {
      if (it.buyAmount <= 0) return;
      const cat = it.product.cat;
      (groups[cat] = groups[cat] || []).push(it);
    });
    return window.App.CATEGORY_ORDER
      .filter(cat => groups[cat] && groups[cat].length)
      .map(function (cat) {
        const list = groups[cat].sort((a, b) => b.cost - a.cost);
        return {
          cat: cat,
          name: window.App.CATEGORIES[cat],
          items: list,
          sum: Math.round(list.reduce((s, i) => s + i.cost, 0))
        };
      });
  }

  /* Быстрая оценка стоимости плана — вызывается оптимизатором на каждой итерации,
     поэтому не строит группировку. */
  function costOf(plan) {
    const byId = S().productsById();
    const pantry = S().get().pantry;
    const need = aggregate(plan);
    let total = 0;
    Object.keys(need).forEach(function (id) {
      const product = byId[id];
      if (!product) return;
      const remaining = need[id] - Math.min(need[id], pantry[id] || 0);
      if (remaining <= 0.5) return;
      if (product.w) total += roundUp(remaining, weighStep(product)) * S().pricePerBase(product);
      else total += Math.ceil(remaining / product.pack) * product.pr;
    });
    return Math.round(total);
  }

  /* Что останется в кладовой после недели: старые остатки минус съеденное
     плюс хвосты от начатых упаковок. */
  function pantryAfter(plan, list) {
    const pantry = Object.assign({}, S().get().pantry);
    list.items.forEach(function (it) {
      const id = it.product.id;
      const left = (pantry[id] || 0) - it.fromPantry + it.leftover;
      if (left > 0.5) pantry[id] = Math.round(left);
      else delete pantry[id];
    });
    return pantry;
  }

  /* Во сколько реально обходится грамм каждого продукта в этом плане.
   *
   * Не «цена за килограмм с ценника»: продукты продаются упаковками, и если
   * ради 300 г риса куплена пачка 800 г, то эти 300 г стоят всю пачку. И наоборот —
   * то, что взято из кладовой, на этой неделе не стоит ничего, деньги за него
   * заплачены раньше.
   *
   * Отсюда важное свойство: сумма стоимостей всех приёмов пищи в точности равна
   * итогу списка покупок. Наивный подсчёт занижал её на 38%.
   */
  const ratesCache = new WeakMap();

  function unitRates(plan) {
    const rev = S().revision();
    const cached = ratesCache.get(plan);
    if (cached && cached.rev === rev) return cached.rates;

    const list = buildList(plan);
    const rates = {};
    list.items.forEach(function (i) {
      rates[i.product.id] = i.required > 0 ? i.cost / i.required : 0;
    });
    ratesCache.set(plan, { rev: rev, rates: rates });
    return rates;
  }

  /* Человекочитаемое количество: где уместно — в штуках, где нет — в кг/г. */
  function formatAmount(product, amount) {
    if (amount <= 0) return '—';
    if (product.piece) {
      const pieces = amount / product.piece;
      const rounded = pieces >= 1 ? Math.round(pieces * 10) / 10 : Math.round(pieces * 100) / 100;
      return rounded + ' шт (' + formatMass(product, amount) + ')';
    }
    return formatMass(product, amount);
  }

  function formatMass(product, amount) {
    const unit = product.unit === 'ml' ? 'мл' : 'г';
    const big = product.unit === 'ml' ? 'л' : 'кг';
    if (amount >= 1000) return (Math.round(amount / 10) / 100) + ' ' + big;
    return Math.round(amount) + ' ' + unit;
  }

  /* Как это выглядит на полке: «2 пачки по 800 г» или «0,45 кг». */
  function formatPurchase(item) {
    const p = item.product;
    if (p.w) return formatMass(p, item.buyAmount);
    const n = item.packs;
    return n + ' × ' + p.pl;
  }

  window.App = window.App || {};
  window.App.shopping = {
    aggregate, buildList, costOf, pantryAfter, buyMult, weighStep, roundUp, unitRates,
    formatAmount, formatMass, formatPurchase, groupByCategory
  };
})();

/* ===== js/core/planner.js ===== */
/* Генератор недельного меню и подгонка его под бюджет.
 *
 * Логика в двух шагах:
 *  1. Собрать неделю так, чтобы закрыть калории и БЖУ, отдавая приоритет тому,
 *     что уже лежит в кладовой.
 *  2. Если получилось дороже бюджета — удешевлять, НЕ трогая калории и белок:
 *     сначала заменой продуктов на аналоги в той же роли (говядина → бедро → яйца),
 *     потом заменой самих блюд. Калории пересчитываются после каждой замены,
 *     поэтому «сэкономить, недокормив себя» приложение не умеет по построению.
 */
(function () {
  'use strict';

  const S = () => window.App.store;
  const N = () => window.App.nutrition;
  const SH = () => window.App.shopping;

  const DAY_NAMES = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];

  // Группы, внутри которых замена продукта осмысленна.
  // Специи, соусы и напитки не заменяем — экономии ноль, вкус ломается.
  // Базовые овощи (лук, морковь, капуста) тоже вне списка: они стоят копейки,
  // и «замена моркови на лук» экономит рубль, а блюдо делает несъедобным.
  const SWAPPABLE = ['prot_meat', 'prot_fish', 'prot_dairy', 'prot_legume', 'prot_egg',
    'carb_grain', 'carb_pasta', 'carb_potato', 'veg_fresh',
    'fat_oil', 'fat_butter', 'fat_dairy', 'fruit', 'dairy_liquid', 'bread', 'nuts'];

  // Замена принимается, только если экономит заметно: иначе оптимизатор
  // ради четырёх рублей перекраивает половину меню. Но когда разрыв с бюджетом
  // большой, привередничать нельзя — порог падает, а лимит замен растёт.
  const MIN_SAVING_RUB = 40;
  const MIN_SAVING_SHARE = 0.02;
  const MAX_SWAPS = 8;
  const URGENT_GAP_SHARE = 0.12;   // разрыв больше 12% стоимости — режим экономии

  /* Границы масштабирования порции.
   *
   * Нижняя граница была 0,35 — и это ломало день. Рецепт на четыре порции,
   * попавший в перекус, требует коэффициента около 0,2; упираясь в 0,35,
   * он выдавал 831 ккал вместо 444, и день уезжал на девять процентов вверх.
   * Планировщик при этом считал, что попал в норму.
   *
   * Ниже 0,2 не опускаемся уже по здравому смыслу: «пятая часть кастрюли»
   * ещё осмысленна, «двадцатая» — нет. Поэтому вторая половина решения —
   * штраф в подборе, чтобы блюда с неудобным масштабом просто реже попадали
   * в такие слоты. */
  const MULT_MIN = 0.2;
  const MULT_MAX = 3.2;
  const MULT_COMFORT_LOW = 0.4;
  const MULT_COMFORT_HIGH = 2.5;

  function swapThreshold(cost, gap) {
    const urgent = gap > cost * URGENT_GAP_SHARE;
    return {
      rub: urgent ? 20 : MIN_SAVING_RUB,
      share: urgent ? 0.004 : MIN_SAVING_SHARE,
      maxSwaps: urgent ? 14 : MAX_SWAPS
    };
  }

  // ---------------------------------------------------------------- утилиты

  function clone(recipe) {
    return Object.assign({}, recipe, { ing: recipe.ing.map(i => ({ p: i.p, g: i.g })) });
  }

  function edible(product) {
    return 1 - (product.wst || 0);
  }

  /* Во сколько обходится единица пользы от продукта: для белковых — рубль за грамм
     белка, для остального — рубль за килокалорию. По этой мере и идёт удешевление. */
  function unitCost(product, role) {
    const perBase = S().pricePerBase(product);
    const e = edible(product);
    if (role === 'protein') {
      const protPerBase = product.p / 100 * e;
      return protPerBase > 0.005 ? perBase / protPerBase : Infinity;
    }
    const kcalPerBase = product.k / 100 * e;
    // Бесконечность, а не «очень дорого»: продукт без калорий не может быть
    // источником калорий ни за какие деньги, и сравнивать его с едой нельзя.
    // Прежняя заглушка perBase * 100 давала конечное число, и достаточно
    // дешёвый продукт с нулевым КБЖУ — такой легко завести своей рукой —
    // обошёл бы настоящую еду в поиске самой выгодной замены.
    return kcalPerBase > 0.01 ? perBase / kcalPerBase : Infinity;
  }

  function recipeCost(recipe, byId, mult) {
    return recipe.ing.reduce(function (sum, i) {
      const p = byId[i.p];
      return p ? sum + i.g * mult * S().pricePerBase(p) : sum;
    }, 0);
  }

  /* Сколько на самом деле стоит добавить это блюдо в план.
   *
   * Наивный подсчёт «граммы × цена за грамм» врёт вдвое: продукты продаются
   * упаковками, и если ради одного рецепта пришлось купить пачку риса 800 г,
   * а ушло 300 г, то следующее блюдо с рисом обойдётся бесплатно — оставшиеся
   * 500 г уже оплачены. Именно на этой разнице в тестах терялось от четверти
   * до половины недельного бюджета: план набирал три десятка разных продуктов,
   * каждый целой упаковкой, и почти всё оставалось недоеденным.
   *
   * Поэтому цена считается по остатку: сначала кладовая, потом уже оплаченные
   * хвосты упаковок, и только недостающее — новыми пачками.
   */
  function marginalCost(recipe, byId, ctx, mult) {
    let cost = 0;
    recipe.ing.forEach(function (i) {
      const product = byId[i.p];
      if (!product) return;

      let need = i.g * mult;
      need -= Math.min(need, ctx.pantry[i.p] || 0);

      const committed = ctx.committed[i.p];
      if (committed) need -= Math.min(need, Math.max(0, committed.bought - committed.used));
      if (need <= 0.5) return;

      if (product.w) {
        const step = SH().weighStep(product);
        cost += SH().roundUp(need, step) * S().pricePerBase(product);
      } else {
        cost += Math.ceil(need / product.pack) * product.pr;
      }
    });
    return cost;
  }

  /* Запоминаем, что уже куплено и сколько из этого израсходовано, — чтобы
     следующее блюдо видело оплаченные остатки. */
  function commitRecipe(recipe, byId, ctx, mult) {
    recipe.ing.forEach(function (i) {
      const product = byId[i.p];
      if (!product) return;

      let need = i.g * mult;
      const fromPantry = Math.min(need, ctx.pantry[i.p] || 0);
      if (fromPantry > 0) {
        ctx.pantry[i.p] -= fromPantry;
        if (ctx.pantry[i.p] < 1) delete ctx.pantry[i.p];
        need -= fromPantry;
      }
      if (need <= 0.5) return;

      const c = ctx.committed[i.p] || (ctx.committed[i.p] = { bought: 0, used: 0 });
      const free = Math.max(0, c.bought - c.used);
      const fromFree = Math.min(need, free);
      c.used += fromFree;
      need -= fromFree;
      if (need <= 0.5) return;

      const extra = product.w
        ? SH().roundUp(need, SH().weighStep(product))
        : Math.ceil(need / product.pack) * product.pack;
      c.bought += extra;
      c.used += need;
    });
  }

  /* Часть стоимости рецепта, которую можно покрыть из кладовой.
     Именно это заставляет приложение «доедать» то, что уже куплено. */
  function pantryCover(recipe, byId, pantry, mult) {
    let covered = 0, totalCost = 0;
    recipe.ing.forEach(function (i) {
      const p = byId[i.p];
      if (!p) return;
      const need = i.g * mult;
      const cost = need * S().pricePerBase(p);
      totalCost += cost;
      const have = Math.min(need, pantry[i.p] || 0);
      covered += have * S().pricePerBase(p);
    });
    return totalCost > 0 ? covered / totalCost : 0;
  }

  /* КБЖУ рецепта из каталога — из заранее посчитанной таблицы.
   *
   * Подбор блюда перебирает все подходящие рецепты и у каждого спрашивает
   * калорийность — по нескольку раз за проход, и так на каждый из 21 приёма
   * пищи, да ещё внутри подгонки под бюджет. В сумме выходило под тридцать
   * тысяч пересчётов одного и того же за одну сборку недели: рецепты каталога
   * за время расчёта не меняются, а КБЖУ у них честно складывался заново
   * из ингредиентов каждый раз.
   *
   * Таблица считается один раз в makeCtx и ключуется САМИМ объектом рецепта,
   * а не его id. Это не педантизм: в план попадает clone(), состав правят
   * всегда у копии — и tuneMacros, и замены продуктов, — а id у копии тот же,
   * что у оригинала. По id правленая копия получила бы КБЖУ нетронутого
   * каталожного блюда, то есть цифры, которых в тарелке нет. По объекту
   * копия просто не находится в таблице и считается честно.
   */
  function nutritionOfRecipe(ctx, recipe, byId) {
    const hit = ctx.nut && ctx.nut.get(recipe);
    return hit || N().recipeNutrition(recipe, byId);
  }

  /* Во сколько раз рецепт придётся масштабировать под этот приём пищи.
     Нужна до общего пересчёта порций, чтобы правильно оценить закупку. */
  function estimateMult(recipe, byId, ctx, slot) {
    const nut = nutritionOfRecipe(ctx, recipe, byId);
    const target = (ctx.slotTargets[slot] || { kcal: 600 }).kcal;
    return Math.max(MULT_MIN, Math.min(MULT_MAX, target / Math.max(1, nut.total.kcal)));
  }

  function consumePantry(pantry, recipe, mult) {
    recipe.ing.forEach(function (i) {
      const need = i.g * mult;
      if (!pantry[i.p]) return;
      pantry[i.p] = Math.max(0, pantry[i.p] - need);
      if (pantry[i.p] < 1) delete pantry[i.p];
    });
  }

  // ---------------------------------------------------------------- нормы

  /* Доли приёмов пищи одного человека, пересчитанные на его набор.
     Если он не завтракает, завтраковые калории расходятся по остальным
     приёмам, а не пропадают: суточная норма от этого не уменьшается. */
  function personShares(person) {
    const meals = window.App.MEALS;
    const active = (person.meals || []).filter(m => meals[m]);
    const sum = active.reduce((s, m) => s + meals[m].share, 0) || 1;
    const out = {};
    active.forEach(m => { out[m] = meals[m].share / sum; });
    return out;
  }

  /* Цель каждого приёма пищи в абсолютных величинах: складываем доли только
     тех, кто в этом приёме участвует. Поэтому если перекус нужен одному
     из двоих, порция считается на одного, а не на двоих. */
  function slotTargets(people) {
    const out = {};
    people.forEach(function (person) {
      const t = N().personTargets(person);
      const shares = personShares(person);
      Object.keys(shares).forEach(function (slot) {
        const bucket = out[slot] || (out[slot] = { kcal: 0, p: 0, f: 0, c: 0, eaters: [], byPerson: [] });
        bucket.kcal += t.kcal * shares[slot];
        bucket.p += t.p * shares[slot];
        bucket.f += t.f * shares[slot];
        bucket.c += t.c * shares[slot];
        bucket.eaters.push(person.name);
        // Личная доля нужна, чтобы разложить готовое блюдо по тарелкам:
        // общая цифра на двоих не говорит, кому сколько класть.
        bucket.byPerson.push({
          id: person.id,
          name: person.name,
          kcal: Math.round(t.kcal * shares[slot]),
          p: Math.round(t.p * shares[slot]),
          f: Math.round(t.f * shares[slot]),
          c: Math.round(t.c * shares[slot])
        });
      });
    });
    Object.keys(out).forEach(function (slot) {
      out[slot].kcal = Math.round(out[slot].kcal);
      out[slot].p = Math.round(out[slot].p);
      out[slot].f = Math.round(out[slot].f);
      out[slot].c = Math.round(out[slot].c);
    });
    return out;
  }

  /* Цели приёмов пищи для этого плана.
   *
   * План живёт в браузере неделями и переживает обновления приложения, поэтому
   * сохранённая структура может оказаться старее кода. Так и вышло с разбивкой
   * по людям: у планов, собранных до её появления, поля byPerson нет, и раскладка
   * «кому сколько класть» молча не показывалась — пользователю оставалось гадать,
   * почему обещанного нет. Требовать пересборки ради этого неправильно, поэтому
   * недостающее досчитывается на месте и записывается обратно в план. */
  function targetsOf(plan) {
    const stored = plan.slotTargets;
    const complete = stored && Object.keys(stored).length &&
      Object.keys(stored).every(k => stored[k] && stored[k].byPerson && stored[k].byPerson.length);
    if (complete) return stored;

    const fresh = slotTargets(S().get().people);
    if (plan.slotTargets !== fresh) plan.slotTargets = fresh;
    return fresh;
  }

  /* Все приёмы пищи, которые едят из одной кастрюли: день готовки и его
     «вчерашние» продолжения. */
  function potMeals(plan, dayIndex, slot) {
    const day = plan.days[dayIndex];
    const meal = day && day.meals.find(m => m.slot === slot);
    if (!meal) return [];

    const cookIndex = meal.leftoverOf != null ? meal.leftoverOf : dayIndex;
    const out = [];
    const cook = plan.days[cookIndex] && plan.days[cookIndex].meals.find(m => m.slot === slot);
    if (cook) out.push(cook);
    plan.days.forEach(function (d) {
      d.meals.forEach(function (m) {
        if (m.leftoverOf === cookIndex && m.slot === slot) out.push(m);
      });
    });
    return out;
  }

  /* Разложить правку состава на всю кастрюлю.
   *
   * Блюдо «на два дня» хранится двумя копиями — так у каждого дня своя порция.
   * Но кастрюля-то одна: если поправить состав в день готовки, второй день
   * обязан измениться вместе с ним. Без этого две копии расходятся, и второй
   * день показывает еду, которую никто не готовил. */
  function syncPot(plan, dayIndex, slot) {
    const meals = potMeals(plan, dayIndex, slot);
    if (meals.length < 2) return 0;

    const day = plan.days[dayIndex];
    const source = day && day.meals.find(m => m.slot === slot);
    if (!source || !source.recipe) return 0;

    let changed = 0;
    meals.forEach(function (m) {
      if (m === source || !m.recipe) return;
      m.recipe = Object.assign({}, source.recipe, {
        ing: source.recipe.ing.map(i => ({ p: i.p, g: i.g }))
      });
      changed++;
    });
    return changed;
  }

  /* Во что обходится один приём пищи.
   *
   * Не «граммы × цена с ценника»: так получается на 38% меньше того, что уходит
   * в кассе. Считаем по фактическим тратам — переплата за целые упаковки ложится
   * на те блюда, ради которых упаковка куплена, а взятое из кладовой на этой
   * неделе не стоит ничего. Сумма по всем приёмам пищи в точности равна итогу
   * списка покупок. */
  function mealCost(plan, meal) {
    if (!meal || !meal.recipe) return 0;
    const rates = SH().unitRates(plan);
    return meal.recipe.ing.reduce(function (sum, i) {
      return sum + i.g * meal.mult * (rates[i.p] || 0);
    }, 0);
  }

  function dayCost(plan, day) {
    return day.meals.reduce((sum, m) => sum + mealCost(plan, m), 0);
  }

  /* Разложить готовое блюдо по тарелкам.
   *
   * Готовим одно, а нормы у людей разные — значит и порции разные. Здесь
   * общий вес блюда делится в той же пропорции, в какой относятся личные
   * калорийные доли этого приёма пищи.
   *
   * Вес считается по съедобной части ингредиентов: кожура и обрезь до тарелки
   * не доходят. Для супов он всё равно занижен — вода в рецепте не указана,
   * поэтому в интерфейсе цифра подписана как приблизительная. */
  function mealPortions(plan, meal) {
    if (!meal || !meal.recipe) return [];
    const byId = S().productsById();
    const slot = (targetsOf(plan)[meal.slot]) || null;
    if (!slot || !slot.byPerson || !slot.byPerson.length) return [];

    const totalWeight = meal.recipe.ing.reduce(function (sum, i) {
      const p = byId[i.p];
      return p ? sum + i.g * meal.mult * (1 - (p.wst || 0)) : sum;
    }, 0);

    const nut = meal.nutrition || N().nutritionOf(
      meal.recipe.ing.map(i => ({ p: i.p, g: i.g * meal.mult })), byId);

    // Стоимость именно этой тарелки — по фактическим тратам, а не по ценнику.
    const total = mealCost(plan, meal);

    // Делим на сумму личных долей, а не на общую цифру приёма пищи: обе
    // округлены по отдельности, и от этого доли не складывались в единицу —
    // цена блюда расходилась с суммой по людям на пару рублей.
    const slotKcal = slot.byPerson.reduce((sum, x) => sum + x.kcal, 0) || 1;
    return slot.byPerson.map(function (person) {
      const share = person.kcal / slotKcal;
      return {
        name: person.name,
        share: share,
        grams: Math.round(totalWeight * share),
        kcal: Math.round((nut.kcal || 0) * share),
        p: Math.round((nut.p || 0) * share),
        f: Math.round((nut.f || 0) * share),
        c: Math.round((nut.c || 0) * share),
        cost: total * share
      };
    });
  }

  // ---------------------------------------------------------------- сборка

  /* Что уже стоит в этом дне: одно и то же блюдо на обед и на ужин —
     это не экономия, а надоедание, и такой повтор отличается от «то же самое,
     но завтра». Поэтому запрет на день действует независимо от того,
     сколько повторов за неделю человек себе разрешил. */
  function usedOnDay(day) {
    return day.meals.filter(m => m.recipe).map(m => m.recipe.id);
  }

  /* Блюда этого же дня, кроме самого заменяемого. Нужно там, где приём пищи
     меняют задним числом — ради белка или ради бюджета: эти замены выбирали
     блюдо по слоту, не глядя на остальной день, и возвращали дубль,
     который подбор только что аккуратно обошёл.

     Номер дня передаётся отдельным доводом, а не берётся из пометки на самом
     приёме пищи. Пометка живёт только до отката: restore() разбирает план
     заново, и у свежих объектов её нет. Молча получив undefined, функция
     возвращала пустой список — то есть «сегодня ничего не занято», — и запрет
     на повтор внутри дня тихо отключался. */
  function otherDishesToday(plan, dayIndex, meal) {
    const day = plan.days[dayIndex];
    if (!day) return [];
    return day.meals.filter(m => m !== meal && m.recipe).map(m => m.recipe.id);
  }

  function pickRecipe(slot, ctx, usedToday) {
    const { byId, pantry, usage, lastBySlot, settings } = ctx;
    const sameDay = usedToday || [];

    // Запрет «то же самое два дня подряд» нужен тем, кто хочет разнообразия.
    // Если человек сознательно поднял лимит повторов до 4 и выше, он готов есть
    // одно блюдо подряд — и запрет только мешает.
    const allowBackToBack = settings.maxRepeat >= 4;

    let candidates = ctx.recipes.filter(function (r) {
      if (r.m.indexOf(slot) === -1) return false;
      if (sameDay.indexOf(r.id) !== -1) return false;
      if ((usage[r.id] || 0) >= settings.maxRepeat) return false;
      if (!allowBackToBack && lastBySlot[slot] === r.id) return false;
      return true;
    });

    // Если фильтры срезали всё (мало рецептов после исключений) — ослабляем их
    // по одному, начиная с наименее важного. Запрет на повтор внутри дня
    // снимается последним: он заметнее всего портит впечатление от меню.
    if (!candidates.length) {
      candidates = ctx.recipes.filter(r => r.m.indexOf(slot) !== -1 && sameDay.indexOf(r.id) === -1);
    }
    if (!candidates.length) {
      candidates = ctx.recipes.filter(r => r.m.indexOf(slot) !== -1);
    }
    if (!candidates.length) return null;

    // Считаем цену за килокалорию по остатку упаковок: блюдо из продуктов,
    // которые в списке уже есть, обходится почти даром.
    const slotKcal = (ctx.slotTargets[slot] || { kcal: 600 }).kcal;
    // КБЖУ каждого кандидата спрашиваем один раз и передаём дальше: ниже оно
    // нужно трижды — для цены, для оценки порции и для белковой плотности.
    const nuts = candidates.map(r => nutritionOfRecipe(ctx, r, byId));

    const costs = candidates.map(function (r, idx) {
      const kcal = nuts[idx].total.kcal || 1;
      const mult = Math.max(0.35, Math.min(3.0, slotKcal / kcal));
      return marginalCost(r, byId, ctx, mult) / (kcal * mult);
    });
    const medianCost = costs.slice().sort((a, b) => a - b)[Math.floor(costs.length / 2)] || 1;

    const scored = candidates.map(function (r, idx) {
      const nut = nuts[idx];
      let score = 0;
      score += pantryCover(r, byId, pantry, 1) * 1.5;      // доесть скоропорт из кладовой
      // Вес 5 выбран замером: перебор значений от 2,5 до 10 на восьми прогонах
      // дал здесь лучшую среднюю стоимость недели при сохранении разнообразия.
      // В режиме экономии цена перевешивает всё остальное.
      score -= (costs[idx] / (medianCost || 1)) * (ctx.costFocus ? 12.0 : 5.0);
      score -= (usage[r.id] || 0) * (ctx.costFocus ? 0.4 : 1.5);   // на жёстком бюджете повторы допустимы
      if (r.t > 50) score -= 0.4;                          // долгие рецепты реже

      // Блюдо, которое под этот приём пищи приходится сжимать впятеро или
      // растягивать втрое, здесь не к месту: даже уложившись в границы,
      // оно даёт неестественную порцию и уводит день от нормы.
      const ideal = slotKcal / Math.max(1, nut.total.kcal);
      if (ideal < MULT_COMFORT_LOW) score -= (MULT_COMFORT_LOW - ideal) * 6;
      else if (ideal > MULT_COMFORT_HIGH) score -= (ideal - MULT_COMFORT_HIGH) * 1.5;

      if (ctx.proteinDeficit) {
        score += Math.min(1.2, nut.total.p / Math.max(1, nut.total.kcal) * 60);
      }
      score += Math.random() * (ctx.costFocus ? 0.15 : 0.4);       // чтобы неделя не повторялась дословно
      return { r: r, score: score };
    });

    scored.sort((a, b) => b.score - a.score);
    const top = scored.slice(0, Math.min(5, scored.length));
    const weights = top.map((_, i) => top.length - i);
    let roll = Math.random() * weights.reduce((a, b) => a + b, 0);
    for (let i = 0; i < top.length; i++) {
      roll -= weights[i];
      if (roll <= 0) return top[i].r;
    }
    return top[0].r;
  }

  /* Пересчёт порций: каждое блюдо масштабируется так, чтобы попасть
     в калорийную долю своего приёма пищи. Вызывается после любой правки плана. */
  function rebalance(plan, byId) {
    const targets = targetsOf(plan);

    plan.days.forEach(function (day) {
      day.meals.forEach(function (meal) {
        if (!meal.recipe) return;
        const nut = N().recipeNutrition(meal.recipe, byId);
        const targetKcal = (targets[meal.slot] || { kcal: 0 }).kcal;
        const total = nut.total.kcal || 1;
        let mult = targetKcal / total;
        mult = Math.max(MULT_MIN, Math.min(MULT_MAX, mult));
        meal.mult = Math.round(mult * 100) / 100;
      });
    });

    // Блюда «на два дня»: закупаем на оба дня в день готовки, второй день не готовим.
    plan.days.forEach(function (day, di) {
      day.meals.forEach(function (meal) {
        if (!meal.recipe) return;
        if (meal.leftoverOf != null) { meal.buy = 0; return; }
        let buy = meal.mult;
        const next = plan.days[di + 1];
        if (next) {
          const twin = next.meals.find(m => m.leftoverOf === di && m.slot === meal.slot);
          if (twin) buy += twin.mult;
        }
        meal.buy = Math.round(buy * 100) / 100;
      });
    });

    recomputeNutrition(plan, byId);
  }

  function recomputeNutrition(plan, byId) {
    let week = { kcal: 0, p: 0, f: 0, c: 0 };
    plan.days.forEach(function (day) {
      const scaled = [];
      day.meals.forEach(function (meal) {
        if (!meal.recipe) return;
        // Один и тот же пересчёт граммов на порцию делался дважды подряд:
        // сначала в общий список дня, потом заново для самого блюда. Пересчёт
        // копеечный, но rebalance вызывается после каждой пробы оптимизатора —
        // около тысячи раз за сборку недели, — и лишний список из двух десятков
        // объектов на каждый приём пищи набегает в сотни тысяч.
        const portion = meal.recipe.ing.map(i => ({ p: i.p, g: i.g * meal.mult }));
        portion.forEach(i => scaled.push(i));
        meal.nutrition = N().nutritionOf(portion, byId);
      });
