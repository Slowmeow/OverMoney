        ])),
        h('tbody', {}, history.slice().reverse().map(function (r) {
          const dev = r.planned > 0 ? Math.round((r.actual - r.planned) / r.planned * 100) : 0;
          return h('tr', {}, [
            h('td', { text: r.date }),
            h('td.num', { text: u.money(r.planned) }),
            h('td.num', { text: u.money(r.actual) }),
            h('td.num', { text: u.money(r.budget) }),
            h('td.num' + (Math.abs(dev) > 10 ? '.bad' : ''), { text: u.signedPct(dev) })
          ]);
        }))
      ])
    ]);
  }

  function dataCard() {
    const u = U(), h = u.h;

    const fileInput = h('input', {
      type: 'file', accept: '.json', style: { display: 'none' },
      onchange: function (e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function () {
          try {
            S().importJson(reader.result);
            u.toast('Данные загружены');
            window.App.ui.refresh();
          } catch (err) {
            u.toast('Не получилось: ' + err.message, 'bad');
          }
        };
        reader.readAsText(file);
      }
    });

    const sync = window.App.sync ? window.App.sync.status() : { available: false };

    return u.card('Данные', [
      h('p', { text: sync.available
        ? 'Сейчас телефон и компьютер работают с общей базой: она лежит файлом data.json ' +
          'рядом с приложением на компьютере, и правки с любого устройства видны везде.'
        : 'Сейчас данные живут только в этом браузере: общая база недоступна — ' +
          'скорее всего, не запущен start.bat. Правки с телефона сюда не попадут.' }),

      h('p.hint', { text: 'Всё остаётся у вас: ни на какие серверы в интернете данные не уходят. ' +
        'Браузер может очистить своё хранилище сам — например, при чистке истории, — поэтому ' +
        'раз в месяц имеет смысл выгружать копию в файл.' }),

      h('ul.plain', {}, [
        h('li', { text: 'Выгрузить в файл — скачивает всё: бюджет, профили, цены с историей, ' +
          'кладовую, планы и закупки. Это ваша резервная копия, её можно положить куда угодно.' }),
        h('li', { text: 'Загрузить из файла — заменяет текущие данные содержимым копии. ' +
          'Пригодится при переезде на другой компьютер или если что-то пошло не так.' }),
        h('li', { text: 'Сбросить всё — стирает данные и возвращает приложение к первому запуску. ' +
          'Отменить это нельзя, поэтому сначала выгрузите копию.' })
      ]),

      h('div.row-actions', {}, [
        u.button('Выгрузить в файл', function () {
          const blob = new Blob([S().exportJson()], { type: 'application/json' });
          const link = h('a', { href: URL.createObjectURL(blob), download: 'spendings-' + S().today() + '.json' });
          document.body.appendChild(link);
          link.click();
          link.remove();
        }),
        u.button('Загрузить из файла', () => fileInput.click()),
        u.button('Сбросить всё', function () {
          if (!confirm('Удалить все данные: бюджет, профили, цены, кладовую и планы?')) return;
          S().reset();
          u.toast('Сброшено');
          window.App.ui.go('dashboard');
        }, 'danger')
      ]),
      fileInput
    ]);
  }

  window.App = window.App || {};
  window.App.views = window.App.views || {};
  window.App.views.settings = { title: 'Настройки', render: render };
})();

/* ===== js/ui/view-account.js ===== */
/* Экран аккаунта: вход, регистрация и общее хозяйство. */
(function () {
  'use strict';

  const U = () => window.App.ui;
  const A = () => window.App.account;
  const C = () => window.App.cloud;

  // Что показывать на экране входа: вход, регистрацию или восстановление.
  let mode = 'signin';
  let notice = '';
  let noticeTone = '';

  function say(text, tone) {
    notice = text;
    noticeTone = tone || '';
    U().refresh();
  }

  function render() {
    const u = U(), h = u.h;

    if (!C().available()) return offlineOnlyCard();
    if (!C().signedIn()) return h('div.view', {}, authCard());

    return h('div.view', {}, [
      accountCard(),
      householdCard(),
      inviteCard(),
      joinCard()
    ]);
  }

  /* Облако не настроено — рассказываем, что это значит, без упрёка. */
  function offlineOnlyCard() {
    const u = U(), h = u.h;
    return h('div.view', {}, u.card('Аккаунты не подключены', [
      h('p', { text: 'Приложение работает целиком в этом браузере: данные никуда не уходят, ' +
        'но и не появляются на других устройствах сами.' }),
      h('p.hint', { text: 'Чтобы включить аккаунты и синхронизацию, нужно один раз завести ' +
        'бесплатный проект Supabase и вписать два значения в js/core/config.js. ' +
        'Как — расписано в README, раздел «Аккаунты и синхронизация».' }),
      h('p.hint', { text: 'Пока этого нет, переносите данные файлом: «Настройки → Данные».' })
    ]));
  }

  // ---------------------------------------------------------------- вход

  function authCard() {
    const u = U(), h = u.h;

    const email = u.input({ type: 'email', placeholder: 'почта', autocomplete: 'email' });
    const pass = u.input({
      type: 'password', placeholder: 'пароль',
      autocomplete: mode === 'signup' ? 'new-password' : 'current-password'
    });

    function run(action) {
      const e = email.value.trim(), p = pass.value;
      if (!e) return say('Впишите почту', 'bad');
      if (mode !== 'reset' && p.length < 6) return say('Пароль — минимум 6 знаков', 'bad');
      say('Секунду…');
      action(e, p).then(function (res) {
        if (res && res.needsConfirmation) {
          say('Проверьте почту: там письмо со ссылкой для подтверждения. ' +
            'После неё возвращайтесь и входите.', '');
          mode = 'signin';
          U().refresh();
          return;
        }
        notice = '';
        u.toast(mode === 'signup' ? 'Аккаунт создан' : 'С возвращением');
        u.go('dashboard');
      }).catch(err => say(err.message, 'bad'));
    }

    const actions = {
      signin: {
        title: 'Вход',
        button: 'Войти',
        go: () => run(A().signIn),
        links: [
          ['Ещё нет аккаунта — зарегистрироваться', () => { mode = 'signup'; notice = ''; U().refresh(); }],
          ['Забыл пароль', () => { mode = 'reset'; notice = ''; U().refresh(); }]
        ]
      },
      signup: {
        title: 'Регистрация',
        button: 'Создать аккаунт',
        go: () => run(A().signUp),
        links: [['Уже есть аккаунт — войти', () => { mode = 'signin'; notice = ''; U().refresh(); }]]
      },
      reset: {
        title: 'Восстановление пароля',
        button: 'Прислать письмо',
        go: function () {
          const e = email.value.trim();
          if (!e) return say('Впишите почту', 'bad');
          say('Отправляю…');
          C().resetPassword(e)
            .then(() => say('Письмо отправлено, если такой аккаунт есть. Проверьте почту.', ''))
            .catch(err => say(err.message, 'bad'));
        },
        links: [['Вспомнил — войти', () => { mode = 'signin'; notice = ''; U().refresh(); }]]
      }
    }[mode];

    // Enter в любом поле делает то же, что кнопка: иначе на телефоне
    // приходится закрывать клавиатуру, чтобы дотянуться до кнопки.
    [email, pass].forEach(function (el) {
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter') actions.go(); });
    });

    return u.card(actions.title, [
      h('p.hint', { text: 'Аккаунт нужен, чтобы данные жили не в одном браузере, ' +
        'а переходили между телефоном и компьютером — и не пропали, если браузер почистится.' }),
      u.field('Почта', email),
      mode !== 'reset' ? u.field('Пароль', pass, mode === 'signup' ? 'Минимум 6 знаков' : null) : null,
      notice ? h('p.notice' + (noticeTone === 'bad' ? '.bad' : ''), { text: notice }) : null,
      h('div.row-actions', {}, [
        u.button(actions.button, actions.go, 'primary'),
        ...actions.links.map(([label, fn]) => u.button(label, fn, 'ghost small'))
      ]),
      h('hr.sep'),
      h('p.hint', { text: 'Можно и без аккаунта — тогда данные останутся только в этом браузере, ' +
        'а при чистке истории пропадут. Завести аккаунт можно позже: всё, что успеете ' +
        'наработать, перенесётся.' }),
      u.button('Посмотреть без аккаунта', function () {
        A().setGuest(true);
        u.go('dashboard');
        u.toast('Работаем без аккаунта — данные только в этом браузере');
      }, 'ghost')
    ]);
  }

  // ---------------------------------------------------------------- вошли

  function accountCard() {
    const u = U(), h = u.h;
    const st = A().status();

    const line = st.conflict ? 'данные разошлись с облаком'
      : st.error ? st.error
      : st.pending ? 'сохраняю…'
      : 'всё сохранено';

    return u.card('Аккаунт', [
      h('table.kv', {}, h('tbody', {}, [
        h('tr', {}, [h('td', { text: 'Почта' }), h('td.num', { text: st.email })]),
        h('tr', {}, [h('td', { text: 'Состояние' }), h('td.num', { text: line })])
      ])),
      h('div.row-actions', {}, [
        u.button('Сохранить сейчас', function () {
          A().flushNow().then(() => u.toast('Отправлено')).then(() => u.refresh());
        }),
        u.button('Обновить с сервера', function () {
          A().pull({ adoptRemote: true }).then(function () {
            u.refresh();
            u.toast('Данные получены');
          });
        }),
        u.button('Сменить пароль', changePassword, 'ghost'),
        u.button('Выйти', function () {
          u.modal('Выйти из аккаунта?', [
            h('p', { text: 'Данные этого хозяйства сотрутся с этого устройства — чтобы их ' +
              'не увидел следующий, кто откроет приложение здесь.' }),
            h('p.hint', { text: 'В облаке они останутся и вернутся при следующем входе.' })
          ], [
            { label: 'Отмена' },
            { label: 'Выйти', cls: 'primary', onClick: function () {
              A().signOut().then(function () {
                u.refresh();
                u.toast('Вы вышли');
              });
            } }
          ]);
        }, 'ghost')
      ])
    ]);
  }

  function changePassword() {
    const u = U(), h = u.h;
    const pass = u.input({ type: 'password', placeholder: 'новый пароль', autocomplete: 'new-password' });
    u.modal('Смена пароля', [
      u.field('Новый пароль', pass, 'Минимум 6 знаков')
    ], [
      { label: 'Отмена' },
      { label: 'Сменить', cls: 'primary', onClick: function () {
        if (pass.value.length < 6) { u.toast('Пароль — минимум 6 знаков', 'bad'); return true; }
        C().changePassword(pass.value)
          .then(() => u.toast('Пароль изменён'))
          .catch(err => u.toast(err.message, 'bad'));
      } }
    ]);
  }

  // ---------------------------------------------------------------- хозяйство

  function householdCard() {
    const u = U(), h = u.h;
    const hh = A().household;
    if (!hh) return u.card('Хозяйство', [h('p.hint', { text: 'Загружаю…' })]);

    const list = h('ul.plain', {}, h('li', { text: 'Загружаю участников…' }));
    A().people().then(function (rows) {
      list.innerHTML = '';
      rows.forEach(function (p) {
        list.appendChild(h('li', { text: p.email + (p.user_id === (C().user() || {}).id ? '  — это вы' : '') }));
      });
      if (!rows.length) list.appendChild(h('li', { text: 'Пока только вы' }));
    }).catch(function () {
      list.innerHTML = '';
      list.appendChild(h('li', { text: 'Не удалось получить список' }));
    });

    return u.card('Общее хозяйство', [
      h('p.hint', { text: 'Бюджет, кладовая, цены и меню принадлежат хозяйству, а не человеку. ' +
        'Пока вы в нём один — это просто ваши данные. Появится второй — станут общими, ' +
        'потому что кастрюля на кухне тоже одна.' }),
      u.field('Название', u.input({
        value: hh.name,
        onchange: function (e) {
          A().rename(e.target.value.trim() || 'Моё хозяйство')
            .then(() => u.toast('Переименовано'))
            .catch(err => u.toast(err.message, 'bad'));
        }
      })),
      h('h3', { text: 'Кто в хозяйстве' }),
      list,
      A().household ? h('div.row-actions', {}, u.button('Выйти из хозяйства', function () {
        u.modal('Выйти из общего хозяйства?', [
          h('p', { text: 'Вы перестанете видеть общие данные. Вам заведётся своё хозяйство, ' +
            'и в нём останется копия того, что сейчас на экране.' }),
          h('p.hint', { text: 'Остальные участники ничего не потеряют.' })
        ], [
          { label: 'Отмена' },
          { label: 'Выйти', cls: 'primary', onClick: function () {
            A().leave().then(function () {
              u.refresh();
              u.toast('Вы вышли из общего хозяйства');
            }).catch(err => u.toast(err.message, 'bad'));
          } }
        ]);
      }, 'ghost small')) : null
    ]);
  }

  function inviteCard() {
    const u = U(), h = u.h;
    const hh = A().household;
    if (!hh) return null;

    return u.card('Позвать в хозяйство', [
      h('p', { text: 'Продиктуйте этот код тому, кого зовёте. Он вводит его у себя ' +
        'в «Аккаунте», и с этого момента бюджет, кладовая и цены у вас общие.' }),
      h('div.invite-code', { text: hh.invite_code }),
      h('p.hint', { text: 'В коде нет похожих друг на друга знаков — ноля и буквы «O», ' +
        'единицы и «I»: его диктуют голосом, и путать их не придётся.' }),
      h('div.row-actions', {}, [
        u.button('Скопировать', function () {
          const ok = () => u.toast('Код скопирован');
          if (navigator.clipboard) navigator.clipboard.writeText(hh.invite_code).then(ok).catch(() => {});
          else ok();
        }),
        u.button('Сменить код', function () {
          A().rotateInvite().then(function () {
            u.refresh();
            u.toast('Код сменён — старый больше не работает');
          }).catch(err => u.toast(err.message, 'bad'));
        }, 'ghost small')
      ])
    ]);
  }

  function joinCard() {
    const u = U(), h = u.h;
    const code = u.input({ placeholder: 'например, K7M4XPQR', maxlength: 12 });

    return u.card('Присоединиться к чужому хозяйству', [
      h('p', { text: 'Если вас позвали — введите код. Ваши данные не пропадут: ' +
        'бюджеты сложатся, кладовая и журнал цен объединятся, ваши профили ' +
        'добавятся к тем, что уже есть.' }),
      u.field('Код приглашения', code),
      h('div.row-actions', {}, u.button('Присоединиться', function () {
        const value = code.value.trim();
        if (!value) return u.toast('Введите код', 'bad');

        u.busy('Проверяю код…', function () {
          A().previewJoin(value).then(function (preview) {
            confirmJoin(value, preview);
          }).catch(err => u.toast(err.message, 'bad'));
        });
      }, 'primary'))
    ]);
  }

  /* Слияние необратимо, поэтому человек видит заранее, что именно изменится. */
  function confirmJoin(code, preview) {
    const u = U(), h = u.h;
    const changes = preview.changes || [];

    u.modal('Объединить хозяйства?', [
      h('p', { text: 'Вы присоединяетесь к хозяйству «' + (preview.household.name || 'без названия') + '».' }),
      changes.length
        ? h('div', {}, [
            h('p.hint', { text: 'Что изменится:' }),
            h('ul.plain', {}, changes.map(c => h('li', { text: c })))
          ])
        : h('p.hint', { text: 'В том хозяйстве пока нет данных — туда перенесётся всё ваше.' }),
      h('p.hint', { text: 'Разъединиться можно в любой момент, но разделить обратно то, ' +
        'что слилось, приложение не умеет: цены и кладовая останутся общими у обоих.' })
    ], [
      { label: 'Отмена', onClick: function () {
        // Вступление уже произошло — иначе состав чужого хозяйства не узнать.
        // Передумал, значит выходим обратно и возвращаемся в своё.
        A().cancelJoin().then(() => u.refresh());
      } },
      { label: 'Объединить', cls: 'primary', onClick: function () {
        u.busy('Объединяю…', function () {
          A().joinByCode(code).then(function () {
            u.refresh();
            u.toast('Хозяйства объединены — соберите неделю заново');
          }).catch(err => u.toast(err.message, 'bad'));
        });
      } }
    ]);
  }

  window.App = window.App || {};
  window.App.views = window.App.views || {};
  window.App.views.account = { title: 'Аккаунт', render: render };
})();

/* ===== js/app.js ===== */
/* Точка входа: навигация между экранами и общие действия. */
(function () {
  'use strict';

  /* Показывается в подвале. Если после обновления цифра не изменилась —
     браузер отдал страницу из кеша, и правок вы не увидите. */
  const APP_VERSION = '1.9';

  // Набор и порядок вкладок задаёт выбранное расположение экранов:
  // «Вкладки» и «Календарь» — это два разных взгляда на одни данные.
  function order() {
    return window.App.layout ? window.App.layout.order() : ['dashboard', 'week', 'list', 'pantry', 'prices', 'reports', 'settings'];
  }
  function home() {
    return window.App.layout ? window.App.layout.home() : 'dashboard';
  }
  let current = 'dashboard';

  /* Пока человек не вошёл и не согласился смотреть гостем, всё приложение —
     это один экран входа. Иначе первое, что видит открывший адрес, — чужой
     бюджет и чужая кладовая: данные-то лежат в браузере от прошлого хозяина
     устройства. Вход существует ровно чтобы такого не было. */
  function locked() {
    return !!(window.App.account && window.App.account.needsAuth());
  }

  function go(name) {
    if (locked()) name = 'account';
    current = window.App.views[name] ? name : home();
    location.hash = current;
    refresh();
    window.scrollTo(0, 0);
  }

  function refresh() {
    if (locked()) current = 'account';
    // Экран мог остаться от прежнего расположения, где его больше нет.
    if (!window.App.views[current] || order().indexOf(current) === -1) {
      if (!locked()) current = home();
    }
    const view = window.App.views[current];
    const root = document.getElementById('view');
    root.innerHTML = '';
    try {
      root.appendChild(view.render());
    } catch (err) {
      console.error(err);
      root.appendChild(window.App.ui.h('div.view', {}, [
        window.App.ui.card('Что-то сломалось', [
          window.App.ui.h('p', { text: err.message }),
          window.App.ui.h('p.hint', { text: 'Подробности — в консоли браузера (F12).' })
        ])
      ]));
    }
    renderNav();
  }

  function renderNav() {
    const nav = document.getElementById('nav');
    nav.innerHTML = '';
    // На экране входа вкладок нет: показывать их значило бы предлагать
    // заглянуть в данные, которых человеку ещё не полагается видеть.
    if (locked()) return;
    order().forEach(function (name) {
      const view = window.App.views[name];
      if (!view) return;
      // Вкладка аккаунта появляется, только если облако вообще настроено.
      if (name === 'account' && !(window.App.cloud && window.App.cloud.available())) return;
      nav.appendChild(window.App.ui.h('button.tab' + (name === current ? '.active' : ''), {
        type: 'button',
        onclick: () => go(name),
        // Активную вкладку экранный диктор иначе не отличит от остальных:
        // подсветка цветом ему не видна.
        'aria-current': name === current ? 'page' : null,
        text: view.title
      }));
    });
  }

  /* Собрать неделю заново. Список покупок при этом обнуляется:
     отметки от прошлой закупки к новому плану не относятся. */
  function generate() {
    const u = window.App.ui;
    const store = window.App.store;

    // Подбор блюд и подгонка под бюджет считаются в потоке отрисовки —
    // на телефоне это заметная пауза. Сначала показываем, что работа идёт.
    u.busy('Собираю неделю…', function () {
      try {
        const plan = window.App.planner.generate();
        const state = store.get();
        state.plan = plan;
        state.listState = {};
        store.save();

        const limit = plan.budget ? plan.budget.food : store.weeklyBudget().food;
        const diff = limit - plan.cost;
        u.toast(diff >= 0
          ? 'Неделя собрана: ' + u.money(plan.cost) + ', остаётся ' + u.money(diff)
          : 'Собрано за ' + u.money(plan.cost) + ' — на ' + u.money(-diff) + ' больше бюджета');
        go('week');
      } catch (err) {
        console.error(err);
        u.toast('Не удалось собрать неделю: ' + err.message, 'bad');
      }
    });
  }

  /* Облачный аккаунт: забираем данные при старте и при возвращении к вкладке.
     Опрашивать чаще незачем — правки делает человек, а не поток событий. */
  function setupAccount() {
    const account = window.App.account;
    if (!account || !window.App.cloud.available()) return;

    account.onChange(function (st) {
      // Подвал обещает то, что происходит на самом деле. Пока человек
      // не вошёл, данные и правда никуда не уходят; после входа — уходят,
      // и делать вид, что нет, нельзя.
      const privacy = document.getElementById('privacy');
      if (privacy) {
        privacy.textContent = st.signedIn
          ? 'Данные хранятся в вашем аккаунте и в этом браузере.'
          : 'Данные хранятся только в этом браузере. Резервная копия — «Настройки → Данные».';
      }

      const el = document.getElementById('sync');
      if (!el) return;
      if (!st.signedIn) el.textContent = st.guest ? '· без аккаунта' : '';
      else if (st.conflict) el.textContent = '· данные разошлись';
      else if (st.error) el.textContent = '· нет связи, сохраню позже';
      else if (st.pending) el.textContent = '· сохраняю…';
      else el.textContent = '· ' + ((st.household && st.household.name) || 'синхронизировано');
    });

    account.init().then(refresh);

    function catchUp() {
      if (!window.App.cloud.signedIn()) return;
      account.pull().then(function (state) { if (state) refresh(); });
    }

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) account.flushNow();
      else catchUp();
    });
    window.addEventListener('focus', catchUp);
    window.addEventListener('online', catchUp);
    // Закрывают вкладку — отправляем не дожидаясь паузы, иначе последняя
    // правка цены в магазине останется только в этом телефоне.
    window.addEventListener('pagehide', () => account.flushNow());
  }

  /* Общая база через домашний компьютер: работает, только когда запущен
     start.bat. С облаком не конфликтует — там, где есть аккаунт, api/state
     просто не отвечает, и этот слой сам отключается. */
  function setupSync() {
    const sync = window.App.sync;
    const store = window.App.store;
    if (!sync) return;
    // Когда данными заведует облако, второй хозяин им не нужен.
    if (window.App.cloud && window.App.cloud.available()) return;

    let busy = false;

    function pull(announce) {
      if (busy) return;
      busy = true;
      sync.pull().then(function (remote) {
        busy = false;
        if (!remote) return;
        store.adopt(remote);
        refresh();
        if (announce) window.App.ui.toast('Данные обновлены с другого устройства');
      }).catch(function () { busy = false; });
    }

    sync.onChange(function (st) {
      const el = document.getElementById('sync');
      if (!el) return;
      if (st.conflict) el.textContent = '· расхождение с общей базой';
      else if (!st.available) el.textContent = '· только этот браузер';
      else if (st.pending) el.textContent = '· сохраняю…';
      else el.textContent = '· общая база';
    });

    pull(false);
    // Первое устройство наполняет пустую базу своим состоянием.
    setTimeout(() => sync.flush(() => store.get()).then(handleConflict), 400);

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) pull(true);
    });
    window.addEventListener('focus', () => pull(true));
    window.addEventListener('online', () => pull(true));
  }

  /* Расхождение развязывает человек: молча затирать чужую работу нельзя. */
  function handleConflict(result) {
    if (!result || !result.conflict) return;
    const u = window.App.ui;
    const store = window.App.store;

    u.modal('Данные разошлись между устройствами', [
      u.h('p', { text: 'Пока вы работали здесь, базу изменили с другого устройства. ' +
        'Слить автоматически нельзя — придётся выбрать, какая версия верна.' }),
      u.h('p.hint', { text: 'Совет: если на другом устройстве вы только что отмечали цены в магазине, ' +
        'берите версию оттуда — здесь правки, скорее всего, мельче.' })
    ], [
      {
        label: 'Взять с другого устройства', onClick: function () {
          store.adopt(result.state);
          window.App.sync.acceptRemote(result.rev);
          refresh();
          u.toast('Приняты данные с другого устройства');
        }
      },
      {
        label: 'Оставить эти', cls: 'primary', onClick: function () {
          window.App.sync.overwrite(() => store.get()).then(function () {
            u.toast('Общая база перезаписана этой версией');
          });
        }
      }
    ]);
  }

  function init() {
    window.App.store.load();

    const versionEl = document.getElementById('version');
    if (versionEl) versionEl.textContent = 'версия ' + APP_VERSION;
    window.App.ui.go = go;
    window.App.ui.refresh = refresh;
    window.App.ui.generate = generate;
    window.App.ui.setLayout = function (id) {
      window.App.layout.set(id);
      go(window.App.layout.home());
    };

    const fromHash = location.hash.replace('#', '');
    current = window.App.views[fromHash] ? fromHash : home();
    if (locked()) current = 'account';

    refresh();

    window.addEventListener('hashchange', function () {
      const name = location.hash.replace('#', '');
      if (name && name !== current && window.App.views[name]) go(name);
    });

    setupAccount();
    setupSync();

    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('sw.js').catch(() => { /* офлайн-режим просто не включится */ });
    }
  }

  document.addEventListener('DOMContentLoaded', init);
})();

</script></body>
</html>
