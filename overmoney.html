<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f4a">

  <!--
    Правила, по которым странице разрешено что-либо загружать и куда-либо ходить.

    Проверено, что приложение не делает ничего из запрещённого: внешних адресов
    в нём нет ни одного, форм нет, object, embed, base и iframe нет, url() в
    стилях нет, а по сети оно ходит только к себе — за общей базой.

    Смысл не в том, чтобы починить существующую дыру: настоящих здесь не нашлось.
    Смысл в том, чем закончится будущая ошибка. Без этих правил внедрённый код
    может отправить всю кладовую, цены и профили на чужой сервер одной строкой.
    С ними — не может: connect-src, img-src и script-src не выпускают запросы
    за пределы своего адреса, а отсутствие unsafe-eval закрывает eval.

    'unsafe-inline' оставлен сознательно. Код и стили вклеены внутрь страницы —
    иначе версия для телефона не собралась бы в один файл. Само по себе это
    ничего не открывает: приложение нигде не пишет разметку, всё выводится
    через textContent, и внедрить туда inline-скрипт неоткуда.

    frame-ancestors здесь не указан намеренно: в meta он не работает, только
    в заголовке ответа, а заголовками GitHub Pages управлять не даёт.

    Единственный внешний адрес в connect-src — тот самый проект Supabase,
    куда уходит синхронизация аккаунтов. Здесь стоит точный адрес, а не
    звёздочка: со звёздочкой утекать данные было бы можно в любой проект
    Supabase, какой заведёт себе злоумышленник, а с точным — некуда вовсе.

    ЕСЛИ ВЫ РАЗВЕРНУЛИ ЭТО У СЕБЯ: адрес здесь и адрес в js/core/config.js
    должны совпадать. Разойдутся — вход будет молча не работать, потому что
    браузер запретит запрос ещё до отправки.
  -->
  <!--
    blob: в default-src — ради выгрузки резервной копии. Файл отдаётся ссылкой
    на blob:, который страница создаёт сама, и браузеры расходятся в том,
    подпадает ли такая ссылка под эти правила. Проверить наверняка нечем,
    а цена ошибки высокая: выгрузка копии — единственный способ не потерять
    данные, и запрещать её вслепую нельзя. Защиты это не ослабляет: blob:
    живёт внутри страницы и никуда не ведёт, отправить на нём данные наружу
    невозможно. Для кода и стилей разрешение не действует — у них свои строки.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' blob:;
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    connect-src 'self' https://omznfiuifmrtvetzhqcp.supabase.co;
    manifest-src 'self' data:;
    worker-src 'self';
    object-src 'none';
    base-uri 'none';
    form-action 'none'">

/* Оформление приложения.
 *
 * Построено на токенах: всё, что повторяется — размер шрифта, отступ,
 * скругление, тень, скорость анимации — вынесено в переменные, а компоненты
 * ссылаются на них по смыслу. Это не украшательство: без единой шкалы
 * интерфейс расползается, у каждой карточки заводится свой отступ, и разнобой
 * читается как неряшливость, даже когда человек не может назвать причину.
 *
 * Две величины намеренно зафиксированы и не подлежат подгонке под вкус:
 * светлая поверхность #ffffff и тёмная #1c2023. Палитра графиков прошла
 * проверку на различимость при дальтонизме именно против них, и смена фона
 * обесценила бы эту проверку.
 */

:root {
  /* ---------- цвет ---------- */
  --bg: #f5f7f4;
  --surface: #ffffff;          /* зафиксировано: под этот фон валидированы графики */
  --surface-2: #f0f3ee;
  --surface-3: #e8ece5;
  --ink: #171a18;
  --ink-soft: #59635b;
  --ink-faint: #8b938d;
  --line: #e3e7e0;
  --line-strong: #ccd3c9;
  --accent: #1f6f4a;
  --accent-hover: #195c3d;
  --accent-soft: #e4f0e9;
  --accent-ink: #ffffff;
  --good: #1f6f4a;
  --bad: #a83a28;
  --bad-soft: #fbecea;
  --warn: #8a6a12;
  --warn-bg: #fdf4dc;
  --scroll-thumb: #c6cdc4;
  --overlay: rgba(18, 24, 20, .42);

  /* ---------- типографика ----------
     Системный стек: в офлайн-приложении веб-шрифт грузить неоткуда, а Segoe UI
     и SF Pro рисуют кириллицу лучше любого суррогата. */
  --font-sans: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI",
               Roboto, "Helvetica Neue", Arial, sans-serif;

  --text-2xs: 11px;
  --text-xs: 12px;
  --text-sm: 13px;
  --text-md: 15px;
  --text-lg: 17px;
  --text-xl: 21px;
  --text-2xl: 28px;
  --text-3xl: 34px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semi: 600;
  --weight-bold: 700;

  /* Отрицательный трекинг на крупном кегле — иначе заголовки выглядят рыхлыми. */
  --tracking-tight: -.015em;
  --tracking-tighter: -.025em;

  /* ---------- ритм ---------- */
  --space-1: 2px;
  --space-2: 4px;
  --space-3: 6px;
  --space-4: 8px;
  --space-5: 12px;
  --space-6: 16px;
  --space-7: 20px;
  --space-8: 24px;
  --space-9: 32px;
  --space-10: 40px;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 999px;

  --shadow-sm: 0 1px 2px rgba(20, 30, 24, .05);
  --shadow-md: 0 1px 2px rgba(20, 30, 24, .06), 0 4px 14px rgba(20, 30, 24, .05);
  --shadow-lg: 0 8px 24px rgba(20, 30, 24, .10), 0 2px 6px rgba(20, 30, 24, .06);
  --shadow-pop: 0 20px 50px rgba(15, 22, 18, .28);

  /* ---------- движение ----------
     Одна кривая на всё приложение. Разнобой в анимации заметен даже тем,
     кто не умеет его назвать: интерфейс начинает казаться собранным
     из чужих кусков. */
  --ease: cubic-bezier(.2, .8, .2, 1);
  --dur-fast: 110ms;
  --dur: 170ms;
  --dur-slow: 260ms;

  color-scheme: light dark;
  accent-color: var(--accent);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131719;
    --surface: #1c2023;        /* зафиксировано: под этот фон валидированы графики */
    --surface-2: #23282c;
    --surface-3: #2b3135;
    --ink: #e9ecea;
    --ink-soft: #9ba49e;
    --ink-faint: #78817b;
    --line: #2e3438;
    --line-strong: #3d4448;
    --accent: #57b98a;
    --accent-hover: #6bc899;
    --accent-soft: #1d2f27;
    --accent-ink: #0e1512;
    --good: #57b98a;
    --bad: #e08b7a;
    --bad-soft: #2a1e1b;
    --warn: #e0c477;
    --warn-bg: #2a2718;
    --scroll-thumb: #3c4348;
    --overlay: rgba(0, 0, 0, .58);

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-md: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    --shadow-lg: 0 8px 24px rgba(0, 0, 0, .38), 0 2px 6px rgba(0, 0, 0, .3);
    --shadow-pop: 0 20px 50px rgba(0, 0, 0, .55);
  }
}

/* ================= основа ================= */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--text-md);
  line-height: var(--leading-normal);
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Заголовки и подписи не должны заканчиваться одиноким словом на строке. */
h1, h2, h3, h4 {
  text-wrap: balance;
  letter-spacing: var(--tracking-tight);
  line-height: var(--leading-tight);
}
p, .hint, .field-hint, .meal-meta, .item-meta { text-wrap: pretty; }

/* Полосы прокрутки в тон интерфейсу: первое правило — современный стандарт,
   второе — для браузеров, которые его ещё не понимают. */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--scroll-thumb) transparent;
}
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--scroll-thumb);
  border-radius: var(--radius-full);
  border: 2px solid transparent;
  background-clip: content-box;
}
*::-webkit-scrollbar-thumb:hover { background-color: var(--ink-faint); background-clip: content-box; }

/* Фокус виден только при работе с клавиатуры: мышью он мешает,
   с клавиатуры без него невозможно понять, где находишься. */
:where(button, input, select, textarea, a, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ================= шапка ================= */

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
  padding: var(--space-5) var(--space-6) 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  margin-bottom: var(--space-4);
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: var(--weight-bold);
  font-size: var(--text-sm);
}

.brand-name {
  font-weight: var(--weight-semi);
  letter-spacing: var(--tracking-tight);
}

.tabs { display: flex; gap: var(--space-1); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }

.tab {
  position: relative;
  flex: 0 0 auto;
  border: 0;
  background: none;
  color: var(--ink-soft);
  padding: var(--space-4) var(--space-5) var(--space-5);
  font: inherit;
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  cursor: pointer;
  white-space: nowrap;
  transition: color var(--dur) var(--ease);
}

/* Подчёркивание — отдельным слоем, чтобы его можно было анимировать
   и чтобы активная вкладка не дёргала соседей на пиксель. */
.tab::after {
  content: '';
  position: absolute;
  left: var(--space-5);
  right: var(--space-5);
  bottom: 0;
  height: 2px;
  border-radius: var(--radius-full);
  background: var(--accent);
  transform: scaleX(0);
  transition: transform var(--dur) var(--ease);
}

.tab:hover { color: var(--ink); }
.tab.active { color: var(--accent); font-weight: var(--weight-semi); }
.tab.active::after { transform: scaleX(1); }

/* ================= каркас ================= */

.main { max-width: 880px; margin: 0 auto; padding: var(--space-6) var(--space-6) var(--space-10); }
.view { display: flex; flex-direction: column; gap: var(--space-5); }

.footer {
  max-width: 880px;
  margin: 0 auto;
  padding: 0 var(--space-6) var(--space-9);
  color: var(--ink-faint);
  font-size: var(--text-xs);
}
.version { opacity: .75; margin-left: var(--space-3); font-variant-numeric: tabular-nums; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}
.card.muted { box-shadow: none; background: var(--surface-2); }

.card-title {
  margin: 0;
  padding: var(--space-5) var(--space-6);
  font-size: var(--text-sm);
  font-weight: var(--weight-semi);
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--space-5);
}
.group-sum { color: var(--ink-soft); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }

.card-body { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); }

/* ================= текст и мелочи ================= */

.hint { margin: 0; color: var(--ink-soft); font-size: var(--text-sm); }

/* Предупреждение читают, когда план не сошёлся с бюджетом, — значит абзацы
   должны быть разделены, а не слипаться в сплошную стену текста. */
.note {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  background: var(--warn-bg);
  color: var(--ink);
  border-left: 3px solid var(--warn);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: var(--space-5) var(--space-6);
  font-size: var(--text-sm);
  line-height: var(--leading-relaxed);
}
.note p { margin: 0; }
.note p:first-child { font-weight: var(--weight-semi); color: var(--warn); }

.plain {
  margin: 0;
  padding-left: var(--space-7);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  font-size: var(--text-sm);
}
.pre { white-space: pre-wrap; font-size: var(--text-xs); }
.steps { font-size: var(--text-sm); color: var(--ink-soft); margin: var(--space-5) 0 0; line-height: var(--leading-relaxed); }
.sub-head { margin: var(--space-5) 0 0; font-size: var(--text-sm); font-weight: var(--weight-semi); }

/* ================= кнопки ================= */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  border-radius: var(--radius-sm);
  padding: var(--space-4) var(--space-6);
  font: inherit;
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--dur) var(--ease),
              border-color var(--dur) var(--ease),
              color var(--dur) var(--ease),
              transform var(--dur-fast) var(--ease);
}

.btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
/* Лёгкое вдавливание при нажатии: подтверждение, что клик засчитан. */
.btn:active { transform: translateY(1px); }

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  box-shadow: var(--shadow-sm);
}
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-ink); }

.btn.ghost { border-color: transparent; background: none; color: var(--ink-soft); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); border-color: transparent; }

.btn.small { padding: var(--space-3) var(--space-4); font-size: var(--text-xs); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }

.row-actions { display: flex; flex-wrap: wrap; gap: var(--space-4); }

/* ================= поля ввода ================= */

.input {
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  border-radius: var(--radius-sm);
  padding: var(--space-4) var(--space-5);
  font: inherit;
  font-size: var(--text-sm);
  width: 100%;
  min-width: 0;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.input:hover { border-color: var(--ink-faint); }
/* Обводку рисует общее правило :focus-visible — здесь только подсветка рамки,
   иначе при клике мышью получаются два кольца одно в другом. */
.input:focus { border-color: var(--accent); outline: none; }

.small-input { width: 88px; }
.price-input { width: 92px; text-align: right; font-variant-numeric: tabular-nums; }

.field { display: flex; flex-direction: column; gap: var(--space-2); font-size: var(--text-sm); }
.field-label { color: var(--ink-soft); font-weight: var(--weight-medium); font-size: var(--text-xs); }
.field-hint { color: var(--ink-faint); font-size: var(--text-2xs); line-height: var(--leading-normal); }

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: var(--space-5);
  align-items: start;
}
.form-grid.compact { gap: var(--space-4); }

/* Подписи бывают в одну и в две строки, а под частью полей есть пояснение.
   Subgrid выстраивает подписи, поля ввода и пояснения по общим линиям, поэтому
   длинная подпись больше не роняет соседние поля вниз. */
@supports (grid-template-rows: subgrid) {
  .form-grid > .field {
    display: grid;
    grid-row: span 3;
    grid-template-rows: subgrid;
    gap: var(--space-2);
  }
}

.checkline {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-size: var(--text-sm);
  color: var(--ink-soft);
  cursor: pointer;
  transition: color var(--dur) var(--ease);
}
.checkline:hover { color: var(--ink); }
.checkline.tight { flex: 0 0 auto; white-space: nowrap; }
.checkgroup { display: flex; flex-wrap: wrap; gap: var(--space-6); }

.filters { display: flex; gap: var(--space-4); flex-wrap: wrap; align-items: center; }
.filters .input { width: auto; flex: 1 1 180px; }

/* ================= таблицы ================= */

.table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.table th, .table td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); text-align: left; }
.table th { color: var(--ink-soft); font-weight: var(--weight-medium); font-size: var(--text-xs); }
.table tr:last-child td { border-bottom: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.bad { color: var(--bad); }

.kv { width: 100%; border-collapse: collapse; font-size: var(--text-md); }
.kv td { padding: var(--space-3) 0; }
.kv td:last-child { font-variant-numeric: tabular-nums; }
.kv tr.minus td, .kv tr.total td { color: var(--ink-soft); }
.kv tr.result td {
  font-weight: var(--weight-bold);
  border-top: 1px solid var(--line);
  padding-top: var(--space-5);
  color: var(--ink);
}

/* ================= предупреждения ================= */

.warn-stack { display: flex; flex-direction: column; gap: var(--space-4); }

.warn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  background: var(--warn-bg);
  color: var(--warn);
  border-radius: var(--radius-sm);
  padding: var(--space-5) var(--space-6);
  font-size: var(--text-sm);
}
.warn-text { flex: 1 1 auto; line-height: var(--leading-normal); }
.warn .btn { background: transparent; border-color: currentColor; color: inherit; }
.warn .btn:hover { background: color-mix(in srgb, currentColor 12%, transparent); color: inherit; }

/* ================= обзор ================= */

.big-figure { display: flex; flex-direction: column; gap: var(--space-1); }
/* Крупное число — пропорциональными цифрами: моноширинные в таком кегле
   выглядят разреженными. */
.big-num {
  font-size: var(--text-3xl);
  font-weight: var(--weight-bold);
  letter-spacing: var(--tracking-tighter);
  line-height: 1.1;
}
.big-figure.under .big-num { color: var(--good); }
.big-figure.over .big-num { color: var(--bad); }
.big-cap { color: var(--ink-soft); font-size: var(--text-sm); }

.bar-row {
  display: grid;
  grid-template-columns: 96px 1fr 96px;
  align-items: center;
  gap: var(--space-5);
  font-size: var(--text-sm);
}
.bar-label { color: var(--ink-soft); }
.bar-track { height: 8px; background: var(--surface-3); border-radius: var(--radius-full); overflow: hidden; }
.bar-track.wide { height: 10px; }
.bar-fill {
  height: 100%;
  border-radius: var(--radius-full);
  background: var(--accent);
  transition: width var(--dur-slow) var(--ease);
}
.bar-fill.low { background: var(--warn); }
.bar-fill.high { background: var(--bad); }
.bar-value { text-align: right; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.ideas { display: flex; flex-direction: column; gap: var(--space-3); }
.ideas h3 { margin: 0; font-size: var(--text-sm); }
.ideas ul { margin: 0; padding-left: var(--space-7); font-size: var(--text-sm); color: var(--ink-soft); }

.swaps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-3); font-size: var(--text-sm); }
.swaps li { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
.swap-from { color: var(--ink-soft); }
.swap-arrow { color: var(--ink-faint); }
.swap-to { font-weight: var(--weight-medium); }
.swap-saved { margin-left: auto; color: var(--good); font-variant-numeric: tabular-nums; }

.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--space-4); }
.stat {
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  padding: var(--space-5) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}
.stat-value { font-size: var(--text-xl); font-weight: var(--weight-semi); letter-spacing: var(--tracking-tight); }
.stat-label { font-size: var(--text-xs); color: var(--ink-soft); }
.stat.good .stat-value { color: var(--good); }
.stat.bad .stat-value { color: var(--bad); }

/* ================= разбор перерасхода ================= */

/* Перерасход должен бросаться в глаза, но не кричать: рамка цветом беды
   и заголовок, остальное — обычный текст. */
.over-card { border-color: var(--bad); }
.over-card > .card-title { color: var(--bad); border-bottom-color: var(--bad); }

.over-list { display: flex; flex-direction: column; gap: var(--space-3); }
.over-row {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) auto minmax(0, 1.2fr) 72px auto;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-4) var(--space-5);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
}
.over-main { display: flex; flex-direction: column; min-width: 0; }
.over-from { font-weight: var(--weight-semi); font-size: var(--text-sm); }
.over-spend { font-size: var(--text-2xs); color: var(--ink-soft); }
.over-arrow { color: var(--ink-faint); }
.over-pick { min-width: 0; }
.over-pick .input { width: 100%; }
.over-to { font-size: var(--text-sm); }
.over-saves { color: var(--good); font-weight: var(--weight-semi); font-variant-numeric: tabular-nums; text-align: right; }
.over-actions { display: flex; gap: var(--space-3); }

@media (max-width: 720px) {
  .over-row { grid-template-columns: minmax(0, 1fr) 72px; }
  .over-arrow { display: none; }
  .over-pick { grid-column: 1 / -1; }
  .over-actions { grid-column: 1 / -1; }
}

/* ================= неделя ================= */

.week { display: flex; flex-direction: column; gap: var(--space-4); }
.week-head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-5); flex-wrap: wrap; }
.week-cost { font-size: var(--text-xl); font-weight: var(--weight-bold); letter-spacing: var(--tracking-tight); }
.week-cost.over { color: var(--bad); }
.week-cap { color: var(--ink-soft); font-size: var(--text-sm); }

.day {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.day-head {
  display: flex;
  align-items: baseline;
  gap: var(--space-4);
  padding: var(--space-4) var(--space-6);
  background: var(--surface-2);
  flex-wrap: wrap;
}
.day-head h3 { margin: 0; font-size: var(--text-sm); font-weight: var(--weight-semi); }
.day-date { color: var(--ink-faint); font-size: var(--text-xs); }
.day-kcal { margin-left: auto; font-size: var(--text-xs); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.day-kcal.warn { color: var(--warn); }
.day-cost { font-size: var(--text-sm); font-weight: var(--weight-semi); font-variant-numeric: tabular-nums; }

.day-meals { display: flex; flex-direction: column; }
.meal {
  display: flex;
  align-items: center;
  gap: var(--space-5);
  padding: var(--space-4) var(--space-6);
  border-top: 1px solid var(--line);
  transition: background var(--dur) var(--ease);
}
.meal:first-child { border-top: 0; }
.meal:hover { background: var(--surface-2); }
.meal.leftover { background: var(--surface-2); }
.meal.empty { color: var(--ink-faint); }
.meal-slot { flex: 0 0 68px; font-size: var(--text-xs); color: var(--ink-faint); }
.meal-main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
.meal-name { font-weight: var(--weight-medium); }
.meal-meta { font-size: var(--text-xs); color: var(--ink-soft); }
.meal-actions { flex: 0 0 auto; display: flex; gap: var(--space-2); }

/* Кому сколько класть: готовим одно блюдо, а нормы у людей разные. */
.meal-portions { display: flex; flex-wrap: wrap; gap: var(--space-4); margin-top: var(--space-2); }
.portion { display: inline-flex; align-items: baseline; gap: var(--space-2); font-size: var(--text-2xs); }
.portion-who { color: var(--ink); font-weight: var(--weight-medium); }
.portion-amount { color: var(--accent); font-weight: var(--weight-semi); font-variant-numeric: tabular-nums; }
.portion-kcal { color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.portion-cost { color: var(--ink-soft); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }

.portion-box { display: flex; flex-direction: column; gap: var(--space-3); }
.portion-list { display: flex; flex-direction: column; gap: var(--space-2); }
.portion-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1.3fr) 64px 44px;
  align-items: baseline;
  gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
}
.portion-row .portion-amount, .portion-row .portion-kcal { font-size: var(--text-xs); }
.portion-share { text-align: right; color: var(--ink-faint); font-size: var(--text-2xs); font-variant-numeric: tabular-nums; }

.alt-list { display: flex; flex-direction: column; gap: var(--space-3); max-height: 55vh; overflow-y: auto; }
.alt {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: var(--space-1) var(--space-5);
  text-align: left;
  background: var(--surface-2);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: var(--space-4) var(--space-5);
  font: inherit;
  color: inherit;
  cursor: pointer;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.alt:hover { border-color: var(--accent); background: var(--accent-soft); }
.alt-name { font-weight: var(--weight-medium); font-size: var(--text-sm); }
.alt-meta { grid-column: 1; font-size: var(--text-xs); color: var(--ink-soft); }
.alt-cost { grid-row: 1 / span 2; align-self: center; font-variant-numeric: tabular-nums; font-size: var(--text-sm); }
.alt-cost.cheaper { color: var(--good); }
.alt-cost.pricier { color: var(--bad); }

/* ================= редактор состава ================= */

.recipe-edit { display: flex; flex-direction: column; gap: var(--space-5); }

/* Состав — таблица с одной шапкой, а не набор карточек с подписью над каждым
   полем: подписи вроде «₽ / бутылка 900 мл» у каждой строки своей длины,
   и поля разъезжались по горизонтали. Общая сетка держит колонки на месте. */
.recipe-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 96px 96px 32px;
  align-items: center;
  column-gap: var(--space-4);
  row-gap: 0;
}

.rg-head {
  font-size: var(--text-2xs);
  color: var(--ink-faint);
  font-weight: var(--weight-medium);
  padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--line);
}
.rg-head.rg-num { text-align: right; }

.recipe-grid > .rg-name,
.recipe-grid > .rg-field,
.recipe-grid > .rg-drop {
  border-bottom: 1px solid var(--line);
  padding-top: var(--space-4);
  padding-bottom: var(--space-4);
}
/* Последняя строка без линии — она упирается в итог, у которого своя. */
.recipe-grid > *:nth-last-child(-n + 4) { border-bottom: 0; }

.rg-name { display: flex; flex-direction: column; min-width: 0; gap: var(--space-1); }
.recipe-name { font-weight: var(--weight-semi); font-size: var(--text-sm); }
.recipe-meta { font-size: var(--text-2xs); color: var(--ink-soft); }

.rg-field { display: flex; align-items: center; gap: var(--space-2); }
.rg-input {
  width: 100%;
  text-align: right;
  padding: var(--space-3) var(--space-4);
  font-variant-numeric: tabular-nums;
}
/* Единица прижата к полю справа и не занимает колонку: она короткая
   и одинаковая внутри строки. */
.rg-unit { font-size: var(--text-2xs); color: var(--ink-faint); width: 20px; flex: 0 0 auto; }
.rg-drop { justify-self: end; }

.recipe-total {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--space-5);
  font-size: var(--text-sm);
  padding-top: var(--space-4);
  border-top: 1px solid var(--line-strong);
}
.recipe-nut { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.recipe-cost { font-weight: var(--weight-semi); font-variant-numeric: tabular-nums; font-size: var(--text-md); }

.candidate-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--surface-2);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: var(--space-4) var(--space-5);
  font: inherit;
  font-size: var(--text-sm);
  color: inherit;
  cursor: pointer;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.candidate-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

/* ================= список покупок ================= */

.list-groups { display: flex; flex-direction: column; gap: var(--space-4); }
.list-group .card-body { gap: 0; padding: var(--space-2) var(--space-6) var(--space-4); }

.item {
  display: flex;
  align-items: center;
  gap: var(--space-5);
  padding: var(--space-4) 0;
  border-bottom: 1px solid var(--line);
  transition: opacity var(--dur) var(--ease);
}
.item:last-child { border-bottom: 0; }
.item.done { opacity: .45; }
.item.done .item-name { text-decoration: line-through; }
.check { width: 19px; height: 19px; flex: 0 0 auto; accent-color: var(--accent); cursor: pointer; }
.item-main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
.item-name { font-weight: var(--weight-medium); }
.item-meta { font-size: var(--text-xs); color: var(--ink-soft); }
.item-price { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-1); }
.item-cost { font-variant-numeric: tabular-nums; font-weight: var(--weight-medium); }
.price-edit { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-2xs); color: var(--ink-faint); }

/* ================= внесение чека ================= */

.receipt-video { width: 100%; max-height: 260px; border-radius: var(--radius-sm); display: none; background: #000; }
.receipt-list { display: flex; flex-direction: column; gap: var(--space-2); max-height: 40vh; overflow-y: auto; }
.receipt-row {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) auto 88px;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
}
.receipt-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.receipt-qty { font-size: var(--text-2xs); color: var(--ink-soft); white-space: nowrap; }

/* ================= кладовая ================= */

.add-block { display: flex; flex-direction: column; gap: var(--space-4); }
.search-results { display: flex; flex-direction: column; gap: var(--space-3); }
.candidate {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
}
.candidate-name { flex: 1 1 auto; font-size: var(--text-sm); min-width: 0; }
.candidate .input { width: auto; }
.candidate select.input { width: auto; max-width: 150px; }

.pantry-list { display: flex; flex-direction: column; gap: var(--space-3); }
.pantry-row { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) 0; border-bottom: 1px solid var(--line); }
.pantry-row:last-child { border-bottom: 0; }
.pantry-main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
.pantry-name { font-weight: var(--weight-medium); font-size: var(--text-sm); }
.pantry-meta { font-size: var(--text-xs); color: var(--ink-soft); }
.unit-tag { font-size: var(--text-xs); color: var(--ink-faint); }

/* ================= цены ================= */

.price-list { display: flex; flex-direction: column; }
.price-row {
  display: flex;
  align-items: center;
  gap: var(--space-5);
  padding: var(--space-4) 0;
  border-bottom: 1px solid var(--line);
  transition: opacity var(--dur) var(--ease);
}
.price-row:last-child { border-bottom: 0; }
.price-row.excluded { opacity: .45; }
.price-main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
.price-name { font-weight: var(--weight-medium); font-size: var(--text-sm); }
.price-meta { font-size: var(--text-xs); color: var(--ink-soft); }
.price-input-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-1); }
.price-age { font-size: var(--text-2xs); color: var(--ink-faint); }
.price-age.stale { color: var(--warn); }
.price-actions { display: flex; flex-direction: column; gap: var(--space-1); flex: 0 0 auto; }

.brand-list { display: flex; flex-direction: column; gap: var(--space-3); }
.brand-row {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-4) var(--space-5);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  transition: border-color var(--dur) var(--ease);
}
.brand-row.chosen { border-color: var(--accent); }
.brand-main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
.brand-title { font-weight: var(--weight-semi); font-size: var(--text-sm); }
.brand-meta { font-size: var(--text-2xs); color: var(--ink-soft); }
.brand-tag { font-size: var(--text-2xs); color: var(--accent); white-space: nowrap; }

/* ================= настройки ================= */

.people { display: flex; flex-direction: column; gap: var(--space-5); }
.person {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  transition: border-color var(--dur) var(--ease);
}
.person.needs-setup { border-color: var(--warn); }
.person-head { display: flex; align-items: center; gap: var(--space-4); }
.person-name { font-weight: var(--weight-semi); }
.person-result { display: flex; flex-direction: column; gap: var(--space-1); margin: 0; font-size: var(--text-sm); color: var(--accent); font-weight: var(--weight-medium); }
.person-formula { color: var(--ink-soft); font-weight: var(--weight-normal); font-size: var(--text-xs); line-height: var(--leading-normal); }
.person-meals { display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap; }
.person-meals .field-label { flex: 0 0 auto; }

/* Ограничения свёрнуты в строку: обычный случай — их нет, и держать
   на экране весь список незачем. Полный выбор живёт в модальном окне. */
.diets-row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
.diets-row .field-label { flex: 0 0 auto; }
.diet-empty { font-size: var(--text-sm); color: var(--ink-faint); }

.diet-tags { display: flex; flex-wrap: wrap; gap: var(--space-3); flex: 1 1 auto; min-width: 0; }
.diet-tag {
  display: inline-flex;
  align-items: stretch;
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.diet-tag-name, .diet-tag-drop {
  border: 0;
  background: none;
  font: inherit;
  color: var(--accent);
  cursor: pointer;
  padding: var(--space-2) var(--space-4);
  font-size: var(--text-xs);
  font-weight: var(--weight-medium);
  transition: background var(--dur) var(--ease);
}
.diet-tag-name:hover, .diet-tag-drop:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.diet-tag-drop { padding-left: var(--space-2); padding-right: var(--space-4); opacity: .75; }

.diet-list { display: flex; flex-direction: column; gap: var(--space-2); }
.diet-row {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-4) var(--space-5);
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.diet-row:hover { background: var(--surface-2); }
.diet-row.on { border-color: var(--accent); background: var(--accent-soft); }
.diet-main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
.diet-name { font-size: var(--text-sm); font-weight: var(--weight-semi); }
.diet-short { font-size: var(--text-2xs); color: var(--ink-soft); }

.slot-summary { display: flex; flex-wrap: wrap; gap: var(--space-4); }
.slot-chip {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  padding: var(--space-4) var(--space-5);
}
.slot-chip-name { font-size: var(--text-sm); font-weight: var(--weight-semi); }
.slot-chip-meta { font-size: var(--text-2xs); color: var(--ink-soft); }
.slot-chip-total { font-size: var(--text-2xs); color: var(--ink-faint); }

.regulars { display: flex; flex-direction: column; gap: var(--space-3); }
.regular-row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.regular-row .input { width: auto; flex: 0 1 auto; }
.regular-row select.input { max-width: 200px; }
.regular-cost { font-size: var(--text-xs); color: var(--ink-soft); margin-left: auto; font-variant-numeric: tabular-nums; }

/* ================= графики =================
   Палитра прогнана валидатором на обеих поверхностях приложения.
   Все проверки пройдены — полоса светлоты, насыщенность, различимость соседних
   пар при дальтонизме (худшая ΔE 9,1 в светлой теме и 8,4 в тёмной при пороге 8)
   и при обычном зрении (19,6 и 19,3 при пороге 15). В светлой теме три слота
   не добирают контраст 3:1 к белому, поэтому у каждого графика есть подписи
   у концов и таблица с числами — значение нигде не держится на одном цвете. */

.viz {
  --surface-1: var(--surface);
  --viz-grid: var(--line);
  --viz-axis: var(--line-strong);
  --viz-muted: var(--ink-faint);
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;

  margin: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .viz {
    /* Те же оттенки, переступенчатые под тёмную поверхность,
       а не осветлённые автоматически. */
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --s5: #d55181;
  }
}

.viz-head { display: flex; flex-direction: column; gap: var(--space-1); }
.viz-title { margin: 0; font-size: var(--text-sm); font-weight: var(--weight-semi); }
.viz-sub { margin: 0; font-size: var(--text-xs); color: var(--ink-soft); }

.viz-legend { display: flex; flex-wrap: wrap; gap: var(--space-5); font-size: var(--text-xs); color: var(--ink-soft); }
.viz-legend-item { display: inline-flex; align-items: center; gap: var(--space-3); }
.viz-key { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
.viz-key.line { width: 14px; height: 3px; border-radius: var(--radius-full); }

.viz-canvas { position: relative; }
.viz-plot { overflow-x: auto; }

.viz-grid { stroke: var(--viz-grid); stroke-width: 1; }
.viz-axis { stroke: var(--viz-axis); stroke-width: 1; }
.viz-cross { stroke: var(--viz-muted); stroke-width: 1; }
.viz-ref { stroke: var(--ink-soft); stroke-width: 1; }
.viz-ref-label { fill: var(--ink-soft); font-size: 10px; }

/* Текст никогда не носит цвет ряда: идентичность несёт метка рядом. */
.viz-tick { fill: var(--viz-muted); font-size: 10px; font-variant-numeric: tabular-nums; }
.viz-tick-y { text-anchor: end; }
.viz-tick-x { text-anchor: middle; }
.viz-endlabel { fill: var(--ink); font-size: 11px; font-variant-numeric: tabular-nums; }
.viz-rowlabel { fill: var(--ink); font-size: 11px; text-anchor: end; }

.viz-bar { transition: opacity var(--dur-fast) var(--ease); }
.viz-bar.hot { opacity: .78; }

.viz-tip {
  position: absolute;
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--dur) var(--ease);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  padding: var(--space-4) var(--space-5);
  font-size: var(--text-xs);
  min-width: 116px;
  z-index: 5;
}
.viz-tip.on { opacity: 1; }
.viz-tip-head { color: var(--ink-soft); font-size: var(--text-2xs); margin-bottom: var(--space-2); }
.viz-tip-row { display: flex; align-items: center; gap: var(--space-3); }
.viz-tip-key { width: 12px; height: 3px; border-radius: var(--radius-full); flex: 0 0 auto; }
/* Значение впереди и жирнее: ряд читателю уже известен, ему нужно число. */
.viz-tip-val { font-weight: var(--weight-semi); font-variant-numeric: tabular-nums; }
.viz-tip-name { color: var(--ink-soft); }

.viz-table summary {
  font-size: var(--text-xs);
  color: var(--ink-soft);
  cursor: pointer;
  transition: color var(--dur) var(--ease);
}
.viz-table summary:hover { color: var(--ink); }
.viz-table[open] summary { margin-bottom: var(--space-3); }

.viz-stat { display: flex; flex-direction: column; gap: var(--space-1); background: var(--surface-2); border-radius: var(--radius-sm); padding: var(--space-5) var(--space-6); }
.viz-stat-label { font-size: var(--text-xs); color: var(--ink-soft); }
.viz-stat-value { font-size: var(--text-lg); font-weight: var(--weight-semi); letter-spacing: var(--tracking-tight); }
.viz-stat-delta { font-size: var(--text-xs); color: var(--ink-soft); }
.viz-stat-delta.good { color: var(--good); }
.viz-stat-delta.bad { color: var(--bad); }

.viz-empty { gap: var(--space-3); }
.small-multiples { display: flex; flex-direction: column; gap: var(--space-8); }

/* ================= модальные окна и уведомления ================= */

.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--overlay);
  backdrop-filter: blur(2px);
  display: grid;
  place-items: center;
  padding: var(--space-6);
  animation: overlay-in var(--dur) var(--ease);
}

@keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes modal-in {
  from { opacity: 0; transform: translateY(8px) scale(.99); }
  to { opacity: 1; transform: none; }
}

.modal {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  width: min(580px, 100%);
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-pop);
  animation: modal-in var(--dur-slow) var(--ease);
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  padding: var(--space-5) var(--space-6);
  border-bottom: 1px solid var(--line);
}
.modal-head h3 { margin: 0; font-size: var(--text-lg); font-weight: var(--weight-semi); }
.modal-body { padding: var(--space-6); overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-5); }
.modal-foot {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-4);
  padding: var(--space-5) var(--space-6);
  border-top: 1px solid var(--line);
  flex-wrap: wrap;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: var(--space-8);
  transform: translate(-50%, 16px);
  background: var(--ink);
  color: var(--bg);
  padding: var(--space-4) var(--space-7);
  border-radius: var(--radius-full);
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  box-shadow: var(--shadow-lg);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  z-index: 60;
  max-width: 92vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--bad); color: #fff; }

/* Пока идёт тяжёлый расчёт.
   Сборка недели и подгонка под бюджет считаются в том же потоке, что рисует
   страницу: на телефоне это до нескольких секунд, в которые ничего не нажимается.
   Молчать об этом нельзя — со стороны выглядит как зависшее приложение. */
.busy, .busy .btn { cursor: progress; }
.busy .btn { opacity: 0.6; pointer-events: none; }

/* ================= аккаунт ================= */

/* Код приглашения диктуют голосом и переписывают с чужого экрана,
   поэтому он крупный, моноширинный и с разрядкой между знаками. */
.invite-code {
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size: clamp(1.4rem, 6vw, 2rem);
  font-weight: var(--weight-bold);
  letter-spacing: 0.18em;
  text-align: center;
  padding: var(--space-5) var(--space-4);
  margin: var(--space-4) 0;
  background: var(--surface-2);
  border: 1px dashed var(--line);
  border-radius: var(--radius-md);
  color: var(--accent);
  user-select: all;                 /* одно нажатие выделяет код целиком */
  word-break: break-all;
}

/* Сообщение под полями входа: ответ на действие, а не украшение,
   поэтому стоит там, где взгляд уже находится. */
.notice {
  margin: var(--space-3) 0 0;
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  font-size: var(--text-sm);
}
.notice.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }

.sep {
  border: 0;
  border-top: 1px solid var(--line);
  margin: var(--space-6) 0 var(--space-5);
}

/* ================= выбор расположения экранов ================= */

.layout-pick { display: grid; gap: var(--space-3); }

.layout-option {
  display: grid;
  gap: 2px;
  text-align: left;
  padding: var(--space-4) var(--space-5);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: inherit;
  cursor: pointer;
  font: inherit;
}
.layout-option:hover { border-color: var(--accent); }
.layout-option.active { border-color: var(--accent); background: var(--surface-2); }
.layout-name { font-weight: var(--weight-bold); }
.layout-short { font-size: var(--text-sm); }
.layout-why { font-size: var(--text-sm); color: var(--muted); }

/* ================= календарь ================= */

/* Кружочки едоков. Переключают взгляд, а не меню: готовится одна кастрюля. */
.eaters {
  display: flex;
  gap: var(--space-4);
  overflow-x: auto;
  padding: var(--space-2) 0 var(--space-4);
}
.eater {
  display: grid;
  justify-items: center;
  gap: 4px;
  border: 0;
  background: none;
  color: inherit;
  cursor: pointer;
  font: inherit;
  flex: 0 0 auto;
  opacity: 0.55;
  transition: opacity var(--dur) var(--ease);
}
.eater.active { opacity: 1; }
.eater-face {
  width: 46px; height: 46px;
  display: grid; place-items: center;
  border-radius: var(--radius-full);
  background: var(--surface-2);
  border: 2px solid transparent;
  font-size: 1.15rem;
  font-weight: var(--weight-bold);
}
.eater.active .eater-face { border-color: var(--accent); background: var(--surface); }
.eater-name { font-size: var(--text-sm); white-space: nowrap; }

.cal-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
.cal-title { margin: 0; font-size: var(--text-lg); }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin: var(--space-4) 0;
}
.cal-wd {
  text-align: center;
  font-size: var(--text-sm);
  color: var(--muted);
  padding-bottom: 2px;
}

   телефонах фиксированная высота либо режет содержимое, либо оставляет дыры. */
.cal-cell {
  aspect-ratio: 1 / 1.15;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: 3px 2px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);

  color: inherit;
  font: inherit;
  cursor: pointer;
  overflow: hidden;
  min-width: 0;
}
.cal-cell.empty { border: 0; background: none; cursor: default; }
.cal-cell.blank { opacity: 0.45; border-style: dashed; }
.cal-cell.today { border-color: var(--accent); border-width: 2px; }
.cal-cell.open { background: var(--surface-2); border-color: var(--accent); }
.cal-cell.shop { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }

.cal-num { font-weight: var(--weight-bold); font-size: var(--text-sm); line-height: 1.1; }
.cal-shop { font-size: 0.62rem; color: var(--accent); font-weight: var(--weight-bold); line-height: 1; }
.cal-meals { display: flex; gap: 1px; font-size: 0.62rem; line-height: 1; }
.cal-kcal { font-size: 0.58rem; color: var(--muted); line-height: 1; margin-top: auto; }

.cal-legend {

.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.dot.today { border: 2px solid var(--accent); }
.dot.blank { border: 1px dashed var(--line); }

.meal-row { border-bottom: 1px solid var(--line); }
.meal-row:last-of-type { border-bottom: 0; }

.meal-head {

@media (max-width: 380px) {

@media print {

   Список покупок открывают в магазине с телефона, а пальцем в кнопку

@media (pointer: coarse) {

  .tab { padding: var(--space-5) var(--space-6); }
  .check { width: 24px; height: 24px; }
  .input { padding: var(--space-5); font-size: 16px; } /* 16px — иначе iOS зумит страницу при фокусе */

  .recipe-grid { grid-template-columns: minmax(0, 1fr) 74px 74px 28px; column-gap: var(--space-3); }

/* Диетические режимы.
 *
 * ГРАНИЦА ОТВЕТСТВЕННОСТИ. Это фильтр продуктов и способов готовки, а не
 * лечение и не назначение. Гастрит бывает с повышенной и пониженной
 * кислотностью, эрозивный, связанный с H. pylori — рекомендации при них
 * расходятся, и подбирает их врач. Приложение убирает из меню то, что
 * раздражает желудок при любой форме, и не более того.
 *
 * Ограничения хранятся у человека, но действуют на общее блюдо: готовим одну
 * кастрюлю, поэтому если гастрит у одного из двоих, щадящим становится общий
 * обед. Иначе пришлось бы готовить дважды.
 *
 * Схема режима:
 *   id       — код
 *   n        — название
 *   short    — одной строкой, что режим делает
 *   why      — на чём основано ограничение
 *   avoid    — метки продуктов, которые исключаются всегда
 *   avoidRaw — метки, запрещённые только без тепловой обработки: варёная
 *              капуста в щах и сырая в салате — разная нагрузка на желудок
 *   limit    — метки, которые не запрещены, но не должны попадать часто
 *   methods  — запрещённые способы готовки
 *   note     — что важно знать человеку
 */
(function () {

  const DIETS = [

      avoid: ['spicy', 'smoked', 'fatty', 'caffeine'],

      avoid: ['gluten'],
      limit: [],

            'смотрите на упаковку.'

      id: 'vegetarian',
      n: 'Вегетарианство',
      short: 'Без мяса и рыбы',
      why: 'Личный выбор, а не медицинское ограничение.',
      avoid: ['meat', 'fish'],
      limit: [],

      note: 'Следите за белком: приложение доберёт его из творога, яиц, бобовых и протеина, ' +
            'но норма может выйти дороже.'
    }
  ];

  const BY_ID = {};
  DIETS.forEach(d => { BY_ID[d.id] = d; });

  /* Что запрещено человеку с этим набором режимов: объединение всех запретов. */
  function restrictionsFor(dietIds) {
    const avoid = {}, avoidRaw = {}, limit = {}, methods = {};
    (dietIds || []).forEach(function (id) {
      const d = BY_ID[id];
      if (!d) return;
      d.avoid.forEach(t => { avoid[t] = true; });
      (d.avoidRaw || []).forEach(t => { avoidRaw[t] = true; });
      d.limit.forEach(t => { limit[t] = true; });
      d.methods.forEach(m => { methods[m] = true; });
    });
    return { avoid: avoid, avoidRaw: avoidRaw, limit: limit, methods: methods };
  }

  window.App = window.App || {};
  window.App.DIETS = DIETS;
  window.App.dietById = BY_ID;
  window.App.restrictionsFor = restrictionsFor;
})();

/* Расчёт норм питания и КБЖУ блюд. */
(function () {
  'use strict';

  const ACTIVITY = {
    1.2:   'Сидячий образ жизни, спорта нет',
    1.375: 'Лёгкая активность, 1-3 тренировки в неделю',
    1.55:  'Средняя активность, 3-5 тренировок',
    1.725: 'Высокая активность, 6-7 тренировок',
    1.9:   'Тяжёлый физический труд'
  };

  const GOALS = {
    cut:      { n: 'Снижение веса', kcalMul: 0.80 },
    maintain: { n: 'Поддержание',   kcalMul: 1.00 },
    bulk:     { n: 'Набор массы',   kcalMul: 1.12 }
  };

  /* Белок, г на кг массы тела. Зависит и от цели, и от нагрузки: чем тяжелее
     работа или тренировки, тем больше белка нужно на восстановление, а на
     дефиците калорий он ещё и защищает мышцы от распада. Диапазон 1,2–2,4
     соответствует позиции ISSN и ACSM: 1,4–2,0 г/кг для физически активных
     и до ~2,4 г/кг при похудении с сохранением мышц. */
  const PROTEIN_PER_KG = {
    '1.2':   { cut: 1.6, maintain: 1.2, bulk: 1.6 },
    '1.375': { cut: 1.8, maintain: 1.5, bulk: 1.7 },
    '1.55':  { cut: 2.0, maintain: 1.6, bulk: 1.8 },
    '1.725': { cut: 2.2, maintain: 1.8, bulk: 2.0 },
    '1.9':   { cut: 2.4, maintain: 2.0, bulk: 2.2 }
  };

  /* Жиры: ниже 0,8 г/кг падает синтез гормонов и усвоение жирорастворимых
     витаминов, поэтому это пол, а не цель. */
  const FAT_PER_KG = { cut: 0.9, maintain: 1.0, bulk: 1.0 };
  const FAT_FLOOR_PER_KG = 0.8;

  // Белок дороже всех макронутриентов, поэтому ограничиваем его сверху:
  // выше трети рациона он не даёт пользы, а бюджет ломает.
  const PROTEIN_MAX_KCAL_SHARE = 0.35;

  /* Активность в профиле хранится числом; берём ближайшую ступень таблицы,
     чтобы произвольное значение не обрушило расчёт. */
  function nearestActivity(value) {
    const keys = Object.keys(PROTEIN_PER_KG);
    return keys.reduce(function (best, key) {
      return Math.abs(key - value) < Math.abs(best - value) ? key : best;
    }, keys[0]);
  }

  function proteinPerKg(person) {
    const goal = GOALS[person.goal] ? person.goal : 'maintain';
    return PROTEIN_PER_KG[nearestActivity(person.activity)][goal];
  }

  function fatPerKg(person) {
    return FAT_PER_KG[person.goal] || FAT_PER_KG.maintain;
  }

  /* Базовый обмен по формуле Mifflin-St Jeor — она даёт наименьшую ошибку
     на людях без экстремального состава тела. */
  function bmr(person) {
    const base = 10 * person.weight + 6.25 * person.height - 5 * person.age;
    return person.sex === 'm' ? base + 5 : base - 161;
  }

  /* Суточная норма одного человека. Ручной ввод (person.manual) всегда
     побеждает расчёт — пользователь может знать свои цифры точнее формулы. */
  function personTargets(person) {
    if (person.manual && person.manual.kcal > 0) {
      const m = person.manual;
      return { kcal: m.kcal, p: m.p, f: m.f, c: m.c, manual: true };
    }
    const goal = GOALS[person.goal] || GOALS.maintain;
    const kcal = Math.round(bmr(person) * person.activity * goal.kcalMul);

    const usedProtPerKg = person.protPerKg || proteinPerKg(person);
    const usedFatPerKg = Math.max(FAT_FLOOR_PER_KG, person.fatPerKg || fatPerKg(person));

    let p = Math.round(person.weight * usedProtPerKg);
    const f = Math.round(person.weight * usedFatPerKg);

    // Потолок по белку: у людей с большим весом расчёт «на кг» иначе уводит
    // в 250 г белка, которые и не нужны, и стоят как половина бюджета.
    const pCap = Math.round(kcal * PROTEIN_MAX_KCAL_SHARE / 4);
    if (p > pCap) p = pCap;

    // Углеводы — то, что осталось после белка и жира.
    let c = Math.round((kcal - p * 4 - f * 9) / 4);
    if (c < 50) c = 50; // ниже этого рацион перестаёт быть выполнимым

    return {
      kcal, p, f, c, manual: false,
      protPerKg: Math.round(usedProtPerKg * 100) / 100,
      fatPerKg: Math.round(usedFatPerKg * 100) / 100,
      protCapped: p === pCap
    };
  }

  /* Суммарная суточная норма всех едоков. */
  function householdTargets(people) {
    return people.reduce((acc, person) => {
      const t = personTargets(person);
      acc.kcal += t.kcal; acc.p += t.p; acc.f += t.f; acc.c += t.c;
      return acc;
    }, { kcal: 0, p: 0, f: 0, c: 0 });
  }

  /* КБЖУ произвольного набора ингредиентов [{p, g}] с учётом отхода при чистке:
     в тарелку попадает не весь купленный вес. */
  function nutritionOf(ingredients, productsById) {
    const out = { kcal: 0, p: 0, f: 0, c: 0 };
    ingredients.forEach(function (i) {
      const prod = productsById[i.p];
      if (!prod) return;
      const edible = i.g * (1 - (prod.wst || 0));
      const k = edible / 100;
      out.kcal += prod.k * k;
      out.p += prod.p * k;
      out.f += prod.f * k;
      out.c += prod.c * k;
    });
    out.kcal = Math.round(out.kcal);
    out.p = Math.round(out.p * 10) / 10;
    out.f = Math.round(out.f * 10) / 10;
    out.c = Math.round(out.c * 10) / 10;
    return out;
  }

  function recipeNutrition(recipe, productsById) {
    const total = nutritionOf(recipe.ing, productsById);
    const sv = recipe.sv || 1;
    return {
      total: total,
      perServing: {
        kcal: Math.round(total.kcal / sv),
        p: Math.round(total.p / sv * 10) / 10,
        f: Math.round(total.f / sv * 10) / 10,
        c: Math.round(total.c / sv * 10) / 10
      }
    };
  }

  /* Насколько факт разошёлся с планом, в процентах со знаком. */
  function deviation(actual, target) {
    if (!target) return 0;
    return Math.round((actual - target) / target * 100);
  }

  window.App = window.App || {};
  window.App.nutrition = {
    ACTIVITY: ACTIVITY,
    GOALS: GOALS,
    PROTEIN_PER_KG: PROTEIN_PER_KG,
    proteinPerKg: proteinPerKg,
    fatPerKg: fatPerKg,
    bmr: bmr,
    personTargets: personTargets,
    householdTargets: householdTargets,
    nutritionOf: nutritionOf,
    recipeNutrition: recipeNutrition,
    deviation: deviation
  };
})();

/* ===== js/core/cloud.js ===== */
/* Разговор с Supabase напрямую, запросами.
 *
 * Официальную библиотеку тянуть не стали, и это осознанно. Она грузится
 * с чужого сервера — а у приложения ноль внешних адресов, на этом держатся
 * и правила загрузки ресурсов, и сборка версии для телефона в один файл.
 * Ради удобства пришлось бы разменять всё это. Нужного от Supabase здесь
 * немного: вход, обновление ключа доступа и несколько запросов к данным.
 *
 * Всё общение проходит через request(), и там же живёт единственная хитрость,
 * которая иначе расползлась бы по всему коду: ключ доступа живёт час,
 * а приложение открыто дольше. Поэтому истёкший ключ обновляется на месте,
 * и запрос повторяется — вызывающий об этом не знает и знать не должен.
 */
(function () {
  'use strict';

  const C = () => window.App.config;
  const SESSION_KEY = 'spendings.session';

  let session = null;          // { access_token, refresh_token, expires_at, user }
  let refreshing = null;       // общий промис обновления: параллельные запросы ждут один

  // ---------------------------------------------------------------- сессия

  function loadSession() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      session = raw ? JSON.parse(raw) : null;
    } catch (e) {
      session = null;
    }
    return session;
  }

  function saveSession(next) {
    session = next;
    try {
      if (next) localStorage.setItem(SESSION_KEY, JSON.stringify(next));
      else localStorage.removeItem(SESSION_KEY);
    } catch (e) { /* без хранилища вход проживёт до закрытия вкладки */ }
  }

  function current() {
    if (session === null) loadSession();
    return session;
  }

  function user() {
    const s = current();
    return s && s.user ? s.user : null;
  }

  function signedIn() {
    return !!user();
  }

  /* Ключ считаем истёкшим за минуту до срока: запрос, отправленный
     в последнюю секунду жизни ключа, доедет уже просроченным. */
  function expired(s) {
    return !s || !s.expires_at || (s.expires_at * 1000 - 60000) < Date.now();
  }

  function adopt(data) {
    if (!data || !data.access_token) throw new Error('сервер не прислал ключ доступа');
    saveSession({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: data.expires_at || Math.floor(Date.now() / 1000) + (data.expires_in || 3600),
      user: data.user || (session && session.user) || null
    });
    return session;
  }

  // ---------------------------------------------------------------- запросы

  function headers(extra) {
    const h = Object.assign({
      'apikey': C().anonKey,
      'Content-Type': 'application/json'
    }, extra || {});
    const s = current();
    if (s && s.access_token) h['Authorization'] = 'Bearer ' + s.access_token;
    return h;
  }

  /* Понятное сообщение вместо кода ошибки: человеку про 400 знать нечего. */
  function describe(status, body) {
    const msg = (body && (body.msg || body.message || body.error_description ||
      body.error || body.hint)) || '';
    const low = String(msg).toLowerCase();

    if (low.indexOf('invalid login') !== -1) return 'Неверная почта или пароль';
    if (low.indexOf('already registered') !== -1) return 'На эту почту уже есть аккаунт';
    if (low.indexOf('email not confirmed') !== -1) return 'Почта не подтверждена — проверьте письмо';
    if (low.indexOf('password should be') !== -1) return 'Пароль слишком короткий: нужно минимум 6 знаков';
    if (low.indexOf('код не найден') !== -1) return 'Такого кода приглашения нет';
    if (low.indexOf('не ваше хозяйство') !== -1) return 'Это хозяйство не ваше';
    if (low.indexOf('rate limit') !== -1 || status === 429) return 'Слишком много попыток — подождите минуту';
    if (status === 401 || status === 403) return 'Нужно войти заново';
    if (status >= 500) return 'Сервер не отвечает — попробуйте позже';
    return msg || ('Ошибка связи (' + status + ')');
  }

  function parse(res) {
    return res.text().then(function (text) {
      let body = null;
      if (text) { try { body = JSON.parse(text); } catch (e) { body = { message: text }; } }
      if (!res.ok) {
        const err = new Error(describe(res.status, body));
        err.status = res.status;
        err.body = body;
        throw err;
      }
      return body;
    });
  }

  function raw(path, options) {
    if (!C().configured()) return Promise.reject(new Error('Облако не настроено'));
    return fetch(C().url + path, options).then(parse);
  }

  /* Обновление ключа доступа. Параллельные запросы, наткнувшиеся на истёкший
     ключ, ждут одно обновление, а не устраивают наперегонки несколько —
     сервер на это отвечает отзывом ключа обновления, и человека выкидывает. */
  function refresh() {
    const s = current();
    if (!s || !s.refresh_token) return Promise.reject(new Error('Нужно войти заново'));
    if (refreshing) return refreshing;

    refreshing = raw('/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': C().anonKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    }).then(function (data) {
      refreshing = null;
      return adopt(data);
    }).catch(function (err) {
      refreshing = null;
      saveSession(null);            // ключ обновления мёртв — вход придётся повторить
      throw err;
    });

    return refreshing;
  }

  /* Запрос от имени вошедшего. Истёкший ключ обновляется молча. */
  function request(path, options) {
    options = options || {};
    const s = current();
    const go = () => raw(path, Object.assign({}, options, { headers: headers(options.headers) }));

    if (s && expired(s)) return refresh().then(go);
    return go().catch(function (err) {
      // Ключ мог протухнуть между проверкой и ответом сервера — тогда
      // одна попытка обновиться и повторить, но ровно одна.
      if (err.status === 401 && s && s.refresh_token) return refresh().then(go);
      throw err;
    });
  }

  // ---------------------------------------------------------------- вход

  function signUp(email, password) {
    return raw('/auth/v1/signup', {
      method: 'POST',
      headers: { 'apikey': C().anonKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: String(email).trim(), password: password })
    }).then(function (data) {
      // Если в проекте включено подтверждение почты, ключа здесь не будет:
      // сначала письмо, вход потом. Это не ошибка, и говорить надо разное.
      if (!data || !data.access_token) return { needsConfirmation: true, user: data && data.user };
      adopt(data);
      return { needsConfirmation: false, user: data.user };
    });
  }

  function signIn(email, password) {
    return raw('/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': C().anonKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: String(email).trim(), password: password })
    }).then(function (data) {
      adopt(data);
      return data.user;
    });
  }

  function signOut() {
    const s = current();
    saveSession(null);
    if (!s || !s.access_token) return Promise.resolve();
    // Отозвать ключ на сервере — вежливость, а не необходимость: локально
    // мы его уже забыли, и неудача здесь ничего не меняет.
    return raw('/auth/v1/logout', {
      method: 'POST',
      headers: { 'apikey': C().anonKey, 'Authorization': 'Bearer ' + s.access_token }
    }).catch(() => {});
  }

  function resetPassword(email) {
    return raw('/auth/v1/recover', {
      method: 'POST',
      headers: { 'apikey': C().anonKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: String(email).trim() })
    });
  }

  function changePassword(password) {
    return request('/auth/v1/user', {
      method: 'PUT',
      body: JSON.stringify({ password: password })
    });
  }

  // ---------------------------------------------------------------- данные

  function rpc(name, args) {
    return request('/rest/v1/rpc/' + name, {
      method: 'POST',
      body: JSON.stringify(args || {})
    });
  }

  function myHouseholds() {
    return rpc('my_households').then(rows => rows || []);
  }

  function createHousehold(name, state) {
    return rpc('create_household', { household_name: name || null, initial_state: state || null });
  }

  function joinHousehold(code) {
    return rpc('join_household', { code: String(code || '').trim().toUpperCase() });
  }

  function rotateInvite(id) {
    return rpc('rotate_invite_code', { hid: id });
  }

  function householdPeople(id) {
    return rpc('household_people', { hid: id }).then(rows => rows || []);
  }

  function leaveHousehold(id) {
    const u = user();
    if (!u) return Promise.reject(new Error('Нужно войти'));
    return request('/rest/v1/household_members?household_id=eq.' + encodeURIComponent(id) +
      '&user_id=eq.' + encodeURIComponent(u.id), { method: 'DELETE' });
  }

  function fetchHousehold(id) {
    return request('/rest/v1/households?id=eq.' + encodeURIComponent(id) + '&select=*', {
      method: 'GET'
    }).then(rows => (rows && rows[0]) || null);
  }

  /* Записать состояние, но только если с тех пор его никто не менял.
   *
   * Условие rev=eq.<ожидаемый> — это и есть защита от затирания чужой работы:
   * если другое устройство успело записаться раньше, номер версии уже другой,
   * под условие не попадает ни одна строка, и сервер возвращает пустой список.
   * Тогда отдаём наверх признак расхождения, а решает человек. */
  function saveState(id, state, baseRev) {
    return request('/rest/v1/households?id=eq.' + encodeURIComponent(id) +
      '&rev=eq.' + encodeURIComponent(baseRev) + '&select=*', {
      method: 'PATCH',
      headers: { 'Prefer': 'return=representation' },
      body: JSON.stringify({ state: state })
    }).then(function (rows) {
      if (rows && rows.length) return { ok: true, row: rows[0] };
      return fetchHousehold(id).then(row => ({ ok: false, conflict: true, row: row }));
    });
  }

  window.App = window.App || {};
  window.App.cloud = {
    signUp, signIn, signOut, resetPassword, changePassword,
    user, signedIn, current, refresh,
    myHouseholds, createHousehold, joinHousehold, leaveHousehold,
    rotateInvite, householdPeople, fetchHousehold, saveState,
    available: () => C().configured()
  };
})();

/* ===== js/core/sync.js ===== */
/* Общая база между телефоном и компьютером.
 *
 * Порядок намеренно «сначала локально»: приложение всегда читает и пишет
 * в браузер, поэтому открывается мгновенно и не ломается в магазине, где связи
 * нет. Сервер подтягивается следом и, если доступен, становится общей правдой
 * для обоих устройств.
 *
 * Чужие правки не затираются молча: у базы есть номер версии, и если её успели
 * изменить с другого устройства, сервер возвращает конфликт, а решение
 * принимает человек.
 */
(function () {
  'use strict';

  const URL = 'api/state';
  const PUSH_DELAY = 700;      // мс тишины перед отправкой — не слать запрос на каждое нажатие

  let available = false;       // отвечает ли сервер
  let baseRev = null;          // версия, от которой отталкиваемся
  let pushTimer = null;
  let pending = false;         // есть неотправленные изменения
  let conflict = false;
  const listeners = [];

  function status() {
    return { available: available, pending: pending, conflict: conflict, rev: baseRev };
  }

  function notify() {
    listeners.forEach(fn => { try { fn(status()); } catch (e) { console.warn(e); } });
  }

  function onChange(fn) { listeners.push(fn); }

  function setAvailable(value) {
    if (available === value) return;
    available = value;
    notify();
  }

  function request(method, body) {
    if (typeof fetch !== 'function') return Promise.reject(new Error('нет fetch'));
    return fetch(URL, {
      method: method,
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      cache: 'no-store'
    });
  }

  /* Забрать общую базу. Отдаёт состояние, только если на сервере есть что-то,
     чего мы ещё не видели. */
  function pull() {
    return request('GET').then(function (res) {
      if (!res.ok) throw new Error('сервер ответил ' + res.status);
      return res.json();
    }).then(function (data) {
      setAvailable(true);
      if (!data || !data.state) {
        // База пуста — первое устройство наполнит её своим состоянием.
        baseRev = data ? data.rev : 0;
        return null;
      }
      if (baseRev !== null && data.rev === baseRev) return null;   // ничего не менялось
      baseRev = data.rev;
      return data.state;
    }).catch(function () {
      setAvailable(false);
      return null;
    });
  }

  /* Отправить состояние пачкой, с задержкой. */
  function push(getState) {
    pending = true;
    notify();
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () { flush(getState); }, PUSH_DELAY);
  }

  function flush(getState, force) {
    return request('PUT', { baseRev: baseRev, state: getState(), force: !!force })
      .then(function (res) {
        if (res.status === 409) {
          // На сервере уже чужая версия. Молча затирать нельзя.
          conflict = true;
          pending = true;
          setAvailable(true);
          notify();
          return res.json().then(theirs => ({ conflict: true, state: theirs.state, rev: theirs.rev }));
        }
        if (!res.ok) throw new Error('сервер ответил ' + res.status);
        return res.json().then(function (data) {
          baseRev = data.rev;
          pending = false;
          conflict = false;
          setAvailable(true);
          notify();
          return { conflict: false };
        });
      })
      .catch(function () {
        // Связи нет — изменения остаются в браузере и уедут при следующей попытке.
        setAvailable(false);
        return { offline: true };
      });
  }

  /* Записать своё поверх серверного — одна из двух развязок конфликта. */
  function overwrite(getState) { return flush(getState, true); }

  /* Принять серверное как своё — вторая развязка. */
  function acceptRemote(rev) {
    baseRev = rev;
    conflict = false;
    pending = false;
    notify();
  }

  window.App = window.App || {};
  window.App.sync = { pull, push, flush, overwrite, acceptRemote, status, onChange };
})();

/* ===== js/core/store.js ===== */
/* Состояние приложения: настройки, профили, кладовая, цены, планы.
 * Всё хранится локально в браузере. Никаких серверов и аккаунтов. */
(function () {
  'use strict';

  const KEY = 'spendings.v1';

  /* Дата в виде ГГГГ-ММ-ДД по местному календарю.
   *
   * Через toISOString() так делать нельзя, хотя соблазнительно коротко:
   * он переводит время в UTC, а Россия вся к востоку от него. Полночь 27-го
   * в Москве — это 26-е 21:00 по UTC, поэтому toISOString отдавал вчерашний
   * день. В журнале цен это ставило чекам вчерашнюю дату каждую ночь
   * до трёх часов, а в плане недели расходилось с названием дня:
   * строка «Четверг» несла в себе дату среды. */
  function localDate(date) {
    const d = date || new Date();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function today() {
    return localDate();
  }

  function defaultPerson(id, name, sex) {
    return {
      id: id, name: name, sex: sex,
      age: 30, height: 175, weight: 75,
      activity: 1.375, goal: 'maintain',
      protPerKg: null, fatPerKg: null,
      manual: null,
      // Набор приёмов пищи у каждого свой: одному перекусы нужны, другому нет.
      meals: ['breakfast', 'lunch', 'dinner'],
      // Диетические режимы: гастрит, непереносимости и прочее.
      diets: [],
      needsSetup: true
    };
  }

  function defaultState() {
    return {
      v: 1,
      settings: {
        budget: 15000,
        period: 'month',          // 'month' | 'week'
        weeksInMonth: 4.3,        // 30.4 дня / 7
        outsideFood: 0,           // еда вне дома за период, ₽
        mealsActive: ['breakfast', 'lunch', 'dinner'],
        batchTwoDays: true,       // супы и рагу растягиваем на 2 дня
        maxRepeat: 2,             // сколько раз одно блюдо может встретиться за неделю
        overspend: 0,             // допустимое превышение бюджета, доля (0 = жёсткий потолок)
        priceStaleDays: 30,
        proteinFloor: 0.9,        // белок не опускаем ниже 90% нормы даже ради бюджета
        kcalTolerance: 0.07,      // допустимый разброс калорий по дню
        startDay: today()
      },
      people: [
        defaultPerson('p1', 'Профиль 1', 'm'),
        defaultPerson('p2', 'Профиль 2', 'f')
      ],
      // Регулярные покупки вне меню: кофе, специи, бытовая химия.
      regulars: [
        { p: 'coffee', qty: 1, per: 'month' },
        { p: 'tea', qty: 1, per: 'month' },
        { p: 'salt', qty: 1, per: 'month' },
        { p: 'spices_mix', qty: 1, per: 'month' },
        { p: 'dish_soap', qty: 1, per: 'month' },
        { p: 'laundry', qty: 1, per: 'month' },
        { p: 'toilet_paper', qty: 1, per: 'month' },
        { p: 'trash_bags', qty: 1, per: 'month' },
        { p: 'shampoo', qty: 1, per: 'month' },
        { p: 'soap', qty: 1, per: 'month' },
        { p: 'toothpaste', qty: 1, per: 'month' },
        { p: 'sponges', qty: 1, per: 'month' }
      ],
      pantry: {},          // { productId: количество в базовых единицах }
      excluded: {},        // { productId: true } — не предлагать этот продукт
      prices: {},          // устаревшее: цены до появления журнала, переносятся при загрузке

      /* Журнал цен — единственный источник правды о том, сколько что стоит.
         Одна запись = «в такой-то день в таком-то магазине такая-то марка
         столько-то стоила». Из него выводятся и текущая цена для расчётов,
         и графики. Марка и упаковка хранятся в записи, потому что творог
         Простоквашино 200 г и Домик в деревне 180 г — это разные цены
         за килограмм, и без этого сравнение врёт. */
      priceLog: [],        // [{d, p, brand, store, pr, pack}]
      brandChoice: {},     // {productId: марка} — какую брать в расчёт; по умолчанию самая дешёвая
      // Замены, которые человек отклонил: предлагать их снова — навязчиво.
      dismissedSwaps: {},  // {'откуда>куда': true}
      stores: ['Пятёрочка', 'Магнит'],
      customProducts: [],
      customRecipes: [],
      disabledRecipes: {},
      plan: null,          // текущая неделя
      weeks: {},           // прочие недели: { 'ГГГГ-ММ-ДД начала': план } — для месячного календаря
      // Когда продукт попал в кладовую. Нужно, чтобы считать срок годности:
      // у каждого продукта в каталоге есть поле life, а точки отсчёта не было.
      pantryDates: {},     // { productId: 'ГГГГ-ММ-ДД' }
      listState: {},       // отметки «куплено» в списке покупок
      history: []
    };
  }

  let state = null;
  // Растёт при каждой записи. По нему кеши понимают, что состояние изменилось,
  // даже если сумма плана осталась прежней — например, поменялась кладовая.
  let revision = 0;

  /* Умеет ли браузер вообще что-то запомнить.
   *
   * Проверять надо записью, а не наличием localStorage: объект есть почти
   * везде, а работает он не везде. Файл, открытый прямо из мессенджера,
   * попадает в браузер по адресу content:// или file://, и для таких страниц
   * браузер хранилища не даёт — либо запрещает запись, либо стирает её при
   * закрытии вкладки. То же самое в режиме инкогнито при переполнении.
   *
   * Промолчать здесь нельзя. Приложение выглядело бы полностью рабочим:
   * неделя собирается, цены правятся, кладовая заполняется — а после
   * закрытия вкладки от всего этого не остаётся ничего, и человек узнаёт
   * об этом, потратив вечер. */
  let storageOk = null;

  function storageAvailable() {
    if (storageOk !== null) return storageOk;
    try {
      const probe = KEY + '.probe';
      localStorage.setItem(probe, '1');
      storageOk = localStorage.getItem(probe) === '1';
      localStorage.removeItem(probe);
    } catch (e) {
      storageOk = false;
    }
    return storageOk;
  }

  function load() {
    invalidate();
    try {
      const raw = localStorage.getItem(KEY);
      state = raw ? migrate(JSON.parse(raw)) : defaultState();
    } catch (e) {
      console.warn('Не удалось прочитать сохранённые данные, начинаем заново', e);
      state = defaultState();
    }
    return state;
  }

  /* Приведение чужих данных к ожидаемому виду.
   *
   * Через migrate проходит всё, что приложение не писало само: сохранение из
   * localStorage, файл выгрузки, состояние из общей базы. Верить их форме
   * нельзя. Раньше и не проверялось: достаточно было, чтобы в файле нашлось
   * поле settings, — а дальше, если priceLog оказывался строкой вместо
   * массива, приложение падало на первой же отрисовке. Причём падало
   * НАВСЕГДА: битое состояние успевало записаться в localStorage и переживало
   * перезагрузку, так что выхода не оставалось, кроме как стереть хранилище
   * браузера вместе со всеми ценами и планами.
   *
   * Дойти до этого проще, чем кажется: файл выгрузки обрезается при неудачной
   * пересылке или синхронизации облака, и обрезанный он ломает всё. Поэтому
   * поле неверного типа не отвергается, а заменяется пустым значением нужного
   * вида: лучше потерять одно поле, чем всё приложение. */
  function asArray(value, fallback) {
    return Array.isArray(value) ? value : fallback;
  }

  function asObject(value, fallback) {
    return value && typeof value === 'object' && !Array.isArray(value) ? value : fallback;
  }

  /* Список, в котором каждый элемент — объект с нужными полями.
   *
   * Проверить сам список мало: Array.isArray([null]) — правда, а первое же
   * обращение к полю внутри падает. Одна такая запись в журнале цен валила
   * весь каталог, потому что каталог обходит журнал целиком.
   *
   * Негодные записи выбрасываются молча и поодиночке: файл выгрузки — это
   * годы правок цен, и терять их все из-за одной битой строки нельзя. */
  function asRecords(value, required) {
    return asArray(value, []).filter(function (item) {
      if (!asObject(item, null)) return false;
      return required.every(k => item[k] !== undefined && item[k] !== null);
    });
  }

  /* Кладовая и ей подобные: ключ — код продукта, значение обязано быть числом.
     Строка «много» вместо количества ломает всю арифметику ниже по течению. */
  function asNumberMap(value) {
    const src = asObject(value, {});
    const out = {};
    Object.keys(src).forEach(function (k) {
      const n = Number(src[k]);
      if (isFinite(n) && n > 0) out[k] = n;
    });
    return out;
  }

  /* Проверка плана недели.
   *
   * План — самая развесистая структура в состоянии: семь дней, в каждом
   * приёмы пищи, в каждом рецепт со списком ингредиентов. Обходят её десятки
   * мест, и почти все — без оглядки, потому что план всегда строило само
   * приложение. Но приходит он из хранилища и из файла выгрузки, а туда
   * попадает всякое: обрезанная при пересылке копия, сохранение от версии
   * с другой формой данных.
   *
   * Чиним посильное, отбрасываем безнадёжное. Приём пищи с рассыпавшимся
   * рецептом становится пустым — такое приложение переживает, оно умеет
