      day.nutrition = N().nutritionOf(scaled, byId);
      week.kcal += day.nutrition.kcal;
      week.p += day.nutrition.p;
      week.f += day.nutrition.f;
      week.c += day.nutrition.c;
    });
    plan.nutrition = {
      week: {
        kcal: Math.round(week.kcal), p: Math.round(week.p),
        f: Math.round(week.f), c: Math.round(week.c)
      },
      avgDay: {
        kcal: Math.round(week.kcal / 7), p: Math.round(week.p / 7),
        f: Math.round(week.f / 7), c: Math.round(week.c / 7)
      }
    };
  }

  function buildSkeleton(settings, people, startDay) {
    const daily = N().householdTargets(people);
    const targets = slotTargets(people);
    // Порядок приёмов пищи — как в течение дня, а не как пришлось в объекте.
    const slots = Object.keys(window.App.MEALS).filter(s => targets[s]);
    // Дата начала может прийти извне: месячный календарь собирает несколько
    // недель подряд, и каждой нужна своя, а не одна из настроек.
    const start = new Date((startDay || settings.startDay || S().today()) + 'T00:00:00');

    const days = [];
    for (let d = 0; d < 7; d++) {
      // Прибавляем календарный день, а не 24 часа: при переходе на летнее
      // время сутки длятся 23 или 25 часов, и арифметика по миллисекундам
      // рано или поздно промахивается мимо полуночи.
      const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + d);
      days.push({
        date: S().localDate(date),
        name: DAY_NAMES[(date.getDay() + 6) % 7],
        meals: slots.map(slot => ({ slot: slot, recipe: null, mult: 1, buy: 1, leftoverOf: null }))
      });
    }

    return {
      createdAt: new Date().toISOString(),
      slotTargets: targets,
      slots: slots,
      targets: {
        daily: daily,
        week: { kcal: daily.kcal * 7, p: daily.p * 7, f: daily.f * 7, c: daily.c * 7 }
      },
      days: days,
      swaps: [],
      replacements: [],
      notes: []
    };
  }

  /* Рабочий контекст подбора: каталог, доступные рецепты, виртуальная кладовая
     (она пустеет по мере того, как блюда её «съедают») и счётчик повторов. */
  function makeCtx() {
    const state = S().get();
    const byId = S().productsById();
    const recipes = S().recipes();

    // КБЖУ всех доступных рецептов — один раз на весь расчёт. Дальше подбор
    // блюд обращается сюда, а не пересчитывает состав заново на каждый вопрос.
    const nut = new Map();
    recipes.forEach(r => { nut.set(r, N().recipeNutrition(r, byId)); });

    return {
      byId: byId,
      recipes: recipes,
      nut: nut,
      pantry: Object.assign({}, state.pantry),
      committed: {},                       // что уже оплачено упаковками и сколько из этого съедено
      slotTargets: slotTargets(state.people),
      usage: {},
      lastBySlot: {},
      settings: state.settings,
      proteinDeficit: false
    };
  }

  /* Слот мог опустеть после отмены блюда «на два дня». Пустая ячейка в меню —
     это молчаливо пропущенный приём пищи, поэтому дозаполняем всегда. */
  function refillEmpty(plan, ctx, byId) {
    let filled = 0;
    // Дозаполнение идёт после замен, а замены ставят блюда мимо счётчика
    // подбора. Не сверившись с меню, дозаполнение поставило бы третий раз
    // то, что уже стоит дважды, — по своим устаревшим данным.
    ctx.usage = usageInPlan(plan);
    plan.days.forEach(function (day) {
      day.meals.forEach(function (meal) {
        if (meal.recipe) return;
        const recipe = pickRecipe(meal.slot, ctx, usedOnDay(day));
        if (!recipe) return;
        meal.recipe = clone(recipe);
        meal.leftoverOf = null;
        ctx.usage[recipe.id] = (ctx.usage[recipe.id] || 0) + 1;
        commitRecipe(recipe, byId, ctx, estimateMult(recipe, byId, ctx, meal.slot));
        filled++;
      });
    });
    if (filled) rebalance(plan, byId);
    return filled;
  }

  function generate(opts) {
    const state = S().get();
    const settings = state.settings;
    const ctx = makeCtx();
    const byId = ctx.byId;
    // Режим экономии: цена перевешивает разнообразие, а состав макронутриентов
    // сдвигается к дешёвым калориям. Включается только жёсткой подгонкой.
    ctx.costFocus = !!(opts && opts.costFocus);

    const plan = buildSkeleton(settings, state.people, opts && opts.startDay);

    plan.days.forEach(function (day, di) {
      day.meals.forEach(function (meal) {
        // День уже занят вчерашней готовкой — ничего не выбираем.
        if (meal.recipe) return;

        const recipe = pickRecipe(meal.slot, ctx, usedOnDay(day));
        if (!recipe) return;

        const mult = estimateMult(recipe, byId, ctx, meal.slot);
        meal.recipe = clone(recipe);
        ctx.usage[recipe.id] = (ctx.usage[recipe.id] || 0) + 1;
        ctx.lastBySlot[meal.slot] = recipe.id;
        commitRecipe(recipe, byId, ctx, mult);

        // Суп или рагу логично съесть за два дня — так дешевле и меньше готовки.
        if (settings.batchTwoDays && recipe.batch && plan.days[di + 1]) {
          const twin = plan.days[di + 1].meals.find(m => m.slot === meal.slot && !m.recipe);
          if (twin) {
            twin.recipe = clone(recipe);
            twin.leftoverOf = di;
            ctx.usage[recipe.id] = (ctx.usage[recipe.id] || 0) + 1;
            commitRecipe(recipe, byId, ctx, mult); // второй день закупается тем же заходом
          }
        }
      });
    });

    rebalance(plan, byId);
    refillEmpty(plan, ctx, byId);
    fixProtein(plan, byId, ctx);
    tuneMacros(plan, byId);
    if (ctx.costFocus) tuneForCost(plan, byId, settings.proteinFloor);
    fitToBudget(plan, byId, ctx);
    return plan;
  }

  /* Обменять белок на углеводы при тех же калориях.
   *
   * Само по себе снижение порога белка почти ничего не даёт: порог — это
   * запрет, а не цель, и планировщик всё равно набирает 100% нормы. Экономия
   * появляется, только если рацион сознательно сдвинуть к дешёвым калориям:
   * грамм белка из мяса стоит в разы дороже грамма углеводов из крупы.
   * Опускаемся ровно до разрешённой границы и ни граммом ниже. */
  function tuneForCost(plan, byId, floorRatio) {
    for (let step = 0; step < 10; step++) {
      const w = plan.nutrition.week, t = plan.targets.week;
      if (w.p <= t.p * (floorRatio + 0.02)) return;

      const snap = snapshot(plan);
      plan.days.forEach(function (day) {
        day.meals.forEach(function (meal) {
          if (!meal.recipe) return;
          meal.recipe.ing.forEach(function (i) {
            const p = byId[i.p];
            if (!p) return;
            if (p.role === 'protein' && i.g > 20) i.g = Math.round(i.g * 0.92);
            else if (p.role === 'carb') i.g = Math.round(i.g * 1.06);
          });
        });
      });
      rebalance(plan, byId);

      if (plan.nutrition.week.p < t.p * floorRatio) {
        restore(plan, snap);
        rebalance(plan, byId);
        return;
      }
    }
  }

  /* Калории после rebalance всегда попадают в цель, а вот их состав — нет:
     набор блюд может дать перекос в жиры при нехватке углеводов. Здесь мы
     двигаем пропорции внутри блюд (больше крупы, меньше масла), не трогая
     ни калорийность, ни белок. */
  function macroError(plan) {
    const w = plan.nutrition.week, t = plan.targets.week;
    return Math.abs(w.c / t.c - 1) + Math.abs(w.f / t.f - 1);
  }

  function tuneMacros(plan, byId) {
    const floor = S().get().settings.proteinFloor;

    for (let step = 0; step < 8; step++) {
      const w = plan.nutrition.week, t = plan.targets.week;
      const errorBefore = macroError(plan);
      if (errorBefore < 0.10) return;           // уже достаточно ровно

      const carbLow = w.c < t.c;
      const fatHigh = w.f > t.f;
      if (!carbLow && !fatHigh) return;

      const snap = snapshot(plan);
      const proteinBefore = w.p;

      // Шаг намеренно мелкий: крупный проскакивает цель и загоняет перекос
      // в противоположную сторону.
      plan.days.forEach(function (day) {
        day.meals.forEach(function (meal) {
          if (!meal.recipe) return;
          meal.recipe.ing.forEach(function (i) {
            const p = byId[i.p];
            if (!p) return;
            if (carbLow && p.role === 'carb') i.g = Math.round(i.g * 1.07);
            // Масло ниже 8 г на блюдо не опускаем — на таком не пожаришь.
            if (fatHigh && p.role === 'fat' && i.g > 8) i.g = Math.max(8, Math.round(i.g * 0.94));
          });
        });
      });
      rebalance(plan, byId);

      const proteinAfter = plan.nutrition.week.p;
      // Белком за баланс не платим. Сравниваем с тем, что было до шага, а не
      // просто с порогом: если белок и так лежал на границе, шаг, который его
      // не ухудшил, откатывать не за что.
      const proteinLost = proteinAfter < t.p * floor && proteinAfter < proteinBefore;

      if (proteinLost || macroError(plan) >= errorBefore) {
        restore(plan, snap);
        rebalance(plan, byId);
        return;
      }
    }
  }

  /* Если по неделе не добираем белок — меняем самые «пустые» блюда на белковые. */
  function fixProtein(plan, byId, ctx) {
    const settings = S().get().settings;
    // Целимся чуть выше жёсткой границы: она нужна оптимизатору как «ниже нельзя»,
    // а сборке меню — как «хорошо бы с запасом».
    const aim = Math.min(1, settings.proteinFloor + 0.05);
    let guard = 0;
    while (plan.nutrition.week.p < plan.targets.week.p * aim && guard++ < 10) {
      const meals = allMeals(plan).filter(m => m.recipe && m.leftoverOf == null);
      if (!meals.length) break;

      meals.sort(function (a, b) {
        const da = a.nutrition.p / Math.max(1, a.nutrition.kcal);
        const db = b.nutrition.p / Math.max(1, b.nutrition.kcal);
        return da - db;
      });
      const worst = meals[0];

      const busyToday = otherDishesToday(plan, worst._day, worst);
      // Лимит повторов за неделю замена обязана уважать так же, как подбор:
      // иначе белок добирается тем, что одно блюдо расставляется по всей неделе.
      const used = usageInPlan(plan);
      const better = ctx.recipes
        .filter(r => r.m.indexOf(worst.slot) !== -1 && r.id !== worst.recipe.id &&
          busyToday.indexOf(r.id) === -1 && (used[r.id] || 0) < settings.maxRepeat)
        .map(function (r) {
          const nut = nutritionOfRecipe(ctx, r, byId);
          return { r: r, density: nut.total.p / Math.max(1, nut.total.kcal) };
        })
        .sort((a, b) => b.density - a.density)[0];

      if (!better) break;
      const currentDensity = worst.nutrition.p / Math.max(1, worst.nutrition.kcal);
      if (better.density <= currentDensity) break;

      clearLeftovers(plan, worst._day, worst.slot);
      worst.recipe = clone(better.r);
      plan.replacements.push({ reason: 'protein', to: better.r.n });
      rebalance(plan, byId);
      refillEmpty(plan, ctx, byId);
    }
  }

  /* Сколько раз каждое блюдо уже стоит в меню — по самому меню, а не по
     счётчику подбора.
   *
   * Счётчик ctx.usage считает только то, что поставил подбор. Замены —
   * ради белка и ради бюджета — ставят блюда мимо него, и счётчик отстаёт
   * от действительности. Спрашивать надо у плана: он единственный знает,
   * что там на самом деле лежит. */
  function usageInPlan(plan) {
    const used = {};
    plan.days.forEach(function (day) {
      day.meals.forEach(function (m) {
        if (m.recipe) used[m.recipe.id] = (used[m.recipe.id] || 0) + 1;
      });
    });
    return used;
  }

  function allMeals(plan) {
    const out = [];
    plan.days.forEach(function (d, di) {
      d.meals.forEach(function (m) {
        // Скрытым от перечисления, чтобы номер дня не попадал ни в сохранение,
        // ни в общую базу: это рабочая пометка на время расчёта, а не часть
        // плана. Сохранённая, она переживала бы перестройку плана и врала бы
        // о том, в каком дне стоит блюдо.
        Object.defineProperty(m, '_day', { value: di, writable: true, configurable: true, enumerable: false });
        out.push(m);
      });
    });
    return out;
  }

  /* Если у блюда был «второй день», при замене его нужно снять.
     День указывается явно — по той же причине, что и в otherDishesToday. */
  function clearLeftovers(plan, dayIndex, slot) {
    plan.days.forEach(function (day) {
      day.meals.forEach(function (m) {
        if (m.leftoverOf === dayIndex && m.slot === slot) {
          m.recipe = null;
          m.leftoverOf = null;
        }
      });
    });
  }

  // ---------------------------------------------------------------- бюджет

  function budgetLimit() {
    const b = S().weeklyBudget();
    const settings = S().get().settings;
    return { food: b.food, allowed: b.food * (1 + settings.overspend), breakdown: b };
  }

  /* Кандидаты на замену продукта: та же роль, дешевле за единицу пользы. */
  function swapCandidates(product, byId) {
    if (!product.grp || SWAPPABLE.indexOf(product.grp) === -1) return [];
    const excluded = S().get().excluded;
    const role = product.role;
    const base = unitCost(product, role);

    return S().products()
      // Диета запрещает не только блюда, но и подстановку продукта в замену:
      // иначе оптимизатор вернул бы копчёности в щадящее меню через чёрный ход.
      .filter(p => p.grp === product.grp && p.id !== product.id && !excluded[p.id] &&
        S().isProductAllowed(p))
      .map(p => ({ p: p, cost: unitCost(p, role) }))
      .filter(c => c.cost < base * 0.95 && isFinite(c.cost))
      .sort((a, b) => a.cost - b.cost);
  }

  /* Сколько граммов заменителя даёт ту же пользу, что и грамм оригинала. */
  function equivalentGrams(from, to, grams) {
    const key = from.role === 'protein' ? 'p' : 'k';
    const fromDensity = from[key] / 100 * edible(from);
    const toDensity = to[key] / 100 * edible(to);
    if (fromDensity <= 0 || toDensity <= 0) return grams;
    const scaled = grams * (fromDensity / toDensity);
    return Math.max(grams * 0.3, Math.min(grams * 3, Math.round(scaled)));
  }

  function applySwap(plan, fromId, toId, byId) {
    const from = byId[fromId], to = byId[toId];
    let touched = 0;
    plan.days.forEach(function (day) {
      day.meals.forEach(function (meal) {
        if (!meal.recipe) return;
        const idx = meal.recipe.ing.findIndex(i => i.p === fromId);
        if (idx === -1) return;
        const grams = equivalentGrams(from, to, meal.recipe.ing[idx].g);
        const existing = meal.recipe.ing.findIndex(i => i.p === toId);
        if (existing !== -1 && existing !== idx) {
          meal.recipe.ing[existing].g += grams;
          meal.recipe.ing.splice(idx, 1);
        } else {
          meal.recipe.ing[idx] = { p: toId, g: grams };
        }
        touched++;
      });
    });
    return touched;
  }

  function snapshot(plan) {
    return JSON.stringify(plan.days);
  }

  function restore(plan, snap) {
    plan.days = JSON.parse(snap);
  }

  /* Найти приём пищи по координатам, а не по сохранённой ссылке.
   *
   * restore() заменяет plan.days разобранной копией, и все ссылки на приёмы
   * пищи, взятые до отката, указывают на объекты, которых в плане больше нет.
   * Править их можно сколько угодно — на план это не влияет. Поэтому там, где
   * между обращениями к приёму пищи возможен откат, его положение хранится
   * парой «день + слот», а сам объект берётся заново. */
  function mealAt(plan, dayIndex, slot) {
    const day = plan.days[dayIndex];
    return day ? day.meals.find(m => m.slot === slot) || null : null;
  }

  /* Проверка, что удешевление не сломало рацион. */
  function isAcceptable(plan) {
    const s = S().get().settings;
    const w = plan.nutrition.week, t = plan.targets.week;
    if (w.p < t.p * s.proteinFloor) return false;
    if (w.f < t.f * 0.65 || w.f > t.f * 1.30) return false;
    if (w.c < t.c * 0.80) return false;
    if (Math.abs(w.kcal - t.kcal) / t.kcal > s.kcalTolerance) return false;
    return true;
  }

  /* Дешёвый продукт — не повод есть его вёдрами. Потолок задан в каталоге
     полем maxWeek и считается на человека в неделю. */
  function withinWeeklyLimit(plan, productId, byId) {
    const product = byId[productId];
    if (!product || !product.maxWeek) return true;
    const eaters = Math.max(1, S().get().people.length);
    const need = SH().aggregate(plan)[productId] || 0;
    return need <= product.maxWeek * eaters * 1.15;
  }

  /* Сколько всего тратится на каждый продукт в плане — по этому списку
     ищем, что удешевлять в первую очередь. */
  function spendByProduct(plan, byId) {
    const spend = {};
    plan.days.forEach(function (day) {
      day.meals.forEach(function (meal) {
        if (!meal.recipe) return;
        const mult = meal.leftoverOf != null ? 0 : (meal.buy != null ? meal.buy : meal.mult);
        meal.recipe.ing.forEach(function (i) {
          const p = byId[i.p];
          if (!p) return;
          spend[i.p] = (spend[i.p] || 0) + i.g * mult * S().pricePerBase(p);
        });
      });
    });
    return spend;
  }

  function fitToBudget(plan, byId, ctx) {
    ctx = ctx || makeCtx();
    byId = byId || ctx.byId;
    const limit = budgetLimit();
    plan.budget = limit;

    // Подгонку можно запускать повторно (кнопкой на экране недели), поэтому
    // выводы прошлого запуска стираем: иначе они копятся и экран превращается
    // в простыню из одинаковых абзацев.
    plan.notes = [];

    let cost = SH().costOf(plan);
    plan.cost = cost;
    if (cost <= limit.allowed) return plan;

    const triedSwaps = {};
    let guard = 0;

    // Шаг 1: замена продуктов на более дешёвые аналоги той же роли.
    let bar = swapThreshold(cost, cost - limit.allowed);
    while (cost > limit.allowed && plan.swaps.length < bar.maxSwaps && guard++ < 60) {
      bar = swapThreshold(cost, cost - limit.allowed);
      const spend = spendByProduct(plan, byId);
      const ranked = Object.keys(spend)
        .map(id => ({ id: id, spend: spend[id] }))
        .sort((a, b) => b.spend - a.spend);

      let improved = false;
      for (const entry of ranked) {
        const product = byId[entry.id];
        if (!product) continue;
        const candidates = swapCandidates(product, byId).filter(c => !triedSwaps[entry.id + '>' + c.p.id]);
        if (!candidates.length) continue;

        const candidate = candidates[0];
        triedSwaps[entry.id + '>' + candidate.p.id] = true;

        const snap = snapshot(plan);
        applySwap(plan, entry.id, candidate.p.id, byId);
        rebalance(plan, byId);
        const newCost = SH().costOf(plan);
        const saving = cost - newCost;
        const worthIt = saving >= bar.rub && saving >= cost * bar.share;

        if (worthIt && isAcceptable(plan) && withinWeeklyLimit(plan, candidate.p.id, byId)) {
          // При повторной подгонке та же пара может всплыть снова — не плодим
          // строку, а суммируем экономию к уже записанной.
          const known = plan.swaps.find(s => s.from === product.n && s.to === candidate.p.n);
          if (known) known.saved += Math.round(saving);
          else plan.swaps.push({ from: product.n, to: candidate.p.n, saved: Math.round(saving) });
          cost = newCost;
          improved = true;
          break;
        }
        restore(plan, snap);
        rebalance(plan, byId);
      }
      if (!improved) break;
    }

    // Шаг 2: если замен продуктов не хватило — меняем сами блюда на более дешёвые.
    const recipes = S().recipes();
    guard = 0;
    while (cost > limit.allowed && guard++ < 20) {
      // Координаты, а не ссылки: внутри цикла случаются откаты, после которых
      // ссылка на приём пищи перестаёт быть частью плана.
      const spots = allMeals(plan)
        .filter(m => m.recipe && m.leftoverOf == null)
        .map(m => ({ day: m._day, slot: m.slot, meal: m }));
      spots.sort(function (a, b) {
        const ca = recipeCost(a.meal.recipe, byId, a.meal.buy || a.meal.mult) / Math.max(1, a.meal.nutrition.kcal);
        const cb = recipeCost(b.meal.recipe, byId, b.meal.buy || b.meal.mult) / Math.max(1, b.meal.nutrition.kcal);
        return cb - ca;
      });

      let improved = false;
      for (const spot of spots) {
        const current = mealAt(plan, spot.day, spot.slot);
        if (!current || !current.recipe) continue;

        const busyToday = otherDishesToday(plan, spot.day, current);
        // Дешевле всего расставить одно и то же блюдо на всю неделю, и раньше
        // подгонка именно к этому и скатывалась: замены выбирались по цене,
        // не глядя на то, сколько раз это блюдо уже стоит в меню. Экономия
        // получалась настоящая, а неделя — несъедобная.
        const used = usageInPlan(plan);
        const alternatives = recipes
          .filter(r => r.m.indexOf(current.slot) !== -1 && r.id !== current.recipe.id &&
            busyToday.indexOf(r.id) === -1 && (used[r.id] || 0) < ctx.settings.maxRepeat)
          .map(function (r) {
            const nut = nutritionOfRecipe(ctx, r, byId);
            return { r: r, perKcal: recipeCost(r, byId, 1) / Math.max(1, nut.total.kcal) };
          })
          .sort((a, b) => a.perKcal - b.perKcal)
          .slice(0, 5);

        for (const alt of alternatives) {
          const snap = snapshot(plan);
          // Свежая ссылка на каждом обороте: предыдущий откат мог заменить её.
          const meal = mealAt(plan, spot.day, spot.slot);
          if (!meal || !meal.recipe) break;
          const removed = meal.recipe.n;

          clearLeftovers(plan, spot.day, spot.slot);
          meal.recipe = clone(alt.r);
          rebalance(plan, byId);
          refillEmpty(plan, ctx, byId);
          const newCost = SH().costOf(plan);
          if (newCost < cost - swapThreshold(cost, cost - limit.allowed).rub && isAcceptable(plan)) {
            plan.replacements.push({ reason: 'budget', from: removed, to: alt.r.n, saved: Math.round(cost - newCost) });
            cost = newCost;
            improved = true;
            break;
          }
          restore(plan, snap);
          rebalance(plan, byId);
        }
        if (improved) break;
      }
      if (!improved) break;
    }

    plan.cost = cost;
    if (cost > limit.allowed) {
      const gapWeek = Math.round(cost - limit.allowed);
      const s = S().get().settings;
      const weeks = s.period === 'month' ? s.weeksInMonth : 1;
      const needBudget = Math.round((s.budget + gapWeek * weeks) / 100) * 100;

      plan.notes.push('Уложиться в бюджет без потери нормы БЖУ не получилось: не хватает ' +
        gapWeek + ' ₽ в неделю. Показан самый дешёвый вариант, который сохраняет калории и белок — ' +
        'резать их приложение не станет.');
      plan.notes.push('Выхода три: поднять бюджет примерно до ' + needBudget + ' ₽ на ' +
        (s.period === 'month' ? 'месяц' : 'неделю') + '; занести в кладовую то, что уже есть дома; ' +
        'или пересмотреть цели в профилях — при снижении веса норма калорий, а с ней и стоимость, падает.');
    }
    return plan;
  }

  /* Жёсткая подгонка «во что бы то ни стало».
   *
   * Обычная подгонка отказывается резать белок ниже установленного порога —
   * и это правильное поведение по умолчанию. Но иногда денег просто нет,
   * и человек сознательно готов на компромисс. Тогда ограничения снимаются
   * ступенями, от самых безобидных к болезненным, и подгонка останавливается
   * на первой ступени, где план влез в бюджет.
   *
   * Чего эта функция не делает никогда: не опускает белок ниже 0,8 г на кг
   * массы тела и калории ниже 1200 у женщин и 1500 у мужчин. Это не настройка
   * бюджета, а граница, за которой начинается вред здоровью, поэтому вместо
   * красивой цифры приложение честно скажет, что уложиться нельзя.
   */
  function hardFit(plan) {
    const state = S().get();
    const settings = state.settings;
    const ctx = makeCtx();
    const byId = ctx.byId;
    const limit = budgetLimit();

    const original = { proteinFloor: settings.proteinFloor, maxRepeat: settings.maxRepeat };
    plan.compromises = [];

    // Снимок плана «по норме» — чтобы к нему можно было вернуться одной кнопкой.
    // Компромисс должен быть обратимым: человек соглашается на него ради денег,
    // а не навсегда.
    if (!plan.beforeHardFit) {
      plan.beforeHardFit = {
        days: JSON.parse(JSON.stringify(plan.days)),
        slotTargets: plan.slotTargets,
        targets: plan.targets,
        nutrition: plan.nutrition,
        swaps: plan.swaps,
        replacements: plan.replacements,
        notes: plan.notes,
        cost: plan.cost,
        budget: plan.budget
      };
    }

    // Абсолютный минимум белка: 0,8 г/кг — рекомендуемая норма ВОЗ,
    // ниже неё начинается потеря мышц, а не экономия.
    const safeProteinWeek = state.people.reduce((sum, p) => sum + p.weight * 0.8, 0) * 7;
    const floorRatio = Math.max(0.5, Math.min(0.9, safeProteinWeek / Math.max(1, plan.targets.week.p)));

    const stages = [
      { floor: original.proteinFloor, repeat: Math.max(original.maxRepeat, 3) },
      { floor: 0.85, repeat: Math.max(original.maxRepeat, 4) },
      { floor: 0.80, repeat: 5 },
      { floor: floorRatio, repeat: 7 }
    ];

    // Подбор блюд случаен, поэтому один прогон ничего не доказывает: берём
    // несколько попыток и оставляем самую дешёвую. Иначе жёсткая подгонка
    // иногда выдавала результат хуже исходного плана.
    const ATTEMPTS = 3;
    let best = null;

    // Настройки человека здесь одалживаются, а не меняются: ступени подгонки
    // временно занижают порог белка и поднимают лимит повторов. Вернуть их
    // обязательно при любом исходе — сорвись расчёт на середине, человек
    // остался бы с молча ослабленными требованиями навсегда.
    try {
      for (let i = 0; i < stages.length; i++) {
        const stage = stages[i];
        if (stage.floor < floorRatio) continue;            // ниже безопасного не опускаемся

        settings.proteinFloor = stage.floor;
        settings.maxRepeat = stage.repeat;

        for (let a = 0; a < ATTEMPTS; a++) {
          // Пересобираем с нуля в режиме экономии: на жёстком бюджете важен сам
          // набор блюд, а не косметические замены в уже собранном меню.
          const attempt = generate({ costFocus: true });
          if (!best || attempt.cost < best.cost) best = attempt;
          if (best.cost <= limit.allowed) break;
        }
        if (best && best.cost <= limit.allowed) break;
      }
    } finally {
      settings.proteinFloor = original.proteinFloor;
      settings.maxRepeat = original.maxRepeat;
    }

    // Если ослабление не помогло, исходный план всё равно не портим.
    if (best && best.cost < plan.cost) {
      plan.days = best.days;
      plan.slotTargets = best.slotTargets;
      plan.targets = best.targets;
      plan.nutrition = best.nutrition;
      plan.swaps = best.swaps;
      plan.replacements = best.replacements;
      plan.notes = best.notes;
      plan.cost = best.cost;
      plan.budget = best.budget;
    }

    const fitted = plan.cost <= limit.allowed;
    const w = plan.nutrition.week, t = plan.targets.week;
    const proteinShare = Math.round(w.p / t.p * 100);

    // Доля от цели пугает сильнее, чем есть на деле: цель 1,5 г/кг, а нижняя
    // безопасная граница 0,8 г/кг — это и есть 53% от цели. Поэтому показываем
    // ещё и граммы на килограмм, по ним видно реальное положение дел.
    const totalWeight = state.people.reduce((sum, p) => sum + p.weight, 0) || 1;
    const proteinPerKg = Math.round(w.p / 7 / totalWeight * 100) / 100;
    const targetPerKg = Math.round(t.p / 7 / totalWeight * 100) / 100;

    // Отчитываемся по тому, что получилось на самом деле, а не по названию
    // ступени, до которой дошли: иначе сообщение врёт.
    if (proteinShare < 97) {
      plan.compromises.push('белок снижен с ' + targetPerKg + ' до ' + proteinPerKg +
        ' г на кг веса (' + proteinShare + '% вашей цели)');
    }

    // Считаем повторы по готовому меню, а не по настройке: настройка к этому
    // моменту уже возвращена к исходной и сказала бы неправду.
    const used = {};
    allMeals(plan).forEach(function (m) {
      if (m.recipe) used[m.recipe.id] = (used[m.recipe.id] || 0) + 1;
    });
    const mostRepeated = Object.keys(used).reduce((n, k) => Math.max(n, used[k]), 0);
    if (mostRepeated > original.maxRepeat) {
      plan.compromises.push('одно блюдо повторяется до ' + mostRepeated + ' раз за неделю вместо ' + original.maxRepeat);
    }
    if (Math.round(w.c / t.c * 100) > 105) {
      plan.compromises.push('рацион сдвинут к крупам и хлебу — это самые дешёвые калории');
    }

    plan.hardFit = {
      fitted: fitted,
      cost: plan.cost,
      limit: Math.round(limit.allowed),
      proteinShare: proteinShare,
      proteinPerKg: proteinPerKg,
      targetPerKg: targetPerKg,
      safePerKg: 0.8,
      kcalShare: Math.round(w.kcal / t.kcal * 100),
      compromises: plan.compromises
    };

    if (!fitted) {
      plan.notes = plan.notes || [];
      plan.notes.push('Даже с ослабленными требованиями план не влезает: не хватает ' +
        Math.round(plan.cost - limit.allowed) + ' ₽ в неделю. Дальше резать нельзя — ' +
        'белок уже на нижней безопасной границе 0,8 г на кг веса. Это не ограничение ' +
        'приложения, а арифметика: столько еды за эти деньги в ваших магазинах не купить.');
    }

    S().save();
    return plan;
  }

  /* Вернуться к плану, собранному по полной норме БЖУ. */
  function undoHardFit(plan) {
    const snap = plan.beforeHardFit;
    if (!snap) return plan;

    plan.days = snap.days;
    plan.slotTargets = snap.slotTargets;
    plan.targets = snap.targets;
    plan.nutrition = snap.nutrition;
    plan.swaps = snap.swaps;
    plan.replacements = snap.replacements;
    plan.notes = snap.notes;
    plan.cost = snap.cost;
    plan.budget = snap.budget;

    delete plan.beforeHardFit;
    delete plan.hardFit;
    delete plan.compromises;

    S().save();
    return plan;
  }

  /* Разбор перерасхода: на чём именно ушли деньги и чем это заменить.
   *
   * Красной цифры «не хватает 149 ₽» мало — она говорит, что всё плохо,
   * но не говорит, что делать. Здесь по каждому дорогому продукту подбирается
   * несколько замен той же роли с оценкой экономии, а человек решает сам:
   * применить, выбрать другую замену или убрать предложение навсегда,
   * если оно ему не подходит.
   */
  /* Сколько замена сэкономит на самом деле.
   *
   * Прикидка по цене грамма белка врёт: продукты продаются упаковками,
   * и переход на более дешёвый за килограмм продукт может потребовать новую
   * пачку и выйти дороже. В тестах предложенная замена именно так и увеличила
   * стоимость недели. Поэтому здесь замена реально применяется к копии плана,
   * стоимость пересчитывается по упаковкам, и план возвращается на место. */
  function trySwapSaving(plan, fromId, toId, byId) {
    const snap = snapshot(plan);
    const before = plan.cost || SH().costOf(plan);
    applySwap(plan, fromId, toId, byId);
    rebalance(plan, byId);
    const after = SH().costOf(plan);
    const acceptable = isAcceptable(plan);
    restore(plan, snap);
    rebalance(plan, byId);
    return acceptable ? Math.round(before - after) : 0;
  }

  // Разбор вызывается на каждой перерисовке, а проба стоит недёшево.
  // Пока план и список отказов не менялись, отдаём готовый результат.
  let adviceCache = null;

  function overspendAdvice(plan, actualSpend) {
    const byId = S().productsById();
    const state = S().get();
    const limit = plan.budget ? plan.budget.food : budgetLimit().food;
    const spent = actualSpend != null ? actualSpend : plan.cost;
    const dismissed = state.dismissedSwaps || {};

    const key = [plan.cost, Object.keys(dismissed).length, Math.round(limit), Math.round(spent)].join('|');
    if (adviceCache && adviceCache.key === key) {
      return Object.assign({}, adviceCache.value, { over: Math.round(spent - limit) });
    }

    const spend = spendByProduct(plan, byId);
    const ideas = [];

    Object.keys(spend).forEach(function (id) {
      const product = byId[id];
      if (!product || spend[id] < 40) return;

      const base = unitCost(product, product.role);
      if (!isFinite(base) || base <= 0) return;

      const options = swapCandidates(product, byId)
        .filter(c => !dismissed[id + '>' + c.p.id])
        .slice(0, 3)                                  // проба недешёвая, перебирать всё незачем
        .map(function (c) {
          return { id: c.p.id, name: c.p.n, saves: trySwapSaving(plan, id, c.p.id, byId) };
        })
        .filter(o => o.saves >= 25)
        .sort((a, b) => b.saves - a.saves);

      if (!options.length) return;
      ideas.push({
        id: id,
        name: product.n,
        spend: Math.round(spend[id]),
        options: options
      });
    });

    ideas.sort((a, b) => b.options[0].saves - a.options[0].saves);

    const value = {
      spent: Math.round(spent),
      limit: Math.round(limit),
      ideas: ideas.slice(0, 6)
    };
    adviceCache = { key: key, value: value };

    return Object.assign({ over: Math.round(spent - limit) }, value);
  }

  /* Применить одну замену из разбора. Возвращает, сколько реально сэкономили —
     оценка и факт расходятся из-за целых упаковок. */
  function applyProductSwap(plan, fromId, toId) {
    const ctx = makeCtx();
    const byId = ctx.byId;
    const from = byId[fromId], to = byId[toId];
    if (!from || !to) return 0;

    const before = plan.cost || SH().costOf(plan);
    const snap = snapshot(plan);

    applySwap(plan, fromId, toId, byId);
    rebalance(plan, byId);
    refillEmpty(plan, ctx, byId);
    plan.cost = SH().costOf(plan);

    // Последняя проверка перед тем, как оставить изменение: даже проверенная
    // проба могла разойтись с итогом, а делать хуже по нажатию «Заменить»
    // приложение не имеет права.
    if (plan.cost >= before || !isAcceptable(plan)) {
      restore(plan, snap);
      rebalance(plan, byId);
      plan.cost = before;
      S().save();
      return 0;
    }

    const saved = Math.round(before - plan.cost);
    plan.swaps = plan.swaps || [];
    const known = plan.swaps.find(s => s.from === from.n && s.to === to.n);
    if (known) known.saved += saved;
    else plan.swaps.push({ from: from.n, to: to.n, saved: saved });

    S().save();
    return saved;
  }

  /* Если бюджет остался — куда его осмысленно потратить.
     Ничего не меняем автоматически: это предложения, решает человек. */
  function upgradeSuggestions(plan) {
    const byId = S().productsById();
    const limit = plan.budget || budgetLimit();
    const surplus = limit.allowed - plan.cost;
    if (surplus < 150) return [];

    const spend = spendByProduct(plan, byId);
    const out = [];

    Object.keys(spend).forEach(function (id) {
      const product = byId[id];
      if (!product || !product.grp || SWAPPABLE.indexOf(product.grp) === -1) return;
      const role = product.role;
      const base = unitCost(product, role);

      S().products()
        .filter(p => p.grp === product.grp && p.id !== id && unitCost(p, role) > base)
        .forEach(function (p) {
          const extra = (unitCost(p, role) - base) * (spend[id] / base);
          if (extra > 0 && extra < surplus) {
            out.push({ from: product.n, to: p.n, extra: Math.round(extra) });
          }
        });
    });

    // Разнообразие важнее одного дорогого продукта — берём по одной идее на группу.
    const seen = {};
    return out.sort((a, b) => a.extra - b.extra).filter(function (s) {
      if (seen[s.from]) return false;
      seen[s.from] = true;
      return true;
    }).slice(0, 5);
  }

  window.App = window.App || {};
  window.App.planner = {
    generate, rebalance, fitToBudget, hardFit, undoHardFit, budgetLimit, makeCtx, refillEmpty, tuneMacros,
    slotTargets, targetsOf, personShares, mealPortions, mealCost, dayCost, potMeals, syncPot,
    overspendAdvice, applyProductSwap,
    upgradeSuggestions, recipeCost, unitCost, allMeals,
    DAY_NAMES: DAY_NAMES
  };
})();

/* ===== js/ui/layout.js ===== */
/* Выбор расположения экранов.
 *
 * Два разных взгляда на одни и те же данные, а не тема оформления:
 *
 *   «Вкладки»   — обзор, неделя, список, кладовая, цены, отчёты. Всё разложено
 *                 по полкам, видно цифры и как они получились.
 *   «Календарь» — месячная сетка, кружочки едоков, день открывается по нажатию.
 *                 Видно, что и когда есть и когда идти в магазин.
 *
 * Выбор хранится НА УСТРОЙСТВЕ, а не в общих данных хозяйства, и это
 * принципиально. Двое в одном хозяйстве делят бюджет, кладовую и цены —
 * но не привычки. Попади эта настройка в общее состояние, она бы
 * синхронизировалась: он переключил у себя, а перещёлкнуло и у неё,
 * посреди магазина. Расположение экранов — свойство человека и его телефона,
 * а не свойство хозяйства.
 */
(function () {
  'use strict';

  const KEY = 'spendings.layout';

  const LAYOUTS = {
    tabs: {
      id: 'tabs',
      n: 'Вкладки',
      short: 'Всё по полкам: обзор, неделя, список, цены, отчёты',
      why: 'Видно цифры и то, как они получились. Больше управления, больше экранов.',
      order: ['dashboard', 'week', 'list', 'pantry', 'prices', 'reports', 'settings', 'account'],
      home: 'dashboard'
    },
    calendar: {
      id: 'calendar',
      n: 'Календарь',
      short: 'Месяц на одном экране, едоки кружочками, день открывается нажатием',
      why: 'Видно, что и когда есть и когда идти в магазин. Меньше цифр, больше картины.',
      order: ['calendar', 'list', 'pantry', 'prices', 'settings', 'account'],
      home: 'calendar'
    }
  };

  let current = null;

  function get() {
    if (current) return current;
    let saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) { /* без хранилища — по умолчанию */ }
    current = LAYOUTS[saved] ? saved : 'tabs';
    return current;
  }

  function set(id) {
    if (!LAYOUTS[id]) return get();
    current = id;
    try { localStorage.setItem(KEY, id); } catch (e) { /* переживёт до перезагрузки */ }
    return current;
  }

  function def() { return LAYOUTS[get()]; }

  window.App = window.App || {};
  window.App.layout = {
    LAYOUTS: LAYOUTS,
    get: get,
    set: set,
    current: def,
    order: () => def().order,
    home: () => def().home
  };
})();

/* ===== js/ui/helpers.js ===== */
/* Мелкие помощники интерфейса: сборка DOM, форматирование, всплывающие сообщения. */
(function () {
  'use strict';

  /* h('div.card', {...}, [дети]) — компактная сборка элементов без шаблонизатора. */
  function h(tagSpec, attrs, children) {
    const parts = tagSpec.split('.');
    const el = document.createElement(parts[0] || 'div');
    if (parts.length > 1) el.className = parts.slice(1).join(' ');

    if (attrs) {
      Object.keys(attrs).forEach(function (key) {
        const value = attrs[key];
        if (value === null || value === undefined || value === false) return;
        if (key === 'class') el.className += (el.className ? ' ' : '') + value;
        else if (key === 'text') el.textContent = value;
        // Ветки html: здесь нет и не будет. Она была, ей никто не пользовался,
        // и это ровно тот случай, когда удобство обходится дорого: в текстах
        // приложения нет ничего своего — там названия продуктов, марки,
        // магазины и имена профилей, то есть строки, пришедшие из файла
        // выгрузки. Один вызов h(..., {html: product.n}) превратил бы такой
        // файл в способ выполнить чужой код в браузере. Всё пишется
        // через textContent, и написанное остаётся текстом.
        else if (key === 'style' && typeof value === 'object') Object.assign(el.style, value);
        else if (key.slice(0, 2) === 'on' && typeof value === 'function') el.addEventListener(key.slice(2), value);
        else if (key === 'value') el.value = value;
        else if (key === 'checked') el.checked = !!value;
        else el.setAttribute(key, value);
      });
    }

    append(el, children);
    return el;
  }

  function append(el, children) {
    if (children === null || children === undefined || children === false) return;
    if (Array.isArray(children)) { children.forEach(c => append(el, c)); return; }
    if (children instanceof Node) { el.appendChild(children); return; }
    el.appendChild(document.createTextNode(String(children)));
  }

  function money(value) {
    const rounded = Math.round(value || 0);
    return rounded.toLocaleString('ru-RU') + ' ₽';
  }

  function num(value, digits) {
    const factor = Math.pow(10, digits || 0);
    return (Math.round((value || 0) * factor) / factor).toLocaleString('ru-RU');
  }

  function signedPct(value) {
    return (value > 0 ? '+' : '') + value + '%';
  }

  function card(title, children, extraClass) {
    return h('section.card' + (extraClass ? '.' + extraClass : ''), {}, [
      title ? h('h2.card-title', { text: title }) : null,
      h('div.card-body', {}, children)
    ]);
  }

  function field(label, control, hint) {
    return h('label.field', {}, [
      h('span.field-label', { text: label }),
      control,
      hint ? h('span.field-hint', { text: hint }) : null
    ]);
  }

  function input(attrs) {
    return h('input.input', Object.assign({ type: 'text' }, attrs));
  }

  function numberInput(value, onChange, attrs) {
    const el = h('input.input', Object.assign({
      type: 'number', value: value,
      onchange: function () { onChange(parseFloat(el.value) || 0); }
    }, attrs || {}));
    return el;
  }

  function select(options, value, onChange) {
    const el = h('select.input', {
      onchange: function () { onChange(el.value); }
    }, options.map(o => h('option', { value: o.value, selected: String(o.value) === String(value), text: o.label })));
    return el;
  }

  function button(label, onClick, cls) {
    return h('button.btn' + (cls ? '.' + cls : ''), { type: 'button', onclick: onClick, text: label });
  }

  /* Полоса «сколько от нормы набрано» — быстрее читается, чем голые цифры. */
  function bar(actual, target, label) {
    const ratio = target > 0 ? actual / target : 0;
    const width = Math.min(140, ratio * 100);
    let tone = 'ok';
    if (ratio < 0.9) tone = 'low';
    if (ratio > 1.1) tone = 'high';
    return h('div.bar-row', {}, [
      h('span.bar-label', { text: label }),
      h('div.bar-track', {}, h('div.bar-fill.' + tone, { style: { width: Math.min(100, width) + '%' } })),
      h('span.bar-value', { text: Math.round(actual) + ' / ' + Math.round(target) })
    ]);
  }

  let toastTimer = null;
  function toast(message, tone) {
    let el = document.getElementById('toast');
    if (!el) {
      el = h('div.toast', { id: 'toast' });
      document.body.appendChild(el);
    }
    el.textContent = message;
    el.className = 'toast show' + (tone ? ' ' + tone : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast'; }, 2600);
  }

  /* Тяжёлый расчёт с обратной связью.
   *
   * Сборка недели и подгонка под бюджет считаются в том же потоке, который
   * рисует страницу. На компьютере это доли секунды, на телефоне — до трёх:
   * всё это время нажатия не проходят, полосы не двигаются, и приложение
   * выглядит зависшим.
   *
   * Отдать браузеру кадр перед началом работы обязательно, иначе сообщение
   * «считаю» будет поставлено в очередь на отрисовку, а отрисовка случится
   * уже после того, как расчёт закончится, — то есть его никто не увидит.
   * Одного requestAnimationFrame мало: он срабатывает перед отрисовкой,
   * а не после неё, поэтому за ним идёт setTimeout.
   */
  function busy(message, work) {
    toast(message);
    document.body.classList.add('busy');
    requestAnimationFrame(function () {
      setTimeout(function () {
        try {
          work();
        } finally {
          document.body.classList.remove('busy');
        }
      }, 0);
    });
  }

  function modal(title, contentNode, actions) {
    const overlay = h('div.modal-overlay', {
      onclick: function (e) { if (e.target === overlay) close(); }
    });
    function close() { overlay.remove(); }

    overlay.appendChild(h('div.modal', {}, [
      h('div.modal-head', {}, [
        h('h3', { text: title }),
        button('✕', close, 'ghost')
      ]),
      h('div.modal-body', {}, contentNode),
      h('div.modal-foot', {}, (actions || []).map(a => button(a.label, function () {
        const keep = a.onClick && a.onClick();
        if (!keep) close();
      }, a.cls)))
    ]));

    document.body.appendChild(overlay);
    return { close: close, el: overlay };
  }

  /* Кнопки работы с бюджетом: подстроить жёстко и вернуться к норме.
     Компромисс обратим — после жёсткой подгонки рядом всегда стоит выход обратно. */
  function budgetActions() {
    const store = window.App.store;
    const plan = store.plan();
    if (!plan) return [];

    const limit = plan.budget ? plan.budget.food : store.weeklyBudget().food;
    const out = [];

    if (plan.cost > limit) {
      out.push(button('Подстроить жёстко под бюджет', function () {
        // Самый долгий расчёт в приложении: до дюжины пересборок недели
        // подряд. Без предупреждения нажатие выглядит как зависание.
        busy('Подбираю самый дешёвый вариант…', function () {
          // План берём заново: за время между отрисовкой и нажатием его могла
          // заменить синхронизация, и прежняя ссылка вела бы в никуда.
          const live = store.plan();
          if (!live) return;
          window.App.planner.hardFit(live);
          window.App.ui.refresh();
          showHardFitResult();
        });
      }, 'primary'));
    }

    if (plan.beforeHardFit) {
      out.push(button('Вернуть план по норме БЖУ', function () {
        const live = store.plan();
        if (!live || !live.beforeHardFit) {
          toast('Плана по норме нет — соберите неделю заново', 'bad');
          return;
        }
        const normal = Math.round(live.beforeHardFit.cost);
        window.App.planner.undoHardFit(live);
        window.App.ui.refresh();
        toast('Вернулись к плану по полной норме — ' + money(normal));
      }));
    }

    return out;
  }

  // Оставлено для совместимости со старым вызовом.
  function hardFitButton() { return budgetActions(); }

  /* Разбор превышения бюджета.
   *
   * Красная цифра «не хватает 149 ₽» говорит, что всё плохо, но не говорит,
   * что делать. Здесь видно, на чём набежала сумма и что можно поставить
   * вместо. Предложения не навязываются: любое можно заменить на другое
   * из того же ряда или убрать навсегда, если оно не подходит.
   *
   * isActual различает два разных случая, которые нельзя называть одинаково:
   * план, который ещё можно переделать, и чек, по которому деньги уже ушли. */
  function overspendCard(amount, isActual) {
    const store = window.App.store;
    const plan = store.plan();
    if (!plan) return null;

    const advice = window.App.planner.overspendAdvice(plan, amount);
    if (advice.over <= 0) return null;

    /* Пока покупок не было, это расчёт, а не потраченные деньги.
       Называть его перерасходом — врать: человек видит «Потрачено 5 298 ₽»,
       ничего не купив. Слова про траты появляются только тогда,
       когда сумма пришла из чека. */
    const title = isActual
      ? 'Перерасход по чеку ' + money(advice.over)
      : 'Дороже бюджета на ' + money(advice.over);

    const lead = isActual
      ? 'Потрачено ' + money(advice.spent) + ' при бюджете ' + money(advice.limit) + '.'
      : 'План стоит ' + money(advice.spent) + ' при бюджете ' + money(advice.limit) +
        '. Это расчёт: деньги ещё не потрачены, и список можно изменить.';

    const rows = advice.ideas.map(function (idea) {
      // Выбранная замена хранится в самой строке: человек может перебрать
      // варианты, прежде чем применить.
      let chosen = idea.options[0];

      const costLabel = h('span.over-saves', { text: '−' + money(chosen.saves) });

      const picker = idea.options.length > 1
        ? select(idea.options.map(o => ({ value: o.id, label: o.name + ' (−' + money(o.saves) + ')' })),
            chosen.id,
            function (v) {
              chosen = idea.options.find(o => o.id === v) || chosen;
              costLabel.textContent = '−' + money(chosen.saves);
            })
        : h('span.over-to', { text: chosen.name });

      return h('div.over-row', {}, [
        h('div.over-main', {}, [
          h('span.over-from', { text: idea.name }),
          h('span.over-spend', { text: 'в плане на ' + money(idea.spend) })
        ]),
        h('span.over-arrow', { text: '→' }),
        h('div.over-pick', {}, picker),
        costLabel,
        h('div.over-actions', {}, [
          button('Заменить', function () {
            const live = store.plan();
            if (!live) return;
            const saved = window.App.planner.applyProductSwap(live, idea.id, chosen.id);
            window.App.ui.refresh();
            toast(saved > 0
              ? 'Заменено, неделя дешевле на ' + money(saved)
              : 'Замена не удешевила — вернул как было', saved > 0 ? null : 'bad');
          }, 'small primary'),
          button('Не предлагать', function () {
            store.dismissSwap(idea.id, chosen.id);
            window.App.ui.refresh();
            toast('Больше не предложу');
          }, 'ghost small')
        ])
      ]);
    });

    const dismissed = Object.keys(store.get().dismissedSwaps || {}).length;

    return card(title, [
      h('p', { text: lead }),
      rows.length
        ? h('div.over-list', {}, rows)
        : h('p.hint', { text: 'Заменить нечего: дешёвых аналогов той же роли в каталоге не осталось. ' +
            'Остаётся жёсткая подгонка или пересмотр бюджета.' }),
      rows.length
        ? h('p.hint', { text: 'Экономия посчитана пробой: замена применяется к плану, ' +
            'стоимость пересчитывается по целым упаковкам, план возвращается на место. ' +
            'Если замена не удешевит, она откатится.' })
        : null,
      dismissed
        ? h('div.row-actions', {}, button('Вернуть отклонённые предложения (' + dismissed + ')', function () {
            store.restoreSwaps();
            window.App.ui.refresh();
          }, 'ghost small'))
        : null
    ], 'over-card');
  }

  function showHardFitResult() {
    const plan = window.App.store.plan();
    if (!plan) return;
    const r = plan.hardFit || {};
    const lines = [];

    if (r.fitted) {
      lines.push(h('p', { text: 'Уложились: ' + money(r.cost) + ' при бюджете ' + money(r.limit) + '.' }));
    } else {
      lines.push(h('p', { text: 'Уложиться не удалось даже с ослабленными требованиями: ' +
        money(r.cost) + ' против ' + money(r.limit) + '.' }));
    }

    if (r.compromises && r.compromises.length) {
      lines.push(h('p.hint', { text: 'Чем пришлось пожертвовать:' }));
      lines.push(h('ul.plain', {}, r.compromises.map(c => h('li', { text: c }))));
    } else if (r.fitted) {
      lines.push(h('p.hint', { text: 'Ничем жертвовать не пришлось — хватило пересборки меню.' }));
    }

    lines.push(h('p.hint', {
      text: 'Итог по неделе: калории ' + r.kcalShare + '% нормы, белок ' +
        r.proteinPerKg + ' г на кг веса при вашей цели ' + r.targetPerKg +
        ' и безопасном минимуме ' + r.safePerKg + '.'
    }));

    if (!r.fitted) {
      lines.push(h('p.hint', { text: 'Ниже приложение не опускается сознательно: белок уже на границе ' +
        '0,8 г на кг веса, а это рекомендуемый минимум, а не место для экономии.' }));
    }

    modal(r.fitted ? 'Подстроено под бюджет' : 'Бюджета не хватает', lines, [
      {
        label: 'Вернуть норму БЖУ', onClick: function () {
          const live = window.App.store.plan();
          if (!live || !live.beforeHardFit) return;
          window.App.planner.undoHardFit(live);
          window.App.ui.refresh();
          toast('Вернулись к плану по полной норме');
        }
      },
      { label: 'Оставить так', cls: 'primary' }
    ]);
  }

  window.App = window.App || {};
  window.App.ui = Object.assign(window.App.ui || {}, {
    h, money, num, signedPct, card, field, input, numberInput, select, button, bar, toast, modal, busy,
    hardFitButton, budgetActions, overspendCard, showHardFitResult
  });
})();

/* ===== js/ui/charts.js ===== */
/* Небольшой набор графиков на чистом SVG: без библиотек, работает офлайн.
 *
 * Правила, по которым здесь всё построено:
 *  - палитра проверена валидатором на обеих поверхностях приложения, а не на глаз;
 *  - цвет закреплён за сущностью, а не за местом в списке: марка, скрытая
 *    фильтром, не перекрашивает остальные;
 *  - две величины разного масштаба никогда не делят одну ось — вместо второй оси
 *    два отдельных графика;
 *  - у каждого графика есть таблица-близнец: значение можно прочитать без мыши,
 *    и это же закрывает требование по контрасту светлых цветов на белом;
 *  - подписи приходят от пользователя (названия марок), поэтому вставляются
 *    только текстом, никогда как разметка.
 */
(function () {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';

  // Слоты палитры. Значения задаются в CSS, здесь — только имена ролей,
  // чтобы светлая и тёмная темы переключались в одном месте.
  const SERIES_VARS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)'];

  function seriesColor(index) {
    // Девятого цвета не бывает: остаток сворачивается в «Прочее» вызывающей стороной.
    return SERIES_VARS[index % SERIES_VARS.length];
  }

  function el(tag, attrs, children) {
    const node = document.createElementNS(NS, tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        const v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'text') node.textContent = v;          // никогда не innerHTML
        else node.setAttribute(k, v);
      });
    }
    (Array.isArray(children) ? children : [children]).forEach(function (c) {
      if (c) node.appendChild(c);
    });
    return node;
  }

  const H = () => window.App.ui.h;

  /* Ширина под экран: на телефоне график не должен уезжать за край. */
  function chartWidth() {
    const available = (window.innerWidth || 760) - 64;
    return Math.max(300, Math.min(760, available));
  }

  /* Круглые деления оси: 0 / 50 / 100, а не 0 / 47,3 / 94,6. */
  function niceScale(min, max, count) {
    if (!isFinite(min) || !isFinite(max)) { min = 0; max = 1; }
    if (min === max) { max = min + Math.abs(min || 1) * 0.2; min = min - Math.abs(min || 1) * 0.2; }
    const raw = (max - min) / (count || 5);
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
    const lo = Math.floor(min / step) * step;
    const hi = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
    return { min: lo, max: hi, ticks: ticks };
  }

  function fmtInt(v) { return Math.round(v).toLocaleString('ru-RU'); }
  function fmtDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.getDate() + '.' + String(d.getMonth() + 1).padStart(2, '0');
  }

  // ---------------------------------------------------------------- каркас

  /* Общая обёртка: заголовок, пояснение, легенда, полотно и таблица-близнец. */
  function figure(opts, svgNode, tableNode) {
    const h = H();
    const parts = [
      h('div.viz-head', {}, [
        h('h3.viz-title', { text: opts.title }),
        opts.subtitle ? h('p.viz-sub', { text: opts.subtitle }) : null
      ])
    ];

    // Легенда обязательна от двух рядов; при одном ряде её роль играет заголовок.
    if (opts.legend && opts.legend.length > 1) {
      parts.push(h('div.viz-legend', {}, opts.legend.map(function (item) {
        return h('span.viz-legend-item', {}, [
          h('span.viz-key' + (item.shape === 'line' ? '.line' : ''), { style: { background: item.color } }),
          h('span', { text: item.name })
        ]);
      })));
    }

    const plot = h('div.viz-plot', {}, svgNode);
    parts.push(plot);

    if (tableNode) {
      const details = h('details.viz-table', {}, [
        h('summary', { text: 'Показать числа' }),
        tableNode
      ]);
      parts.push(details);
    }

    return h('figure.viz', {}, parts);
  }

  /* Всплывающая подсказка живёт над полотном и повторяет то, что и так есть
     в таблице, — она дополняет, а не прячет значения. */
  function makeTip(container) {
    const h = H();
    const tip = h('div.viz-tip', { 'aria-hidden': 'true' });
    container.appendChild(tip);
    return {
      show: function (x, y, rows, head) {
        tip.innerHTML = '';
        tip.appendChild(h('div.viz-tip-head', { text: head }));
        rows.forEach(function (r) {
          tip.appendChild(h('div.viz-tip-row', {}, [
            h('span.viz-tip-key', { style: { background: r.color } }),
            h('span.viz-tip-val', { text: r.value }),
            h('span.viz-tip-name', { text: r.name })
          ]));
        });
        tip.classList.add('on');
        const box = container.getBoundingClientRect();
        const w = tip.offsetWidth || 150;
        tip.style.left = Math.max(4, Math.min(box.width - w - 4, x - w / 2)) + 'px';
        tip.style.top = Math.max(0, y - tip.offsetHeight - 12) + 'px';
      },
      hide: function () { tip.classList.remove('on'); }
    };
  }

  function tableOf(headers, rows) {
    const h = H();
    return h('table.table', {}, [
      h('thead', {}, h('tr', {}, headers.map((t, i) => h(i ? 'th.num' : 'th', { text: t })))),
      h('tbody', {}, rows.map(r => h('tr', {}, r.map((c, i) => h(i ? 'td.num' : 'td', { text: c })))))
    ]);
  }

  // ---------------------------------------------------------------- линии

  /* Несколько рядов во времени. Ось одна: если понадобилась вторая — это два
     разных графика, а не два масштаба на одном полотне. */
  function lineChart(opts) {
    const h = H();
    const series = opts.series.filter(s => s.points && s.points.length);
    const W = chartWidth();
    const HGT = opts.height || 220;
    const m = { t: 10, r: opts.endLabels === false ? 14 : 64, b: 26, l: 52 };

    if (!series.length) return emptyFigure(opts);

    const xs = [];
    series.forEach(s => s.points.forEach(p => { if (xs.indexOf(p.x) === -1) xs.push(p.x); }));
    xs.sort();

    const times = xs.map(x => new Date(x + 'T00:00:00').getTime());
    const tMin = Math.min.apply(null, times);
    const tMax = Math.max.apply(null, times);
    const span = tMax - tMin || 1;

    let vMin = Infinity, vMax = -Infinity;
    series.forEach(s => s.points.forEach(p => { vMin = Math.min(vMin, p.y); vMax = Math.max(vMax, p.y); }));
    const pad = (vMax - vMin) * 0.15 || Math.abs(vMax) * 0.1 || 1;
    const scale = niceScale(opts.zeroBased ? 0 : vMin - pad, vMax + pad, 4);

    const px = t => m.l + (t - tMin) / span * (W - m.l - m.r);
    const py = v => HGT - m.b - (v - scale.min) / (scale.max - scale.min) * (HGT - m.t - m.b);

    const layers = [];

    // Сетка — сплошные волосяные линии, никаких пунктиров.
    scale.ticks.forEach(function (t) {
      layers.push(el('line', { x1: m.l, x2: W - m.r, y1: py(t), y2: py(t), class: 'viz-grid' }));
      layers.push(el('text', { x: m.l - 8, y: py(t) + 4, class: 'viz-tick viz-tick-y', text: opts.yFormat ? opts.yFormat(t) : fmtInt(t) }));
    });

    // Подписи по оси времени: только края и середина, иначе они наезжают.
    const xTicks = xs.length <= 4 ? xs : [xs[0], xs[Math.floor(xs.length / 2)], xs[xs.length - 1]];
    xTicks.forEach(function (x) {
      const t = new Date(x + 'T00:00:00').getTime();
      layers.push(el('text', { x: px(t), y: HGT - 8, class: 'viz-tick viz-tick-x', text: fmtDate(x) }));
    });

    layers.push(el('line', { x1: m.l, x2: W - m.r, y1: HGT - m.b, y2: HGT - m.b, class: 'viz-axis' }));

    series.forEach(function (s, si) {
      const color = s.color || seriesColor(si);
      const pts = s.points.slice().sort((a, b) => (a.x < b.x ? -1 : 1));
      const d = pts.map(function (p, i) {
        const t = new Date(p.x + 'T00:00:00').getTime();
        return (i ? 'L' : 'M') + px(t).toFixed(1) + ' ' + py(p.y).toFixed(1);
      }).join(' ');

      layers.push(el('path', { d: d, fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));

      // Точки с кольцом цвета поверхности — чтобы не слипались на пересечениях.
      pts.forEach(function (p) {
        const t = new Date(p.x + 'T00:00:00').getTime();
        layers.push(el('circle', { cx: px(t), cy: py(p.y), r: 4, fill: color, stroke: 'var(--surface-1)', 'stroke-width': 2 }));
      });

      // Подпись у последней точки — идентичность не должна держаться на цвете.
      if (opts.endLabels !== false) {
        const last = pts[pts.length - 1];
        const t = new Date(last.x + 'T00:00:00').getTime();
        layers.push(el('text', {
          x: px(t) + 9, y: py(last.y) + 4, class: 'viz-endlabel',
          text: (opts.yFormat ? opts.yFormat(last.y) : fmtInt(last.y))
        }));
      }
    });

    const cross = el('line', { x1: 0, x2: 0, y1: m.t, y2: HGT - m.b, class: 'viz-cross', opacity: 0 });
    layers.push(cross);

    const svgNode = el('svg', {
      viewBox: '0 0 ' + W + ' ' + HGT,
      width: '100%', height: 'auto',
      role: 'img', 'aria-label': opts.title
    }, layers);

    const wrap = h('div.viz-canvas', {}, svgNode);
    const tip = makeTip(wrap);

    // Прицел ищет дату: читатель целится в день, а не в двухпиксельную линию.
    function onMove(ev) {
      const box = svgNode.getBoundingClientRect();
      const k = W / box.width;
      const localX = (ev.clientX - box.left) * k;
      let best = xs[0], bestD = Infinity;
      xs.forEach(function (x) {
        const d = Math.abs(px(new Date(x + 'T00:00:00').getTime()) - localX);
        if (d < bestD) { bestD = d; best = x; }
      });
      const t = new Date(best + 'T00:00:00').getTime();
      cross.setAttribute('x1', px(t));
      cross.setAttribute('x2', px(t));
      cross.setAttribute('opacity', 1);

      const rows = [];
      series.forEach(function (s, si) {
        const hit = s.points.find(p => p.x === best);
        if (!hit) return;
        rows.push({
          color: s.color || seriesColor(si),
          name: s.name,
          value: opts.yFormat ? opts.yFormat(hit.y) : fmtInt(hit.y)
        });
      });
      if (!rows.length) return;
      tip.show(px(t) / k, py(rows.length ? scale.max : 0) / k, rows, fmtDate(best));
    }

    svgNode.addEventListener('pointermove', onMove);
    svgNode.addEventListener('pointerleave', function () {
      cross.setAttribute('opacity', 0);
      tip.hide();
    });

    const rows = xs.map(function (x) {
      return [fmtDate(x)].concat(series.map(function (s) {
        const hit = s.points.find(p => p.x === x);
        return hit ? (opts.yFormat ? opts.yFormat(hit.y) : fmtInt(hit.y)) : '—';
      }));
    });

    return figure(
      Object.assign({}, opts, {
        legend: series.map((s, i) => ({ name: s.name, color: s.color || seriesColor(i), shape: 'line' }))
      }),
      wrap,
      tableOf(['Дата'].concat(series.map(s => s.name)), rows)
    );
  }

  // ---------------------------------------------------------------- столбики

  /* Сгруппированные столбики с линией ориентира (бюджет).
     Ориентир — не ряд данных, поэтому рисуется чертой, а не третьим цветом. */
  function groupedBars(opts) {
    const h = H();
    const groups = opts.groups || [];
    if (!groups.length) return emptyFigure(opts);

    const W = chartWidth();
    const HGT = opts.height || 240;
    const m = { t: 14, r: 14, b: 34, l: 56 };

    const names = [];
    groups.forEach(g => g.values.forEach(v => { if (names.indexOf(v.name) === -1) names.push(v.name); }));

    let vMax = 0;
    groups.forEach(g => g.values.forEach(v => { vMax = Math.max(vMax, v.value); }));
    if (opts.refLine) vMax = Math.max(vMax, opts.refLine.value);
    const scale = niceScale(0, vMax, 4);   // столбики всегда от нуля

    const plotW = W - m.l - m.r;
    const band = plotW / groups.length;
    const barW = Math.min(24, (band - 10) / Math.max(1, names.length) - 2);   // 2px воздуха между соседями
    const py = v => HGT - m.b - v / (scale.max || 1) * (HGT - m.t - m.b);

    const layers = [];
    scale.ticks.forEach(function (t) {
      layers.push(el('line', { x1: m.l, x2: W - m.r, y1: py(t), y2: py(t), class: 'viz-grid' }));
      layers.push(el('text', { x: m.l - 8, y: py(t) + 4, class: 'viz-tick viz-tick-y', text: fmtInt(t) }));
    });

    const bars = [];
    groups.forEach(function (g, gi) {
      const groupW = names.length * (barW + 2) - 2;
      const x0 = m.l + band * gi + (band - groupW) / 2;

      g.values.forEach(function (v, vi) {
        const color = seriesColor(names.indexOf(v.name));
        const x = x0 + vi * (barW + 2);
        const y = py(v.value);
        const height = Math.max(1, HGT - m.b - y);
        // Скруглённый верх, прямая опора на базовую линию.
        const r = Math.min(4, barW / 2, height);
        const d = 'M' + x + ' ' + (HGT - m.b) +
          ' L' + x + ' ' + (y + r) +
          ' Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y +
          ' L' + (x + barW - r) + ' ' + y +
          ' Q' + (x + barW) + ' ' + y + ' ' + (x + barW) + ' ' + (y + r) +
          ' L' + (x + barW) + ' ' + (HGT - m.b) + ' Z';
        const bar = el('path', { d: d, fill: color, class: 'viz-bar' });
        bars.push({ node: bar, group: g, item: v, color: color, x: x + barW / 2, y: y });
        layers.push(bar);
      });

      layers.push(el('text', { x: m.l + band * gi + band / 2, y: HGT - 12, class: 'viz-tick viz-tick-x', text: g.label }));
    });

    layers.push(el('line', { x1: m.l, x2: W - m.r, y1: HGT - m.b, y2: HGT - m.b, class: 'viz-axis' }));

    if (opts.refLine) {
      const y = py(opts.refLine.value);
      layers.push(el('line', { x1: m.l, x2: W - m.r, y1: y, y2: y, class: 'viz-ref' }));
      layers.push(el('text', { x: m.l + 4, y: y - 6, class: 'viz-ref-label', text: opts.refLine.label }));
    }

    const svgNode = el('svg', {
      viewBox: '0 0 ' + W + ' ' + HGT, width: '100%', height: 'auto',
      role: 'img', 'aria-label': opts.title
    }, layers);

    const wrap = h('div.viz-canvas', {}, svgNode);
    const tip = makeTip(wrap);

    // На столбиках цель наведения — сам столбик, прицел не нужен.
    bars.forEach(function (b) {
      b.node.addEventListener('pointerenter', function () {
        b.node.classList.add('hot');
        const box = svgNode.getBoundingClientRect();
        const k = W / box.width;
        tip.show(b.x / k, b.y / k, [{
          color: b.color, name: b.item.name,
          value: (opts.yFormat ? opts.yFormat(b.item.value) : fmtInt(b.item.value))
        }], b.group.label);
      });
      b.node.addEventListener('pointerleave', function () {
        b.node.classList.remove('hot');
        tip.hide();
      });
    });

    const rows = groups.map(g => [g.label].concat(names.map(function (n) {
      const hit = g.values.find(v => v.name === n);
      return hit ? (opts.yFormat ? opts.yFormat(hit.value) : fmtInt(hit.value)) : '—';
    })));

    return figure(
      Object.assign({}, opts, { legend: names.map((n, i) => ({ name: n, color: seriesColor(i) })) }),
      wrap,
      tableOf(['Неделя'].concat(names), rows)
    );
  }

  // ---------------------------------------------------------------- рейтинг

  /* Горизонтальные столбики одного цвета: категорий больше семи, и раскрашивать
     их в семь цветов значило бы тратить единственный свободный канал на то,
     что и так написано подписью. Длина столбика — и есть величина. */
  function rankedBars(opts) {
    const h = H();
    const items = (opts.items || []).slice().sort((a, b) => b.value - a.value);
    if (!items.length) return emptyFigure(opts);

    const W = chartWidth();
    const rowH = 26;
    const vMax = Math.max.apply(null, items.map(i => i.value));
    const total = items.reduce((s, i) => s + i.value, 0) || 1;

    // Поле справа считаем по самой длинной подписи, а не берём с потолка:
    // при фиксированном значении «1 200 ₽ · 31%» вылезала за край полотна.
    const labels = items.map(i => fmtInt(i.value) + ' ₽ · ' + Math.round(i.value / total * 100) + '%');
    const widest = labels.reduce((n, t) => Math.max(n, t.length), 0);

    const m = {
      t: 6, b: 6,
      r: Math.min(150, widest * 6.1 + 14),
      l: Math.min(150, Math.round(W * 0.32))
    };
    const HGT = m.t + m.b + items.length * rowH;
    const plotW = Math.max(40, W - m.l - m.r);

    const layers = [];
    const bars = [];

    items.forEach(function (it, i) {
      const y = m.t + i * rowH + 4;
      const barH = rowH - 12;
      const w = Math.max(2, it.value / vMax * plotW);
      const r = Math.min(4, barH / 2, w);

      layers.push(el('text', { x: m.l - 10, y: y + barH - 2, class: 'viz-rowlabel', text: it.label }));

      const d = 'M' + m.l + ' ' + y +
        ' L' + (m.l + w - r) + ' ' + y +
        ' Q' + (m.l + w) + ' ' + y + ' ' + (m.l + w) + ' ' + (y + r) +
        ' L' + (m.l + w) + ' ' + (y + barH - r) +
        ' Q' + (m.l + w) + ' ' + (y + barH) + ' ' + (m.l + w - r) + ' ' + (y + barH) +
        ' L' + m.l + ' ' + (y + barH) + ' Z';
      const bar = el('path', { d: d, fill: 'var(--s1)', class: 'viz-bar' });
      layers.push(bar);
      bars.push({ node: bar, item: it, x: m.l + w, y: y });

      // Значение у конца столбика — снаружи, поэтому обрезаться нечему.
      layers.push(el('text', {
        x: m.l + w + 8, y: y + barH - 2, class: 'viz-endlabel', text: labels[i]
      }));
    });

    const svgNode = el('svg', {
      viewBox: '0 0 ' + W + ' ' + HGT, width: '100%', height: 'auto',
      role: 'img', 'aria-label': opts.title
    }, layers);

    const wrap = h('div.viz-canvas', {}, svgNode);

    const rows = items.map(i => [i.label, fmtInt(i.value) + ' ₽', Math.round(i.value / total * 100) + '%']);
    return figure(
      Object.assign({}, opts, { legend: null }),
      wrap,
      tableOf(['Категория', 'Сумма', 'Доля'], rows)
    );
  }

  // ---------------------------------------------------------------- пусто

  function emptyFigure(opts) {
    const h = H();
    return h('figure.viz.viz-empty', {}, [
      h('div.viz-head', {}, [
        h('h3.viz-title', { text: opts.title }),
        opts.subtitle ? h('p.viz-sub', { text: opts.subtitle }) : null
      ]),
      h('p.hint', { text: opts.empty || 'Пока нет данных для графика.' })
    ]);
  }

  /* Плитка с числом — когда величина одна, столбик из одного столбика не нужен. */
  function statTile(label, value, delta) {
    const h = H();
    return h('div.viz-stat', {}, [
      h('span.viz-stat-label', { text: label }),
      h('span.viz-stat-value', { text: value }),
      delta ? h('span.viz-stat-delta' + (delta.good ? '.good' : delta.bad ? '.bad' : ''), { text: delta.text }) : null
    ]);
  }

  window.App = window.App || {};
  window.App.charts = {
    lineChart, groupedBars, rankedBars, statTile, emptyFigure,
    seriesColor, fmtInt, fmtDate, niceScale
  };
})();

/* ===== js/ui/view-calendar.js ===== */
/* Календарь: месяц на одном экране.
 *
 * Месяц здесь — это витрина, а не единица планирования. Считает по-прежнему
 * недельный движок: закупка, кладовая и подгонка под бюджет живут неделей,
 * и это свойство задачи, а не ограничение кода. Месяц склеивается из недель,
 * каждая собрана тем же проверенным путём.
 *
 * Отсюда важное следствие для дней закупок: они не выдуманы для красоты.
 * День закупки — это понедельник недели, потому что именно на неделю
 * считается список покупок, и сумма на нём — настоящая стоимость этого списка.
 */
(function () {
  'use strict';

  const U = () => window.App.ui;
  const S = () => window.App.store;
  const P = () => window.App.planner;

  const WEEKDAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
    'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const MONTHS_NOM = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
    'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

  // Приёмы пищи узнаются в сетке по значку — подписи туда не влезают.
  const MEAL_ICONS = { breakfast: '☕', lunch: '🍲', dinner: '🍽', snack: '🍎' };

  // Какой месяц показан и чей взгляд выбран. Живут между перерисовками,
  // но не сохраняются: это положение взгляда, а не данные.
  let shownMonth = null;          // первое число показываемого месяца
  let whoseView = 'all';          // 'all' или id профиля
  let openDay = null;             // раскрытый день

  function monthStart(date) {
    const d = new Date(date);
    return new Date(d.getFullYear(), d.getMonth(), 1);
  }

  function shiftMonth(delta) {
    const d = shownMonth || monthStart(new Date());
    shownMonth = new Date(d.getFullYear(), d.getMonth() + delta, 1);
    openDay = null;
    U().refresh();
  }

  function render() {
    const u = U(), h = u.h;
    if (!shownMonth) shownMonth = monthStart(new Date());

    return h('div.view.cal-view', {}, [
      eatersRow(),
      monthCard(),
      openDay ? dayCard(openDay) : hintCard()
    ]);
  }

  // ---------------------------------------------------------------- едоки

  /* Кружочки едоков. Переключают не меню, а взгляд на него: готовится одна
     кастрюля, но порция и КБЖУ у каждого свои, и увидеть их по отдельности
     полезнее, чем общую цифру на всех. */
  function eatersRow() {
    const u = U(), h = u.h;
    const people = S().get().people || [];

    function circle(id, label, title) {
      const active = whoseView === id;
      return h('button.eater' + (active ? '.active' : ''), {
        type: 'button',
        title: title,
        'aria-pressed': active ? 'true' : 'false',
        onclick: function () { whoseView = id; u.refresh(); }
      }, [
        h('span.eater-face', { text: label }),
        h('span.eater-name', { text: title })
      ]);
    }

    return h('div.eaters', {}, [
      circle('all', '👥', 'Все'),
      ...people.map(p => circle(p.id, initials(p.name), p.name))
    ]);
  }

  function initials(name) {
    const clean = String(name || '?').trim();
    return clean ? clean[0].toUpperCase() : '?';
  }

  // ---------------------------------------------------------------- месяц

  function monthCard() {
    const u = U(), h = u.h;
    const first = shownMonth;
    const title = MONTHS_NOM[first.getMonth()] + ' ' + first.getFullYear();

    return u.card(null, [
      h('div.cal-head', {}, [
        u.button('‹', () => shiftMonth(-1), 'ghost small'),
        h('h2.cal-title', { text: title }),
        u.button('›', () => shiftMonth(1), 'ghost small')
      ]),
      h('div.cal-grid', {}, [
        ...WEEKDAYS.map(d => h('div.cal-wd', { text: d })),
        ...cells(first)
      ]),
      legend(),
      weekActions(first)
    ], 'cal-card');
  }

  /* Сетка месяца всегда начинается с понедельника: иначе числа скачут
     по столбцам и календарь перестаёт читаться с одного взгляда. */
  function cells(first) {
    const out = [];
    const lead = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    const today = S().today();

    for (let i = 0; i < lead; i++) out.push(U().h('div.cal-cell.empty'));

    for (let n = 1; n <= daysInMonth; n++) {
      const date = new Date(first.getFullYear(), first.getMonth(), n);
      out.push(cell(S().localDate(date), n, S().localDate(date) === today));
    }
    return out;
  }

  function cell(dateStr, num, isToday) {
    const u = U(), h = u.h;
    const found = S().dayAt(dateStr);
    const isShopDay = S().weekStart(dateStr) === dateStr;
    const week = found ? found.plan : S().weekAt(S().weekStart(dateStr));

    const classes = ['cal-cell'];
    if (isToday) classes.push('today');
    if (openDay === dateStr) classes.push('open');
    if (!found) classes.push('blank');
    if (isShopDay && week) classes.push('shop');

    const kids = [h('span.cal-num', { text: String(num) })];

    if (isShopDay && week) {
      // Сумма на дне закупки — стоимость списка именно этой недели,
      // а не доля от месяца: в магазин идут с ней.
      kids.push(h('span.cal-shop', { text: u.money(week.cost || 0) }));
    }

    if (found) {
      const meals = found.day.meals.filter(m => m.recipe);
      kids.push(h('span.cal-meals', {},
        meals.map(m => h('span.cal-meal', { title: m.recipe.n, text: MEAL_ICONS[m.slot] || '•' }))));
      kids.push(h('span.cal-kcal', { text: dayKcal(found) + ' ккал' }));
    }

    return h('button.' + classes.join('.'), {
      type: 'button',
      onclick: function () {
        openDay = (openDay === dateStr) ? null : dateStr;
        U().refresh();
      }
    }, kids);
  }

  /* Калории дня — либо на всех, либо на выбранного едока. Личная доля берётся
     из раскладки приёма пищи по людям, а не делением поровну: нормы разные. */
  function dayKcal(found) {
    if (whoseView === 'all') return Math.round((found.day.nutrition || {}).kcal || 0);
    let sum = 0;
    found.day.meals.forEach(function (meal) {
      if (!meal.recipe) return;
      const portions = P().mealPortions(found.plan, meal);
      const mine = portions.find(x => x.name === personName(whoseView));
      if (mine) sum += mine.kcal;
    });
    return Math.round(sum);
  }

  function personName(id) {
    const p = (S().get().people || []).find(x => x.id === id);
    return p ? p.name : '';
  }

  function legend() {
    const u = U(), h = u.h;
    return h('div.cal-legend', {}, [
      h('span', {}, [h('i.dot.shop'), 'день закупки и сумма на неё']),
      h('span', {}, [h('i.dot.today'), 'сегодня']),
      h('span', {}, [h('i.dot.blank'), 'неделя ещё не собрана'])
    ]);
  }

  /* Собрать недостающие недели показанного месяца.
     Каждая считается тем же движком, поэтому кнопка честно предупреждает,
     сколько их и что это займёт время. */
  function weekActions(first) {
    const u = U(), h = u.h;
    const missing = missingWeeks(first);
    if (!missing.length) {
      return h('p.hint', { text: 'Весь месяц собран. Нажмите на день, чтобы увидеть, что в нём.' });
    }
    return h('div.row-actions', {}, [
      u.button('Собрать недели этого месяца (' + missing.length + ')', function () {
        u.busy('Собираю ' + missing.length + ' нед. …', function () {
          missing.forEach(function (startDate) {
            const plan = P().generate({ startDay: startDate });
            S().setWeek(startDate, plan);
          });
          u.refresh();
          u.toast('Собрано недель: ' + missing.length);
        });
      }, 'primary'),
      h('p.hint', { text: 'Каждая неделя считается отдельно — по своей закупке и своей кладовой. ' +
        'Так работает движок, и это не упрощение: закупка живёт неделей.' })
    ]);
  }

  /* Недели, которые задевают показанный месяц и ещё не собраны. */
  function missingWeeks(first) {
    const out = [];
    const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
    let cursor = S().weekStart(S().localDate(first));
    const edge = S().weekStart(S().localDate(last));
    let guard = 0;
    while (cursor <= edge && guard++ < 10) {
      if (!S().weekAt(cursor)) out.push(cursor);
      const next = new Date(cursor + 'T00:00:00');
      next.setDate(next.getDate() + 7);
      cursor = S().localDate(next);
    }
    return out;
  }

  // ---------------------------------------------------------------- день

  function hintCard() {
    const u = U(), h = u.h;
    return u.card('Как это читать', [
      h('p', { text: 'Каждая клетка — день. Значки под числом: что едят, по приёмам пищи. ' +
        'Понедельник помечен как день закупки — на нём стоит сумма, с которой идти в магазин.' }),
      h('p.hint', { text: 'Кружочки сверху переключают взгляд: нажмите на человека — ' +
        'и калории будут показаны его, а не общие на всех.' })
    ]);
  }

  function dayCard(dateStr) {
    const u = U(), h = u.h;
