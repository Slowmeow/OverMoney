    const found = S().dayAt(dateStr);
    const d = new Date(dateStr + 'T12:00:00');
    const title = d.getDate() + ' ' + MONTHS[d.getMonth()] + ', ' + fullWeekday(d);

    if (!found) {
      return u.card(title, [
        h('p', { text: 'Эта неделя ещё не собрана.' }),
        h('div.row-actions', {}, u.button('Собрать эту неделю', function () {
          const start = S().weekStart(dateStr);
          u.busy('Собираю неделю…', function () {
            S().setWeek(start, P().generate({ startDay: start }));
            u.refresh();
            u.toast('Неделя собрана');
          });
        }, 'primary'))
      ]);
    }

    return u.card(title, [
      ...found.day.meals.filter(m => m.recipe).map(m => mealRow(found.plan, m)),
      dayFooter(found)
    ], 'day-card');
  }

  function fullWeekday(d) {
    const names = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
    return names[d.getDay()];
  }

  /* Блюдо в раскрытом дне.
   *
   * Состав спрятан под нажатие намеренно: в списке из четырёх приёмов пищи
   * развёрнутые ингредиенты — это простыня, в которой не видно главного,
   * то есть что вообще едят. КБЖУ же стоит сразу под названием, потому что
   * ради него всё и затевалось. */
  function mealRow(plan, meal) {
    const u = U(), h = u.h;
    const slotName = (window.App.MEALS[meal.slot] || {}).n || meal.slot;
    const portions = P().mealPortions(plan, meal);
    const shown = whoseView === 'all'
      ? null
      : portions.find(x => x.name === personName(whoseView));

    const nut = shown || meal.nutrition || {};
    const weight = shown ? shown.grams : totalWeight(plan, meal);

    const body = h('div.meal-detail', { hidden: true }, [
      h('p.hint', { text: 'Состав на всю кастрюлю:' }),
      h('ul.plain', {}, meal.recipe.ing.map(function (i) {
        const prod = S().productsById()[i.p];
        if (!prod) return null;
        return h('li', { text: prod.n + ' — ' + window.App.shopping.formatAmount(prod, i.g * meal.mult) });
      })),
      meal.recipe.st ? h('p.hint', { text: meal.recipe.st }) : null
    ]);

    return h('div.meal-row', {}, [
      h('button.meal-head', {
        type: 'button',
        onclick: function () { body.hidden = !body.hidden; }
      }, [
        h('span.meal-slot', { text: MEAL_ICONS[meal.slot] || '•' }),
        h('span.meal-main', {}, [
          h('span.meal-name', { text: meal.recipe.n }),
          h('span.meal-nut', {
            text: Math.round(nut.kcal || 0) + ' ккал · Б ' + Math.round(nut.p || 0) +
              ' · Ж ' + Math.round(nut.f || 0) + ' · У ' + Math.round(nut.c || 0) +
              (weight ? ' · ~' + Math.round(weight) + ' г' : '')
          }),
          h('span.meal-who', { text: shown ? shown.name : slotName + ' · на всех' })
        ]),
        // Кто это ест — видно кружочками, как в сетке.
        h('span.meal-eaters', {}, portions.map(p2 =>
          h('span.eater-mini' + (shown && p2.name === shown.name ? '.on' : ''), {
            title: p2.name, text: initials(p2.name)
          })))
      ]),
      body
    ]);
  }

  function totalWeight(plan, meal) {
    const byId = S().productsById();
    return meal.recipe.ing.reduce(function (sum, i) {
      const p = byId[i.p];
      return p ? sum + i.g * meal.mult * (1 - (p.wst || 0)) : sum;
    }, 0);
  }

  function dayFooter(found) {
    const u = U(), h = u.h;
    const cost = P().dayCost(found.plan, found.day);
    const isShopDay = S().weekStart(found.day.date) === found.day.date;

    return h('div.day-foot', {}, [
      h('p.hint', { text: 'Еда этого дня обходится примерно в ' + u.money(cost) +
        '. Это доля от закупки на неделю, а не отдельный поход в магазин.' }),
      isShopDay
        ? h('div.row-actions', {}, u.button('Список покупок на эту неделю', function () {
            u.go('list');
          }, 'primary'))
        : null
    ]);
  }

  window.App = window.App || {};
  window.App.views = window.App.views || {};
  window.App.views.calendar = { title: 'Календарь', render: render };
})();

/* ===== js/ui/view-dashboard.js ===== */
/* Обзор: куда уходит бюджет, попадаем ли в норму, что приложение изменило ради денег. */
(function () {
  'use strict';

  const U = () => window.App.ui;
  const S = () => window.App.store;

  function render() {
    const u = U(), h = u.h;
    const state = S().get();
    const budget = S().weeklyBudget();
    const plan = state.plan;

    return h('div.view', {}, [
      warnings(),
      budgetCard(budget),
      plan ? planCard(plan, budget) : emptyPlanCard(),
      plan ? u.overspendCard() : null,
      plan ? nutritionCard(plan) : null,
      plan ? adjustmentsCard(plan) : null
    ]);
  }

  function warnings() {
    const u = U(), h = u.h;
    const state = S().get();
    const items = [];

    /* Первым делом — можно ли вообще что-то запомнить.
       Так бывает, когда файл открыт прямо из мессенджера: страница живёт
       по адресу content://, браузер хранилища для неё не даёт, и вся работа
       пропадает при закрытии вкладки. Молчать об этом нельзя — приложение
       выглядит совершенно рабочим до самого конца. */
    if (!S().storageAvailable()) {
      items.push(warn('Браузер не даёт этой странице ничего сохранить — всё пропадёт ' +
        'при закрытии вкладки. Так бывает, если файл открыт прямо из мессенджера. ' +
        'Сохраните overmoney.html в «Загрузки» и откройте оттуда, либо работайте ' +
        'через компьютер.',
        'Выгрузить копию', () => window.App.ui.go('settings')));
    }

    if (state.people.some(p => p.needsSetup)) {
      items.push(warn('Профили не заполнены — нормы считаются по значениям по умолчанию.',
        'Заполнить', () => window.App.ui.go('settings')));
    }

    // Диета может срезать столько блюд, что неделя выродится в три повтора.
    // Сказать об этом надо заранее, а не показывать скудное меню молча.
    const diets = S().activeDiets();
    if (diets.length) {
      const left = S().recipeAvailability();
      const thin = Object.keys(left).filter(function (slot) {
        const eats = state.people.some(p => (p.meals || []).indexOf(slot) !== -1);
        return eats && left[slot] < 6;
      });
      if (thin.length) {
        const names = thin.map(s2 => window.App.MEALS[s2].n.toLowerCase()).join(', ');
        items.push(warn('Ограничения оставили мало вариантов: ' + names +
          '. Меню будет однообразным — снимите часть запретов или добавьте свои рецепты.',
          'К ограничениям', () => window.App.ui.go('settings')));
      }
    }

    const stale = S().products().filter(p => S().isStale(p) && !state.excluded[p.id]);
    if (stale.length) {
      items.push(warn('Цены не проверены: ' + stale.length + ' поз. Пока это оценка, а не ваш чек.',
        'Проверить цены', () => window.App.ui.go('prices')));
    }

    return items.length ? h('div.warn-stack', {}, items) : null;
  }

  function warn(text, actionLabel, onClick) {
    const u = U(), h = u.h;
    return h('div.warn', {}, [
      h('span.warn-text', { text: text }),
      u.button(actionLabel, onClick, 'small')
    ]);
  }

  function budgetCard(b) {
    const u = U(), h = u.h;
    const s = S().get().settings;
    const periodName = s.period === 'month' ? 'месяц' : 'неделю';

    const rows = [
      ['Бюджет на ' + periodName, u.money(s.budget), 'total'],
      ['В пересчёте на неделю', u.money(b.gross), ''],
      ['− еда вне дома', '−' + u.money(b.outside), 'minus'],
      ['− регулярное и бытовое', '−' + u.money(b.regulars), 'minus'],
      ['На продукты в неделю', u.money(b.food), 'result']
    ];

    return u.card('Бюджет', [
      h('table.kv', {}, h('tbody', {}, rows.map(r =>
        h('tr' + (r[2] ? '.' + r[2] : ''), {}, [
          h('td', { text: r[0] }),
          h('td.num', { text: r[1] })
        ])
      ))),
      h('p.hint', { text: 'Бытовая химия и еда вне дома вычитаются из бюджета до планирования меню — ' +
        'иначе список продуктов «влезал» бы в сумму, которой на самом деле нет.' })
    ]);
  }

  function emptyPlanCard() {
    const u = U(), h = u.h;
    return u.card('Плана пока нет', [
      h('p', { text: 'Соберите неделю: приложение подберёт блюда под ваши калории и БЖУ, ' +
        'вычтет то, что уже лежит дома, и подгонит стоимость под бюджет.' }),
      u.button('Собрать неделю', function () { window.App.ui.generate(); }, 'primary')
    ]);
  }

  function planCard(plan, budget) {
    const u = U(), h = u.h;
    const limit = budget.food;
    const diff = limit - plan.cost;
    const over = diff < 0;
    const ratio = limit > 0 ? plan.cost / limit : 0;

    return u.card('Неделя на ' + u.money(plan.cost), [
      h('div.big-figure' + (over ? '.over' : '.under'), {}, [
        h('span.big-num', { text: (over ? '−' : '+') + u.money(Math.abs(diff)) }),
        h('span.big-cap', { text: over ? 'не хватает до бюджета' : 'остаётся свободным' })
      ]),
      h('div.bar-track.wide', {}, h('div.bar-fill.' + (over ? 'high' : 'ok'), {
        style: { width: Math.min(100, ratio * 100) + '%' }
      })),
      h('p.hint', { text: 'Стоимость посчитана по целым упаковкам и с вычетом кладовой: ' +
        'это сумма в кассе, а не сумма граммов из рецептов.' }),
      plan.notes.length ? h('div.note', {}, plan.notes.map(n => h('p', { text: n }))) : null,
      h('div.row-actions', {}, [
        u.budgetActions(),
        u.button('Открыть список покупок', () => window.App.ui.go('list'), over ? null : 'primary'),
        u.button('Посмотреть меню', () => window.App.ui.go('week')),
        u.button('Пересобрать неделю', () => window.App.ui.generate())
      ]),
      surplusIdeas(plan)
    ]);
  }

  function surplusIdeas(plan) {
    const u = U(), h = u.h;
    const ideas = window.App.planner.upgradeSuggestions(plan);
    if (!ideas.length) return null;
    return h('div.ideas', {}, [
      h('h3', { text: 'Свободные деньги можно потратить так' }),
      h('ul', {}, ideas.map(i => h('li', {
        text: i.from + ' → ' + i.to + '  (+' + i.extra + ' ₽ в неделю)'
      })))
    ]);
  }

  function nutritionCard(plan) {
    const u = U(), h = u.h;
    const avg = plan.nutrition.avgDay;
    const target = plan.targets.daily;

    return u.card('КБЖУ, средний день на всех едоков', [
      u.bar(avg.kcal, target.kcal, 'Калории'),
      u.bar(avg.p, target.p, 'Белки, г'),
      u.bar(avg.f, target.f, 'Жиры, г'),
      u.bar(avg.c, target.c, 'Углеводы, г'),
      h('p.hint', { text: 'Норма — сумма по всем профилям. Разложить по людям можно в настройках, ' +
        'задав каждому свои цифры.' })
    ]);
  }

  function adjustmentsCard(plan) {
    const u = U(), h = u.h;
    if (!plan.swaps.length && !plan.replacements.length) return null;

    const savedTotal = plan.swaps.reduce((s, x) => s + x.saved, 0) +
      plan.replacements.reduce((s, x) => s + (x.saved || 0), 0);

    return u.card('Что приложение изменило ради бюджета', [
      h('p.hint', { text: 'Калории и белок при этих заменах остались в норме — иначе замена откатывалась. ' +
        'Всего сэкономлено ' + u.money(savedTotal) + ' в неделю.' }),
      h('ul.swaps', {}, [
        plan.swaps.map(s => h('li', {}, [
          h('span.swap-from', { text: s.from }),
          h('span.swap-arrow', { text: '→' }),
          h('span.swap-to', { text: s.to }),
          h('span.swap-saved', { text: '−' + u.money(s.saved) })
        ])),
        plan.replacements.filter(r => r.reason === 'budget').map(r => h('li', {}, [
          h('span.swap-from', { text: r.from }),
          h('span.swap-arrow', { text: '→' }),
          h('span.swap-to', { text: r.to }),
          h('span.swap-saved', { text: '−' + u.money(r.saved || 0) })
        ])),
        plan.replacements.filter(r => r.reason === 'protein').map(r => h('li', {}, [
          h('span.swap-to', { text: 'Добавлено ради белка: ' + r.to })
        ]))
      ])
    ]);
  }

  window.App = window.App || {};
  window.App.views = window.App.views || {};
  window.App.views.dashboard = { title: 'Обзор', render: render };
})();

/* ===== js/ui/view-week.js ===== */
/* Меню на неделю: что и когда готовим, сколько это даёт КБЖУ и сколько стоит. */
(function () {
  'use strict';

  const U = () => window.App.ui;
  const S = () => window.App.store;
  const N = () => window.App.nutrition;
  const P = () => window.App.planner;
  const SH = () => window.App.shopping;

  function render() {
    const u = U(), h = u.h;
    const plan = S().get().plan;
    if (!plan) {
      return h('div.view', {}, u.card('Плана нет', [
        h('p', { text: 'Сначала соберите неделю на вкладке «Обзор».' }),
        u.button('Собрать неделю', () => window.App.ui.generate(), 'primary')
      ]));
    }

    const byId = S().productsById();
    return h('div.view', {}, [
      header(plan),
      h('div.week', {}, plan.days.map((day, di) => dayCard(plan, day, di, byId)))
    ]);
  }

  function header(plan) {
    const u = U(), h = u.h;
    const limit = plan.budget ? plan.budget.food : S().weeklyBudget().food;
    const over = plan.cost > limit;
    return u.card(null, [
      h('div.week-head', {}, [
        h('div', {}, [
          h('span.week-cost' + (over ? '.over' : ''), { text: u.money(plan.cost) }),
          h('span.week-cap', { text: ' из ' + u.money(limit) + ' на неделю' })
        ]),
        /* Раньше здесь была своя кнопка «Подогнать под бюджет». Она запускала
           мягкую подгонку повторно — а та уже отработала при сборке плана,
           поэтому находила от силы несколько десятков рублей и выглядела
           сломанной. При этом сообщение всегда рапортовало об успехе.
           Теперь на всех экранах один и тот же набор действий. */
        h('div.row-actions', {}, [
          u.button('Пересобрать', () => window.App.ui.generate()),
          u.budgetActions()
        ])
      ])
    ]);
  }

  function dayCard(plan, day, di, byId) {
    const u = U(), h = u.h;
    const target = plan.targets.daily;
    const nut = day.nutrition || { kcal: 0, p: 0, f: 0, c: 0 };
    const dev = N().deviation(nut.kcal, target.kcal);

    return h('article.day', {}, [
      h('header.day-head', {}, [
        h('h3', { text: day.name }),
        h('span.day-date', { text: formatDate(day.date) }),
        h('span.day-kcal' + (Math.abs(dev) > 10 ? '.warn' : ''), {
          text: nut.kcal + ' ккал · Б ' + Math.round(nut.p) + ' · Ж ' + Math.round(nut.f) + ' · У ' + Math.round(nut.c)
        }),
        h('span.day-cost', { text: u.money(P().dayCost(plan, day)) })
      ]),
      h('div.day-meals', {}, day.meals.map(meal => mealRow(plan, day, di, meal, byId)))
    ]);
  }

  function mealRow(plan, day, di, meal, byId) {
    const u = U(), h = u.h;
    const meals = window.App.MEALS;
    if (!meal.recipe) {
      return h('div.meal.empty', {}, [
        h('span.meal-slot', { text: meals[meal.slot].n }),
        h('span.meal-name', { text: '— не подобрано —' })
      ]);
    }

    const leftover = meal.leftoverOf != null;
    const nut = meal.nutrition || { kcal: 0, p: 0 };
    // Цена по фактическим тратам: с переплатой за упаковки и без того,
    // что взято из кладовой. Сумма по всем блюдам равна списку покупок.
    const cost = P().mealCost(plan, meal);
    const cooksAhead = !leftover && SH().buyMult(meal) > meal.mult * 1.2;

    return h('div.meal' + (leftover ? '.leftover' : ''), {}, [
      h('span.meal-slot', { text: meals[meal.slot].n }),
      h('div.meal-main', {}, [
        h('span.meal-name', { text: meal.recipe.n }),
        h('span.meal-meta', {
          text: (leftover ? 'вчерашнее, готовить не надо · ' : meal.recipe.t + ' мин · ') +
            nut.kcal + ' ккал · Б ' + Math.round(nut.p) + ' · Ж ' + Math.round(nut.f) +
            ' · У ' + Math.round(nut.c) + ' · ' + u.money(cost) +
            (cooksAhead ? ' · готовим сразу на два дня' : '')
        }),
        // Готовим одно блюдо, а нормы разные — значит и в тарелках разное.
        portionsLine(plan, meal)
      ]),
      h('div.meal-actions', {}, [
        // Передаём координаты приёма пищи, а не ссылки: план могла подменить
        // синхронизация, и старая ссылка вела бы в отброшенный объект.
        u.button('Состав', () => showRecipe(di, meal.slot), 'ghost small'),
        leftover ? null : u.button('Заменить', () => showAlternatives(di, meal.slot), 'ghost small')
      ])
    ]);
  }

  /* Кому сколько класть. Показываем только когда едоков больше одного:
     одному человеку эта строка ничего не сообщает. */
  function portionsLine(plan, meal) {
    const u = U(), h = u.h;
    const parts = P().mealPortions(plan, meal);
    if (parts.length < 2) return null;
    return h('span.meal-portions', {}, parts.map(function (x) {
      return h('span.portion', {}, [
        h('span.portion-who', { text: x.name }),
        h('span.portion-amount', { text: '≈' + x.grams + ' г' }),
        h('span.portion-kcal', {
          text: x.kcal + ' ккал · Б ' + x.p + ' · Ж ' + x.f + ' · У ' + x.c
        }),
        h('span.portion-cost', { text: u.money(x.cost) })
      ]);
    }));
  }

  /* Состав блюда — редактируемый: и граммовка, и цена продукта правятся прямо
     здесь. Без этого пришлось бы уходить на другой экран ради одной цифры,
     а увидеть результат — только вернувшись обратно. */
  function showRecipe(dayIndex, slot) {
    const u = U(), h = u.h;
    let byId = S().productsById();
    const plan = S().plan();
    const meal = S().mealAt(dayIndex, slot);
    if (!plan || !meal || !meal.recipe) return;
    const body = h('div.recipe-edit');

    function draw() {
      body.innerHTML = '';
      const mult = meal.mult;
      const nut = N().nutritionOf(meal.recipe.ing.map(i => ({ p: i.p, g: i.g * mult })), byId);
      const cost = P().mealCost(plan, meal);

      const pot = P().potMeals(plan, dayIndex, slot).length;
      body.appendChild(h('p.hint', {
        text: 'Порции пересчитаны под вашу норму: коэффициент ×' + u.num(mult, 2) +
          ' от базового рецепта. Правьте количество и цену — итог пересчитается сразу.' +
          (pot > 1 ? ' Это блюдо готовится на ' + pot + ' дня, поэтому правка применится к обоим.' : '')
      }));

      /* Таблица, а не набор карточек: подписи вроде «₽ / бутылка 900 мл»
         у каждой строки своей длины, и поля разъезжались по горизонтали.
         Одна шапка на всю таблицу выравнивает колонки и заодно освобождает
         место — размер упаковки ушёл в строку под названием. */
      const cells = [
        h('span.rg-head', { text: 'Продукт' }),
        h('span.rg-head.rg-num', { text: 'Нужно' }),
        h('span.rg-head.rg-num', { text: 'Цена, ₽' }),
        h('span.rg-head')
      ];

      meal.recipe.ing.forEach(function (ing, idx) {
        const p = byId[ing.p];
        if (!p) return;
        const grams = ing.g * mult;
        const unit = p.unit === 'ml' ? 'мл' : 'г';

        // Количество правим в том виде, в каком оно на экране, а храним базовое:
        // иначе пользователю пришлось бы делить в уме на коэффициент.
        const gramsInput = h('input.input.rg-input', {
          type: 'number', value: Math.round(grams), min: '0', step: '5',
          'aria-label': 'Сколько нужно, ' + unit + ': ' + p.n,
          onchange: function (e) {
            const value = Math.max(0, parseFloat(e.target.value) || 0);
            meal.recipe.ing[idx].g = mult > 0 ? value / mult : value;
            commit();
          }
        });

        const priceInput = h('input.input.rg-input', {
          type: 'number', value: p.pr, min: '0', step: '1',
          'aria-label': 'Цена за ' + p.pl + ': ' + p.n,
          onchange: function (e) {
            const value = parseFloat(e.target.value);
            if (!(value > 0)) return;
            S().setPrice(p.id, value);
            byId = S().productsById();
            commit();
            u.toast('Цена обновлена: ' + p.n);
          }
        });

        cells.push(
          h('div.rg-name', {}, [
            h('span.recipe-name', { text: p.n }),
            h('span.recipe-meta', {
              text: u.money(grams * S().pricePerBase(p)) + ' · ' + p.pl +
                (p.brand ? ' · ' + p.brand : '')
            })
          ]),
          h('div.rg-field', {}, [gramsInput, h('span.rg-unit', { text: unit })]),
          h('div.rg-field', {}, priceInput),
          u.button('✕', function () {
            meal.recipe.ing.splice(idx, 1);
            commit();
          }, 'ghost small rg-drop')
        );
      });

      body.appendChild(h('div.recipe-grid', {}, cells));

      const parts = P().mealPortions(plan, meal);
      if (parts.length > 1) {
        body.appendChild(h('div.portion-box', {}, [
          h('span.field-label', { text: 'Разложить по тарелкам' }),
          h('div.portion-list', {}, parts.map(function (x) {
            return h('div.portion-row', {}, [
              h('span.portion-who', { text: x.name }),
              h('span.portion-amount', { text: '≈' + x.grams + ' г' }),
              h('span.portion-kcal', {
                text: x.kcal + ' ккал · Б ' + x.p + ' · Ж ' + x.f + ' · У ' + x.c
              }),
              h('span.portion-cost', { text: u.money(x.cost) }),
              h('span.portion-share', { text: Math.round(x.share * 100) + '%' })
            ]);
          })),
          h('span.field-hint', { text: 'Вес приблизительный: считается по съедобной части продуктов, ' +
            'вода в супах в рецепте не указана. Цена делится в той же пропорции, ' +
            'что и порция; изменить её можно, поправив цены продуктов в таблице выше.' })
        ]));
      }

      body.appendChild(h('div.recipe-total', {}, [
        h('span.recipe-nut', { text: nut.kcal + ' ккал · Б ' + Math.round(nut.p) + ' · Ж ' + Math.round(nut.f) + ' · У ' + Math.round(nut.c) }),
        h('span.recipe-cost', { text: u.money(cost) })
      ]));

      body.appendChild(addIngredientRow());
      body.appendChild(h('p.steps', { text: meal.recipe.st }));
    }

    function commit() {
      // Блюдо на два дня хранится двумя копиями, но кастрюля одна:
      // правка обязана дойти до обоих дней.
      P().syncPot(plan, dayIndex, slot);
      P().rebalance(plan, byId);
      plan.cost = SH().costOf(plan);
      savePlan(plan, true);
      draw();
    }

    function addIngredientRow() {
      const products = S().products().filter(p => p.role !== 'nonfood');
      const search = h('input.input', { type: 'search', placeholder: 'Добавить продукт…' });
      const found = h('div.search-results');

      search.addEventListener('input', function () {
        found.innerHTML = '';
        const q = search.value.trim().toLowerCase();
        if (q.length < 2) return;
        products.filter(p => p.n.toLowerCase().indexOf(q) !== -1).slice(0, 6).forEach(function (p) {
          found.appendChild(h('button.candidate-btn', {
            type: 'button', text: p.n + ' · ' + u.money(p.pr) + ' / ' + p.pl,
            onclick: function () {
              const exists = meal.recipe.ing.find(i => i.p === p.id);
              if (exists) exists.g += 50 / (meal.mult || 1);
              else meal.recipe.ing.push({ p: p.id, g: 50 / (meal.mult || 1) });
              commit();
            }
          }));
        });
      });

      return h('div.add-block', {}, [search, found]);
    }

    draw();

    u.modal(meal.recipe.n, body, [
      {
        label: 'Сохранить как свой рецепт', onClick: function () {
          const state = S().get();
          const copy = Object.assign({}, meal.recipe, {
            id: 'my_' + Date.now().toString(36),
            n: meal.recipe.n + ' (мой вариант)',
            ing: meal.recipe.ing.map(i => ({ p: i.p, g: i.g }))
          });
          state.customRecipes.push(copy);
          S().save();
          u.toast('Сохранено — теперь этот вариант будет попадать в меню');
        }
      },
      { label: 'Готово', cls: 'primary' }
    ]);
  }

  function showAlternatives(dayIndex, slot) {
    const u = U(), h = u.h;
    const byId = S().productsById();
    const plan = S().plan();
    const meal = S().mealAt(dayIndex, slot);
    if (!plan || !meal || !meal.recipe) return;
    const di = dayIndex;
    const alternatives = S().recipes()
      .filter(r => r.m.indexOf(meal.slot) !== -1 && r.id !== meal.recipe.id)
      .map(function (r) {
        const nut = N().recipeNutrition(r, byId);
        const slotTarget = P().targetsOf(plan)[meal.slot] || { kcal: 0 };
        const mult = slotTarget.kcal / Math.max(1, nut.total.kcal);
        return { r: r, nut: nut, mult: mult, cost: P().recipeCost(r, byId, mult) };
      })
      .sort((a, b) => a.cost - b.cost);

    const currentCost = P().recipeCost(meal.recipe, byId, SH().buyMult(meal));

    const list = h('div.alt-list', {}, alternatives.map(function (a) {
      const delta = a.cost - currentCost;
      return h('button.alt', {
        type: 'button',
        onclick: function () {
          applyReplacement(dayIndex, slot, a.r);
          document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
        }
      }, [
        h('span.alt-name', { text: a.r.n }),
        h('span.alt-meta', {
          text: Math.round(a.nut.perServing.kcal) + ' ккал/порция · белок ' +
            Math.round(a.nut.total.p / a.r.sv) + ' г · ' + a.r.t + ' мин'
        }),
        h('span.alt-cost' + (delta < 0 ? '.cheaper' : delta > 0 ? '.pricier' : ''), {
          text: u.money(a.cost) + (delta === 0 ? '' : ' (' + (delta > 0 ? '+' : '−') + u.money(Math.abs(delta)) + ')')
        })
      ]);
    }));

    u.modal('Чем заменить: ' + meal.recipe.n, [
      h('p.hint', { text: 'Цена указана за то же количество калорий — сравнение честное, а не «за порцию».' }),
      list
    ], [{ label: 'Отмена' }]);
  }

  function applyReplacement(dayIndex, slot, recipe) {
    const u = U();
    const byId = S().productsById();
    const plan = S().plan();
    const meal = S().mealAt(dayIndex, slot);
    if (!plan || !meal) return;
    const di = dayIndex;
    // Если у блюда был второй день — снимаем его, иначе останется висеть вчерашнее.
    plan.days.forEach(function (day) {
      day.meals.forEach(function (m) {
        if (m.leftoverOf === di && m.slot === meal.slot) { m.recipe = null; m.leftoverOf = null; }
      });
    });

    meal.recipe = Object.assign({}, recipe, { ing: recipe.ing.map(i => ({ p: i.p, g: i.g })) });

    const settings = S().get().settings;
    if (settings.batchTwoDays && recipe.batch && plan.days[di + 1]) {
      const twin = plan.days[di + 1].meals.find(m => m.slot === meal.slot && !m.recipe);
      if (twin) { twin.recipe = Object.assign({}, recipe, { ing: recipe.ing.map(i => ({ p: i.p, g: i.g })) }); twin.leftoverOf = di; }
    }

    P().rebalance(plan, byId);
    P().refillEmpty(plan, P().makeCtx(), byId); // если сняли «второй день», слот не должен остаться пустым
    plan.cost = SH().costOf(plan);
    savePlan(plan);
    u.toast('Заменено · неделя теперь ' + u.money(plan.cost));
  }

  function savePlan(plan, keepScreen) {
    const state = S().get();
    state.plan = plan;
    S().save();
    // При правке внутри модалки экран не трогаем: перерисовка закрыла бы окно
    // вместе с полем, в котором человек сейчас печатает.
    if (!keepScreen) window.App.ui.refresh();
  }

  function formatDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.getDate() + '.' + String(d.getMonth() + 1).padStart(2, '0');
  }

  window.App = window.App || {};
  window.App.views = window.App.views || {};
  window.App.views.week = { title: 'Неделя', render: render };
})();

/* ===== js/ui/view-list.js ===== */
/* Список покупок: что взять, сколько это стоит и что уже есть дома. */
(function () {
  'use strict';

  const U = () => window.App.ui;
  const S = () => window.App.store;
  const SH = () => window.App.shopping;

  function render() {
    const u = U(), h = u.h;
    const state = S().get();
    const plan = state.plan;

    if (!plan) {
      return h('div.view', {}, u.card('Списка нет', [
        h('p', { text: 'Список появится, как только будет собрана неделя.' }),
        u.button('Собрать неделю', () => window.App.ui.generate(), 'primary')
      ]));
    }

    const list = SH().buildList(plan);
    const budget = S().weeklyBudget();

    return h('div.view', {}, [
      summary(list, budget, plan),
      u.overspendCard(list.total),
      h('div.list-groups', {}, list.byCategory.map(group => groupCard(group))),
      pantryCovered(list),
      regularsCard(),
      finishCard(plan, list)
    ]);
  }

  function summary(list, budget, plan) {
    const u = U(), h = u.h;
    const diff = budget.food - list.total;
    return u.card('Итого ' + u.money(list.total), [
      h('div.summary-grid', {}, [
        stat('Бюджет на продукты', u.money(budget.food)),
        stat(diff >= 0 ? 'Остаётся' : 'Не хватает', u.money(Math.abs(diff)), diff >= 0 ? 'good' : 'bad'),
        stat('Сэкономлено кладовой', u.money(list.savedByPantry), 'good'),
        stat('Позиций купить', String(list.byCategory.reduce((s, g) => s + g.items.length, 0)))
      ]),
      h('p.hint', { text: 'Цены с пометкой ~ ещё не проверялись вами. Поправьте их прямо в списке ' +
        'после закупки — приложение запомнит и следующая неделя посчитается точнее.' }),
      h('div.row-actions', {}, [
        u.budgetActions(),
        u.button('Печать / PDF', () => window.print()),
        u.button('Скопировать текстом', copyAsText)
      ])
    ]);
  }

  function stat(label, value, tone) {
    const u = U(), h = u.h;
    return h('div.stat' + (tone ? '.' + tone : ''), {}, [
      h('span.stat-value', { text: value }),
      h('span.stat-label', { text: label })
    ]);
  }

  function groupCard(group) {
    const u = U(), h = u.h;
    const state = S().get();

    return h('section.card.list-group', {}, [
      h('h2.card-title', {}, [
        h('span', { text: group.name }),
        h('span.group-sum', { text: u.money(group.sum) })
      ]),
      h('div.card-body', {}, group.items.map(function (item) {
        const id = item.product.id;
        const checked = !!state.listState[id];

        const priceBox = u.numberInput(item.product.pr, function (value) {
          if (value <= 0) return;
          S().setPrice(id, value);
          u.toast('Цена обновлена: ' + item.product.n);
          window.App.ui.refresh();
        }, { step: '1', min: '0', class: 'input price-input' });

        return h('div.item' + (checked ? '.done' : ''), {}, [
          h('input.check', {
            type: 'checkbox', checked: checked,
            onchange: function (e) {
              if (e.target.checked) state.listState[id] = true;
              else delete state.listState[id];
              S().save();
              window.App.ui.refresh();
            }
          }),
          h('div.item-main', {}, [
            h('span.item-name', { text: item.product.n }),
            h('span.item-meta', {
              text: SH().formatPurchase(item) +
                (item.fromPantry > 0 ? ' · дома уже есть ' + SH().formatMass(item.product, item.fromPantry) : '') +
                (item.leftover > 20 ? ' · останется ' + SH().formatMass(item.product, item.leftover) : '')
            })
          ]),
          h('div.item-price', {}, [
            h('span.item-cost', { text: (item.stale ? '~' : '') + u.money(item.cost) }),
            h('label.price-edit', {}, [
              h('span', { text: 'цена за ' + item.product.pl }),
              priceBox
            ])
          ])
        ]);
      }))
    ]);
  }

  function pantryCovered(list) {
    const u = U(), h = u.h;
    const covered = list.items.filter(i => i.fromPantry > 0);
    if (!covered.length) return null;

    return u.card('Берём из кладовой, покупать не нужно', [
      h('ul.plain', {}, covered.map(i => h('li', {
        text: i.product.n + ' — ' + SH().formatMass(i.product, i.fromPantry) +
          (i.remaining > 0.5 ? ' (не хватает ' + SH().formatMass(i.product, i.remaining) + ', это в списке выше)' : '')
      }))),
      h('p.hint', { text: 'Итого не потрачено: ' + u.money(list.savedByPantry) + '.' })
    ], 'muted');
  }

  function regularsCard() {
    const u = U(), h = u.h;
    const reg = S().regularsWeeklyCost();
    if (!reg.items.length) return null;

    return u.card('Регулярное и бытовое', [
      h('p.hint', { text: 'Это не привязано к меню — берите по мере окончания. ' +
        'В бюджете уже зарезервировано ' + u.money(reg.total) + ' в неделю.' }),
      h('ul.plain', {}, reg.items.map(i => h('li', {
        text: i.product.n + ' — ' + i.product.pl + ', ' + u.money(i.product.pr) +
          ' (≈' + u.money(i.cost) + ' в неделю)'
      })))
    ], 'muted');
  }

  function finishCard(plan, list) {
    const u = U(), h = u.h;
    const R = window.App.receipt;

    return u.card('После закупки', [
      h('p', { text: 'Нажмите, когда вернётесь из магазина: остатки от начатых упаковок ' +
        'перейдут в кладовую, и следующая неделя будет дешевле на их стоимость.' }),
      h('div.row-actions', {}, [
        u.button('Закупка завершена', () => finish(plan, list), 'primary'),
        u.button('Внести чек', () => receiptDialog(plan, list))
      ]),
      h('p.hint', { text: R && R.canScan()
        ? 'Чек можно отсканировать: из QR-кода приложение возьмёт дату и сумму по кассе.'
        : 'Этот браузер не умеет читать QR-коды — сумму и дату с чека можно вписать вручную.' })
    ]);
  }

  /* Внесение чека.
   *
   * Из QR берутся только дата и сумма: списка товаров в коде нет, его отдаёт
   * лишь сервис ФНС, которому нужны интернет и авторизация. Обещать разбор
   * позиций было бы враньём. Зато позиции у нас уже есть — в этом самом
   * списке покупок, — поэтому сверка сводится к галочкам и правке цен,
   * а расхождение с суммой чека видно сразу. */
  function receiptDialog(plan, list) {
    const u = U(), h = u.h;
    const R = window.App.receipt;
    const state = S().get();

    let parsed = null;
    let camera = null;

    const dateInput = h('input.input', { type: 'date', value: S().today() });
    const sumInput = h('input.input', { type: 'number', min: '0', step: '1', value: list.total });
    const qrInput = h('input.input', { type: 'search', placeholder: 't=20260824T1830&s=3155.00&fn=…' });
    const status = h('p.hint', { text: 'Дата и сумма заполнены расчётными значениями — поправьте по чеку.' });
    const video = h('video.receipt-video', { playsinline: 'true', muted: 'true' });

    function applyParsed(text) {
      parsed = R.parseQr(text);
      if (!parsed) {
        status.textContent = 'Это не похоже на фискальный QR-код. Впишите дату и сумму вручную.';
        return;
      }
      if (parsed.date) dateInput.value = parsed.date;
      if (parsed.sum) sumInput.value = parsed.sum;
      status.textContent = 'Чек распознан: ' + (parsed.date || '') + ' ' + (parsed.time || '') +
        ', сумма ' + u.money(parsed.sum || 0) + '. Позиции сверьте ниже — в QR их нет.';
    }

    const fileInput = h('input', {
      type: 'file', accept: 'image/*', style: { display: 'none' },
      onchange: function (e) {
        const file = e.target.files[0];
        if (!file) return;
        status.textContent = 'Читаю фотографию…';
        R.scanImage(file).then(applyParsed).catch(err => { status.textContent = err.message; });
      }
    });

    // Позиции берём из своего же списка: отмечено — значит куплено.
    const lines = [];
    list.byCategory.forEach(function (group) {
      group.items.forEach(function (item) {
        const id = item.product.id;
        const row = { id: id, item: item, bought: state.listState[id] !== false };
        const priceBox = h('input.input.rg-input', {
          type: 'number', min: '0', step: '1', value: item.product.pr,
          onchange: function (e) {
            const value = parseFloat(e.target.value);
            if (value > 0) S().setPrice(id, value);
          }
        });
        const check = h('input.check', {
          type: 'checkbox', checked: row.bought,
          onchange: function (e) { row.bought = e.target.checked; }
        });
        row.priceBox = priceBox;
        lines.push(row);
        row.node = h('div.receipt-row', {}, [
          check,
          h('span.receipt-name', { text: item.product.n }),
          h('span.receipt-qty', { text: SH().formatPurchase(item) }),
          priceBox
        ]);
      });
    });

    const body = [
      h('div.row-actions', {}, [
        R.canScan() ? u.button('Сканировать камерой', function () {
          status.textContent = 'Наведите камеру на QR-код чека…';
          video.style.display = 'block';
          camera = R.scanCamera(video);
          camera.result.then(function (text) {
            camera.stop();
            video.style.display = 'none';
            applyParsed(text);
          }).catch(function (err) {
            camera.stop();
            video.style.display = 'none';
            status.textContent = err.message;
          });
        }) : null,
        R.canScan() ? u.button('Загрузить фото чека', () => fileInput.click()) : null
      ]),
      video,
      fileInput,
      u.field('Строка из QR-кода', qrInput, 'если сканировали чек другим приложением — вставьте сюда'),
      u.button('Разобрать строку', () => applyParsed(qrInput.value), 'small'),
      status,
      h('div.form-grid', {}, [
        u.field('Дата чека', dateInput),
        u.field('Сумма по чеку, ₽', sumInput)
      ]),
      h('h4.sub-head', { text: 'Что из списка куплено' }),
      h('p.hint', { text: 'Снимите галочку с того, что не брали, и поправьте цены. ' +
        'Списка товаров в QR-коде нет — его отдаёт только сервис ФНС, а он требует интернета и входа.' }),
      h('div.receipt-list', {}, lines.map(l => l.node))
    ];

    const dlg = u.modal('Внести чек', body, [
      { label: 'Отмена', onClick: function () { if (camera) camera.stop(); } },
      {
        label: 'Записать', cls: 'primary', onClick: function () {
          if (camera) camera.stop();
          const actual = parseFloat(sumInput.value) || list.total;
          const date = dateInput.value || S().today();

          // Не купленное остаётся в списке: план на него по-прежнему рассчитан.
          lines.forEach(function (l) {
            if (l.bought) state.listState[l.id] = true;
            else delete state.listState[l.id];
          });

          const fresh = SH().buildList(plan);
          const byCat = {};
          fresh.byCategory.forEach(g => { byCat[g.cat] = g.sum; });

          state.pantry = SH().pantryAfter(plan, fresh);
          state.history.push({
            date: date,
            planned: fresh.total,
            actual: actual,
            budget: S().weeklyBudget().food,
            kcal: plan.nutrition ? plan.nutrition.week.kcal : null,
            protein: plan.nutrition ? plan.nutrition.week.p : null,
            byCat: byCat,
            receipt: parsed ? { fn: parsed.fn, doc: parsed.doc, sign: parsed.sign } : null
          });
          state.listState = {};
          S().save();

          const diff = Math.round(actual - fresh.total);
          u.toast(Math.abs(diff) < 20
            ? 'Чек записан, сходится с расчётом'
            : 'Чек записан: ' + (diff > 0 ? 'на ' + u.money(diff) + ' больше' : 'на ' + u.money(-diff) + ' меньше') + ' расчёта');
          window.App.ui.go('reports');
        }
      }
    ]);

    return dlg;
  }

  function finish(plan, list) {
    const u = U(), h = u.h;
    const computed = list.total;
    const inputEl = u.numberInput(computed, () => {}, { step: '1', min: '0' });

    u.modal('Сколько получилось по чеку?', [
      h('p.hint', { text: 'Расчётная сумма — ' + u.money(computed) + '. ' +
        'Если в чеке другая цифра, впишите её: она попадёт в историю и покажет, ' +
        'насколько план расходится с реальностью.' }),
      u.field('Фактическая сумма, ₽', inputEl)
    ], [
      { label: 'Отмена' },
      {
        label: 'Записать', cls: 'primary', onClick: function () {
          const state = S().get();
          const actual = parseFloat(inputEl.value) || computed;

          state.pantry = SH().pantryAfter(plan, list);

          // Сохраняем не только сумму: без калорий, белка и разбивки по отделам
          // потом невозможно построить ни структуру трат, ни стоимость калории.
          const byCat = {};
          list.byCategory.forEach(g => { byCat[g.cat] = g.sum; });

          state.history.push({
            date: S().today(),
            planned: computed,
            actual: actual,
            budget: S().weeklyBudget().food,
            kcal: plan.nutrition ? plan.nutrition.week.kcal : null,
            protein: plan.nutrition ? plan.nutrition.week.p : null,
            byCat: byCat
          });
          state.listState = {};
          S().save();
          u.toast('Записано. Остатки перенесены в кладовую.');
          window.App.ui.go('pantry');
        }
      }
    ]);
  }

  function copyAsText() {
    const u = U();
    const plan = S().get().plan;
    const list = SH().buildList(plan);
    const lines = [];
    list.byCategory.forEach(function (g) {
      lines.push('— ' + g.name + ' —');
      g.items.forEach(i => lines.push('  ' + i.product.n + ': ' + SH().formatPurchase(i) + ' — ' + Math.round(i.cost) + ' ₽'));
    });
    lines.push('');
    lines.push('Итого: ' + list.total + ' ₽');

    const text = lines.join('\n');
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => u.toast('Список скопирован'));
    } else {
      u.modal('Список покупок', window.App.ui.h('pre.pre', { text: text }), [{ label: 'Закрыть' }]);
    }
  }

  window.App = window.App || {};
  window.App.views = window.App.views || {};
  window.App.views.list = { title: 'Список', render: render };
})();

/* ===== js/ui/view-pantry.js ===== */
/* Кладовая: что уже есть дома. Всё отсюда вычитается из списка покупок,
   и на это же приложение ориентируется, когда подбирает блюда. */
(function () {
  'use strict';

  const U = () => window.App.ui;
  const S = () => window.App.store;
  const SH = () => window.App.shopping;

  let query = '';

  function render() {
    const u = U(), h = u.h;
    const state = S().get();
    const byId = S().productsById();
    const ids = Object.keys(state.pantry).filter(id => byId[id]);

    const value = ids.reduce((sum, id) => sum + state.pantry[id] * S().pricePerBase(byId[id]), 0);

    return h('div.view', {}, [
      u.card('Что есть дома', [
        h('p.hint', { text: 'Отметьте продукты, которые уже лежат в холодильнике и шкафу. ' +
          'Приложение вычтет их из списка покупок и постарается собрать меню вокруг них, ' +
          'чтобы ничего не пропало.' }),
        addRow(byId)
      ]),
      ids.length ? u.card('В кладовой на ' + u.money(value), [
        h('div.pantry-list', {}, ids
          .sort((a, b) => byId[a].n.localeCompare(byId[b].n, 'ru'))
          .map(id => pantryRow(byId[id], state.pantry[id]))),
        h('div.row-actions', {}, [
          u.button('Пересобрать неделю с учётом кладовой', () => window.App.ui.generate(), 'primary'),
          u.button('Очистить всё', function () {
            if (!confirm('Убрать все записи из кладовой?')) return;
            state.pantry = {};
            S().save();
            window.App.ui.refresh();
          }, 'ghost')
        ])
      ]) : u.card('Кладовая пуста', [
        h('p', { text: 'Пока приложение считает, что дома нет ничего, и включает в список все продукты из меню.' })
      ], 'muted'),
      leftoversHint()
    ]);
  }

  function addRow(byId) {
    const u = U(), h = u.h;
    const products = S().products().filter(p => p.role !== 'nonfood');

    const search = h('input.input', {
      type: 'search', placeholder: 'Найти продукт: картофель, гречка, яйца…',
      value: query,
      oninput: function (e) {
        query = e.target.value;
        renderResults();
      }
    });

    const results = h('div.search-results');

    function renderResults() {
      results.innerHTML = '';
      const q = query.trim().toLowerCase();
      if (q.length < 2) {
        results.appendChild(h('p.hint', { text: 'Введите хотя бы две буквы.' }));
        return;
      }
      const found = products.filter(p => p.n.toLowerCase().indexOf(q) !== -1).slice(0, 12);
      if (!found.length) {
        results.appendChild(h('p.hint', { text: 'Ничего не нашлось. Добавить свой продукт можно на вкладке «Цены».' }));
        return;
      }
      found.forEach(p => results.appendChild(addCandidate(p)));
    }

    renderResults();
    return h('div.add-block', {}, [search, results]);
  }

  function addCandidate(product) {
    const u = U(), h = u.h;
    const units = unitOptions(product);
    let unit = units[0].value;

    const amount = h('input.input.small-input', { type: 'number', value: 1, min: '0', step: '0.1' });
    const unitSel = u.select(units, unit, v => { unit = v; });

    return h('div.candidate', {}, [
      h('span.candidate-name', { text: product.n }),
      amount,
      unitSel,
      u.button('Добавить', function () {
        const value = parseFloat(amount.value) || 0;
        if (value <= 0) return;
        S().pantryAdd(product.id, value * unitFactor(product, unit));
        u.toast(product.n + ' — добавлено в кладовую');
        window.App.ui.refresh();
      }, 'small primary')
    ]);
  }

  function unitOptions(product) {
    const base = product.unit === 'ml' ? 'мл' : 'г';
    const big = product.unit === 'ml' ? 'л' : 'кг';
    const opts = [];
    if (product.piece) opts.push({ value: 'piece', label: 'шт' });
    if (!product.w) opts.push({ value: 'pack', label: product.pl });
    opts.push({ value: 'big', label: big });
    opts.push({ value: 'base', label: base });
    return opts;
  }

  function unitFactor(product, unit) {
    if (unit === 'piece') return product.piece || 1;
    if (unit === 'pack') return product.pack;
    if (unit === 'big') return 1000;
    return 1;
  }

  function pantryRow(product, grams) {
    const u = U(), h = u.h;
    const value = grams * S().pricePerBase(product);

    const amount = h('input.input.small-input', {
      type: 'number', value: Math.round(grams), min: '0', step: '10',
      onchange: function (e) {
        S().pantrySet(product.id, parseFloat(e.target.value) || 0);
        window.App.ui.refresh();
      }
    });

    return h('div.pantry-row', {}, [
      h('div.pantry-main', {}, [
        h('span.pantry-name', { text: product.n }),
        h('span.pantry-meta', { text: SH().formatAmount(product, grams) + ' · ' + u.money(value) })
      ]),
      amount,
      h('span.unit-tag', { text: product.unit === 'ml' ? 'мл' : 'г' }),
      u.button('Убрать', function () {
        S().pantrySet(product.id, 0);
        window.App.ui.refresh();
      }, 'ghost small')
    ]);
  }

  function leftoversHint() {
    const u = U(), h = u.h;
    return u.card('Откуда здесь берутся продукты сами', [
      h('ul.plain', {}, [
        h('li', { text: 'Вы добавляете вручную — например, привезли овощи с дачи.' }),
        h('li', { text: 'После нажатия «Закупка завершена» сюда падают остатки от начатых упаковок: ' +
          'взяли пачку риса 800 г, по меню ушло 300 г — 500 г остаются здесь и в следующий раз не покупаются.' })
      ])
    ], 'muted');
  }

  window.App = window.App || {};
  window.App.views = window.App.views || {};
  window.App.views.pantry = { title: 'Кладовая', render: render };
})();

/* ===== js/ui/view-prices.js ===== */
/* Цены и каталог. Здесь приложение становится точным: пока цены не выправлены
   по вашим чекам, все суммы — оценка. */
(function () {
  'use strict';

  const U = () => window.App.ui;
  const S = () => window.App.store;

  let filterCat = 'all';
  let search = '';
  let onlyStale = false;

  function render() {
    const u = U(), h = u.h;
    const state = S().get();
    let products = S().products();

    const staleCount = products.filter(p => S().isStale(p)).length;

    if (filterCat !== 'all') products = products.filter(p => p.cat === filterCat);
    if (search.trim().length > 1) {
      const q = search.trim().toLowerCase();
      products = products.filter(p => p.n.toLowerCase().indexOf(q) !== -1);
    }
    if (onlyStale) products = products.filter(p => S().isStale(p));

    products.sort((a, b) => a.n.localeCompare(b.n, 'ru'));

    return h('div.view', {}, [
      u.card('Цены', [
        h('p.hint', { text: 'Стартовые цены — ориентировочные для Пятёрочки и Магнита, они помечены знаком ~. ' +
          'Каждая правка сохраняется с датой; всё старше ' + state.settings.priceStaleDays +
          ' дней снова считается непроверенным. Не проверено сейчас: ' + staleCount + '.' }),
        filters()
      ]),
      u.card(null, [
        h('div.price-list', {}, products.map(row))
      ]),
      u.card('Свой продукт', [
        h('p.hint', { text: 'Если чего-то нет в каталоге — добавьте. Он сразу станет доступен в рецептах, ' +
          'кладовой и в подборе замен.' }),
        u.button('Добавить продукт', addProductDialog, 'primary')
      ])
    ]);
  }

  function filters() {
    const u = U(), h = u.h;
    const cats = [{ value: 'all', label: 'Все категории' }].concat(
      window.App.CATEGORY_ORDER.map(c => ({ value: c, label: window.App.CATEGORIES[c] }))
    );

    return h('div.filters', {}, [
      h('input.input', {
        type: 'search', placeholder: 'Поиск по названию', value: search,
        oninput: function (e) { search = e.target.value; window.App.ui.refresh(); }
      }),
      u.select(cats, filterCat, function (v) { filterCat = v; window.App.ui.refresh(); }),
      h('label.checkline', {}, [
        h('input', {
          type: 'checkbox', checked: onlyStale,
          onchange: function (e) { onlyStale = e.target.checked; window.App.ui.refresh(); }
        }),
        h('span', { text: 'Только непроверенные' })
      ])
    ]);
  }

  function row(product) {
    const u = U(), h = u.h;
    const state = S().get();
    const stale = S().isStale(product);
    const excluded = !!state.excluded[product.id];
    const days = S().daysSince(product.pd);
    const brands = S().brandsOf(product.id);
    const history = S().priceHistory(product.id);

    const priceInput = h('input.input.price-input', {
      type: 'number', value: product.pr, min: '0', step: '1',
      onchange: function (e) {
        const value = parseFloat(e.target.value);
        if (!(value > 0)) return;
        S().setPrice(product.id, value);
        u.toast('Сохранено: ' + product.n);
        window.App.ui.refresh();
      }
    });

    return h('div.price-row' + (excluded ? '.excluded' : ''), {}, [
      h('div.price-main', {}, [
        h('span.price-name', { text: product.n }),
        h('span.price-meta', {
          text: (product.brand ? product.brand + ' · ' : '') + product.pl +
            ' · ' + Math.round(product.k) + ' ккал/100 · Б' + product.p + ' Ж' + product.f + ' У' + product.c
        })
      ]),
      h('div.price-input-wrap', {}, [
        priceInput,
        h('span.price-age' + (stale ? '.stale' : ''), {
          text: product.seed ? 'не проверено' : (days === 0 ? 'сегодня' : days + ' дн. назад')
        })
      ]),
      h('div.price-actions', {}, [
        u.button(brands.length > 1 ? 'Марки · ' + brands.length : 'Марки', () => brandsDialog(product), 'ghost small'),
        history.length ? u.button('История', () => historyDialog(product), 'ghost small') : null
      ]),
      h('label.checkline.tight', {}, [
        h('input', {
          type: 'checkbox', checked: excluded,
          onchange: function (e) {
            if (e.target.checked) state.excluded[product.id] = true;
            else delete state.excluded[product.id];
            S().save();
            window.App.ui.refresh();
          }
        }),
        h('span', { text: 'не предлагать' })
      ])
    ]);
  }

  /* Марки одного продукта: у каждой своя цена и своя упаковка, поэтому
     сравнивать их можно только по цене за килограмм. */
  function brandsDialog(product) {
    const u = U(), h = u.h;
    const state = S().get();
    const brands = S().brandsOf(product.id);
    const chosen = state.brandChoice[product.id];
    const unit = product.unit === 'ml' ? 'л' : 'кг';

    const list = h('div.brand-list', {}, brands.length ? brands
      .slice()
      .sort((a, b) => a.pr / (a.pack || product.pack) - b.pr / (b.pack || product.pack))
      .map(function (b) {
        const pack = b.pack || product.pack;
        const perUnit = b.pr / pack * 1000;
        const isChosen = chosen === (b.brand || '');
        const isCheapest = b === brands.slice().sort((x, y) => x.pr / (x.pack || product.pack) - y.pr / (y.pack || product.pack))[0];

        return h('div.brand-row' + (isChosen ? '.chosen' : ''), {}, [
          h('div.brand-main', {}, [
            h('span.brand-title', { text: b.brand || 'без марки' }),
            h('span.brand-meta', {
              text: b.pr + ' ₽ за ' + Math.round(pack) + (product.unit === 'ml' ? ' мл' : ' г') +
                ' · ' + Math.round(perUnit) + ' ₽/' + unit +
                (b.store ? ' · ' + b.store : '') + ' · ' + b.d
            })
          ]),
          isCheapest && !chosen ? h('span.brand-tag', { text: 'идёт в расчёт' }) : null,
          u.button(isChosen ? 'Выбрана' : 'Брать эту', function () {
            if (isChosen) delete state.brandChoice[product.id];
            else state.brandChoice[product.id] = b.brand || '';
            S().save();
            document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
            window.App.ui.refresh();
          }, isChosen ? 'small primary' : 'small')
        ]);
      }) : h('p.hint', { text: 'Пока ни одной записи. Добавьте первую ниже.' }));

    const f = {};
    const mk = (k, v, attrs) => (f[k] = h('input.input', Object.assign({ value: v }, attrs || {})));
    const stores = (state.stores || []).map(s => ({ value: s, label: s }));
    let store = stores.length ? stores[0].value : '';

    const form = h('div.form-grid', {}, [
      u.field('Марка', mk('brand', ''), 'например, Простоквашино'),
      u.field('Магазин', stores.length ? u.select(stores, store, v => { store = v; }) : mk('store', '')),
      u.field('Цена за упаковку, ₽', mk('pr', product.pr, { type: 'number', min: '0', step: '1' })),
      u.field('Размер упаковки', mk('pack', product.pack, { type: 'number', min: '1' }),
        product.unit === 'ml' ? 'мл' : 'г'),
      u.field('Дата покупки', mk('date', S().today(), { type: 'date' }))
    ]);

    u.modal('Марки: ' + product.n, [
      h('p.hint', { text: 'В расчёты идёт выбранная марка, а если ничего не выбрано — самая дешёвая ' +
        'за ' + unit + '. Цена за упаковку для сравнения не годится: упаковки у марок разные.' }),
      list,
      h('h4.sub-head', { text: 'Записать цену' }),
      form
    ], [
      { label: 'Закрыть' },
      {
        label: 'Записать', cls: 'primary', onClick: function () {
          const price = parseFloat(f.pr.value);
          if (!(price > 0)) { u.toast('Нужна цена', 'bad'); return true; }
          S().recordPrice(product.id, {
            pr: price,
            brand: f.brand.value,
            store: stores.length ? store : (f.store ? f.store.value : ''),
            pack: parseFloat(f.pack.value) || product.pack,
            date: f.date.value || S().today()
          });
          u.toast('Записано: ' + product.n);
          window.App.ui.refresh();
        }
      }
    ]);
  }

  /* График цены во времени: линия на каждую марку. */
  function historyDialog(product) {
    const u = U(), h = u.h;
    const entries = S().priceHistory(product.id);
    const unit = product.unit === 'ml' ? 'л' : 'кг';

    // Группируем по марке — цвет закреплён за маркой, а не за местом в списке.
    const byBrand = {};
    entries.forEach(function (e) {
      const key = e.brand || 'без марки';
      (byBrand[key] = byBrand[key] || []).push({
        x: e.d,
        y: Math.round(e.pr / (e.pack || product.pack) * 1000)
      });
    });

    const names = Object.keys(byBrand).sort();
    // Больше пяти линий не рисуем: соседние станут неразличимы.
    const shown = names.slice(0, 5);
    const series = shown.map((name, i) => ({
      name: name,
      color: window.App.charts.seriesColor(i),
      points: byBrand[name]
    }));

    const chart = window.App.charts.lineChart({
      title: product.n,
      subtitle: 'Цена за ' + unit + ' — так марки с разными упаковками сравнимы между собой.' +
        (names.length > shown.length ? ' Показаны первые ' + shown.length + ' марок из ' + names.length + '.' : ''),
      series: series,
      yFormat: v => window.App.charts.fmtInt(v) + ' ₽',
      height: 230
    });

    u.modal('История цены', chart, [{ label: 'Закрыть' }]);
  }

  function addProductDialog() {
    const u = U(), h = u.h;
    const f = {};
    const mk = (key, value, attrs) => (f[key] = h('input.input', Object.assign({ value: value }, attrs || {})));

    const cats = window.App.CATEGORY_ORDER.map(c => ({ value: c, label: window.App.CATEGORIES[c] }));
    let cat = 'grocery', unit = 'g', weighed = 'no', grp = 'none', role = 'other';

    const groups = [
      { value: 'none', label: 'без замены' },
      { value: 'prot_meat', label: 'мясо и птица' },
      { value: 'prot_fish', label: 'рыба' },
      { value: 'prot_dairy', label: 'творог и сыр' },
      { value: 'prot_legume', label: 'бобовые' },
      { value: 'carb_grain', label: 'крупы' },
      { value: 'carb_pasta', label: 'макароны' },
      { value: 'veg_base', label: 'овощи базовые' },
      { value: 'veg_fresh', label: 'овощи свежие' },
      { value: 'fat_oil', label: 'масло растительное' },
      { value: 'fruit', label: 'фрукты' },
      { value: 'bread', label: 'хлеб' }
    ];
    const roles = [
      { value: 'protein', label: 'источник белка' },
      { value: 'carb', label: 'источник углеводов' },
      { value: 'fat', label: 'источник жиров' },
      { value: 'veg', label: 'овощи' },
      { value: 'fruit', label: 'фрукты' },
      { value: 'other', label: 'прочее' }
    ];

    const body = h('div.form-grid', {}, [
      u.field('Название', mk('n', '')),
      u.field('Категория', u.select(cats, cat, v => { cat = v; })),
      u.field('Единица', u.select([{ value: 'g', label: 'граммы' }, { value: 'ml', label: 'миллилитры' }], unit, v => { unit = v; })),
      u.field('Весовой товар', u.select([{ value: 'no', label: 'нет, пачками' }, { value: 'yes', label: 'да, на развес' }], weighed, v => { weighed = v; })),
      u.field('Размер упаковки', mk('pack', 500, { type: 'number', min: '1' }), 'для весовых укажите 1000 (цена за кг)'),
      u.field('Как выглядит на полке', mk('pl', 'пачка 500 г')),
      u.field('Цена за упаковку, ₽', mk('pr', 100, { type: 'number', min: '0' })),
      u.field('Ккал на 100', mk('k', 0, { type: 'number', min: '0' })),
      u.field('Белки на 100', mk('p', 0, { type: 'number', min: '0', step: '0.1' })),
      u.field('Жиры на 100', mk('f', 0, { type: 'number', min: '0', step: '0.1' })),
      u.field('Углеводы на 100', mk('c', 0, { type: 'number', min: '0', step: '0.1' })),
      u.field('Роль в рационе', u.select(roles, role, v => { role = v; })),
      u.field('Чем можно заменять', u.select(groups, grp, v => { grp = v; }))
    ]);

    u.modal('Новый продукт', body, [
      { label: 'Отмена' },
      {
        label: 'Добавить', cls: 'primary', onClick: function () {
          const name = f.n.value.trim();
          if (!name) { u.toast('Нужно название', 'bad'); return true; }

          const state = S().get();
          const id = 'custom_' + Date.now().toString(36);
          state.customProducts.push({
            id: id, n: name, cat: cat, unit: unit,
            pack: parseFloat(f.pack.value) || 500,
            pl: f.pl.value.trim() || 'упаковка',
            w: weighed === 'yes',
            pr: parseFloat(f.pr.value) || 0,
            k: parseFloat(f.k.value) || 0,
            p: parseFloat(f.p.value) || 0,
            f: parseFloat(f.f.value) || 0,
            c: parseFloat(f.c.value) || 0,
            wst: 0, life: 180,
            grp: grp === 'none' ? null : grp,
            role: role,
            pd: S().today(), seed: false
          });
          S().save();
          u.toast('Продукт добавлен');
          window.App.ui.refresh();
        }
      }
    ]);
  }

  window.App = window.App || {};
  window.App.views = window.App.views || {};
  window.App.views.prices = { title: 'Цены', render: render };
})();

/* ===== js/ui/view-reports.js ===== */
/* Отчёты: куда уходят деньги и как меняется цена вашей корзины.
 *
 * Все графики читают один и тот же срез, заданный фильтром сверху, поэтому
 * числа на разных карточках всегда согласованы между собой. */
(function () {
  'use strict';

  const U = () => window.App.ui;
  const S = () => window.App.store;
  const C = () => window.App.charts;
  const SH = () => window.App.shopping;

  let range = 8;   // сколько последних закупок показывать

  function render() {
    const u = U(), h = u.h;
    const state = S().get();
    const all = (state.history || []).slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    const history = range === 0 ? all : all.slice(-range);

    return h('div.view', {}, [
      filters(all.length),
      kpi(history),
      u.card(null, [spendChart(history)]),
      u.card(null, [categoryChart(history)]),
      u.card(null, [efficiencyCharts(history)]),
      howItFills(all.length)
    ]);
  }

  /* Фильтр один и стоит над всем, что он охватывает, — не внутри карточек. */
  function filters(total) {
    const u = U(), h = u.h;
    const options = [
      { value: '8', label: 'последние 8 закупок' },
      { value: '26', label: 'последние 26' },
      { value: '0', label: 'всё время' }
    ];
    return h('div.filters', {}, [
      u.select(options, String(range), function (v) { range = parseInt(v, 10); window.App.ui.refresh(); }),
      h('span.hint', { text: 'Записей всего: ' + total })
    ]);
  }

  function kpi(history) {
    const u = U(), h = u.h;
    const c = C();
    const withActual = history.filter(r => r.actual > 0);

    const avg = withActual.length
      ? withActual.reduce((s, r) => s + r.actual, 0) / withActual.length : 0;
    const budget = S().weeklyBudget().food;

    const withKcal = history.filter(r => r.kcal > 0 && r.actual > 0);
    const perKcal = withKcal.length
      ? withKcal.reduce((s, r) => s + r.actual / r.kcal * 1000, 0) / withKcal.length : 0;

    const drift = withActual.filter(r => r.planned > 0);
    const avgDrift = drift.length
      ? drift.reduce((s, r) => s + (r.actual - r.planned) / r.planned, 0) / drift.length * 100 : 0;

    return u.card('Коротко', [
      h('div.summary-grid', {}, [
        c.statTile('Бюджет на неделю', u.money(budget)),
        c.statTile('Средний чек за неделю', withActual.length ? u.money(avg) : '—',
          withActual.length ? {
            text: avg <= budget ? 'укладываетесь' : 'превышение на ' + u.money(avg - budget),
            good: avg <= budget, bad: avg > budget
          } : null),
        c.statTile('План против факта', drift.length ? u.signedPct(Math.round(avgDrift)) : '—',
          drift.length ? {
            text: Math.abs(avgDrift) < 10 ? 'план близок к реальности' : 'план заметно расходится с чеком',
            good: Math.abs(avgDrift) < 10, bad: Math.abs(avgDrift) >= 10
          } : null),
        c.statTile('Рубль за 1000 ккал', perKcal ? Math.round(perKcal) + ' ₽' : '—')
      ])
    ]);
  }

  function spendChart(history) {
    const c = C(), u = U();
    const budget = S().weeklyBudget().food;

    return c.groupedBars({
      title: 'Недельные траты: план и факт',
      subtitle: 'Столбики — расчёт приложения и сумма по чеку. Черта — бюджет на продукты.',
      groups: history.map(r => ({
        label: c.fmtDate(r.date),
        values: [
          { name: 'План', value: Math.round(r.planned || 0) },
          { name: 'Факт', value: Math.round(r.actual || 0) }
        ]
      })),
      refLine: budget > 0 ? { value: Math.round(budget), label: 'бюджет ' + Math.round(budget) + ' ₽' } : null,
      yFormat: v => c.fmtInt(v) + ' ₽',
      empty: 'Появится после первой отметки «Закупка завершена» в списке покупок.'
    });
  }

  /* Структура трат: категорий девять, и раскрашивать их в девять цветов нельзя —
     соседние классы сольются. Длина столбика говорит то же самое и честнее. */
  function categoryChart(history) {
    const c = C();
    const cats = window.App.CATEGORIES;

    // Берём факт, если он есть; иначе показываем структуру текущего плана,
    // чтобы график был полезен с первого дня.
    const last = history.filter(r => r.byCat && Object.keys(r.byCat).length).pop();
    let items, subtitle;

    if (last) {
      items = Object.keys(last.byCat).map(k => ({ label: cats[k] || k, value: last.byCat[k] }));
      subtitle = 'По закупке от ' + c.fmtDate(last.date) + '.';
    } else {
      const plan = S().get().plan;
      if (!plan) {
        return c.emptyFigure({
          title: 'Куда уходят деньги',
          empty: 'Соберите неделю — и здесь появится структура будущей закупки.'
        });
      }
      const list = SH().buildList(plan);
      items = list.byCategory.map(g => ({ label: g.name, value: g.sum }));
      subtitle = 'По текущему плану — закупок в истории ещё нет.';
    }

    return c.rankedBars({
      title: 'Куда уходят деньги',
      subtitle: subtitle,
      items: items
    });
  }

  /* Две величины разного масштаба не делят одну ось: вместо второй оси —
     два отдельных графика рядом. */
  function efficiencyCharts(history) {
    const u = U(), h = u.h, c = C();
    const rows = history.filter(r => r.actual > 0 && r.kcal > 0);

    if (rows.length < 2) {
      return c.emptyFigure({
        title: 'Во сколько обходится питание',
        subtitle: 'Рубль за 1000 ккал и за 100 г белка',
        empty: 'Нужно хотя бы две завершённые закупки — по одной точке тренда не бывает.'
      });
    }

    const kcalSeries = [{
      name: '₽ за 1000 ккал',
      color: 'var(--s1)',
      points: rows.map(r => ({ x: r.date, y: Math.round(r.actual / r.kcal * 1000) }))
    }];
    const protSeries = [{
      name: '₽ за 100 г белка',
      color: 'var(--s2)',
      points: rows.filter(r => r.protein > 0).map(r => ({ x: r.date, y: Math.round(r.actual / r.protein * 100) }))
    }];

    return h('div.small-multiples', {}, [
      c.lineChart({
        title: 'Рубль за 1000 ккал',
        subtitle: 'Сколько стоит энергия в вашей корзине — своя инфляция, а не средняя по стране.',
        series: kcalSeries, height: 180, yFormat: v => c.fmtInt(v) + ' ₽'
      }),
      c.lineChart({
        title: 'Рубль за 100 г белка',
        subtitle: 'Белок — самый дорогой макронутриент, по нему разница видна раньше всего.',
        series: protSeries, height: 180, yFormat: v => c.fmtInt(v) + ' ₽'
      })
    ]);
  }

  function howItFills(total) {
    const u = U(), h = u.h;
    if (total >= 3) return null;
    return u.card('Чем это наполняется', [
      h('ul.plain', {}, [
        h('li', { text: 'Каждая отметка «Закупка завершена» в списке покупок добавляет точку: план, факт, бюджет, калории и белок за неделю.' }),
        h('li', { text: 'Цены, которые вы правите в списке или на вкладке «Цены», ложатся в журнал с датой, маркой и магазином — из него строится график цены каждого продукта.' }),
        h('li', { text: 'График цены конкретного товара открывается на вкладке «Цены» кнопкой «История».' })
      ])
    ], 'muted');
  }

  window.App = window.App || {};
  window.App.views = window.App.views || {};
  window.App.views.reports = { title: 'Отчёты', render: render };
})();

/* ===== js/ui/view-settings.js ===== */
/* Настройки: бюджет, профили едоков, режим питания, регулярные траты, данные. */
(function () {

  /* Выбор расположения экранов.
   *
   * Настройка живёт на устройстве, а не в общих данных, и об этом сказано
   * прямо: иначе в общем хозяйстве переключение у одного перещёлкивало бы

  /* Диетические режимы человека.

  /* Свёрнутая строка вместо десяти карточек.

  function dietsBlock(person) {
